<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
  <title>History</title>
  <style>

:root {--fs-xl:24px;--fs-l:18px;--fs-m:16px;--fs-s:14px;
  color-scheme: light;
  --bg: #F3F4F6;
  --card: #FFFFFF;
  --subtle: #E6E8EC;
  --summary: #ECEFF2;
  --text: #1C1F23;
  --muted: #5B626A;
  --line: #DEE1E5;
  --rule: #C4C9CF;
  --accent: #0D6B6B;
  --accent-soft: #DCEEEE;
  --on-accent: #FFFFFF;
  --danger: #B3261E;
  --on-danger: #FFFFFF;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #121416;
    --card: #1B1E21;
    --subtle: #26292D;
    --summary: #272B2F;
    --text: #E8EAED;
    --muted: #A3AAB1;
    --line: #30353A;
    --rule: #4A5056;
    --accent: #5CC4BE;
    --accent-soft: #1F3B3A;
    --on-accent: #0B1F1F;
    --danger: #F28B82;
    --on-danger: #3B0A07;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #121416;
  --card: #1B1E21;
  --subtle: #26292D;
  --summary: #272B2F;
  --text: #E8EAED;
  --muted: #A3AAB1;
  --line: #30353A;
  --rule: #4A5056;
  --accent: #5CC4BE;
  --accent-soft: #1F3B3A;
  --on-accent: #0B1F1F;
  --danger: #F28B82;
  --on-danger: #3B0A07;
}

* { box-sizing: border-box; }
html {
  scroll-behavior: smooth;
  background: var(--bg);
}
body {
  margin: 0;
  min-width: 0;
  overflow-wrap: break-word;
  background: var(--bg);
  color: var(--text);
  font-family: Pretendard, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  font-size: var(--fs-m);
  font-weight: 400;
  line-height: 1.6;
  letter-spacing: -0.01em;
  word-break: keep-all;
  -webkit-font-smoothing: antialiased;
}
button, input, textarea, summary { font: inherit; letter-spacing: inherit; }
button, a, summary { -webkit-tap-highlight-color: transparent; }
a { color: inherit; }
button { cursor: pointer; }
[hidden] { display: none; }
.wrap {
  width: min(100%, 560px);
  margin: 0 auto;
  padding: 24px 16px calc(32px + env(safe-area-inset-bottom));
}
.view-panel { min-width: 0; }

.primary-tabs {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 4px;
  margin: 0 0 24px;
  padding: 4px;
  border-radius: 999px;
  background: var(--subtle);
}
.primary-tab {
  min-height: 44px;
  padding: 8px 16px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: var(--muted);
  font-size: var(--fs-m);
  font-weight: 700;
}
.primary-tab[aria-selected="true"] {
  background: var(--card);
  color: var(--text);
  font-weight: 700;
}

.filters,
.era-filters,
.term-filters {
  display: flex;
  gap: 8px;
  margin: 0 0 24px;
  flex-wrap: wrap;
  overflow-x: visible;
}
.filters::-webkit-scrollbar,
.era-filters::-webkit-scrollbar,
.term-filters::-webkit-scrollbar,
.study-tabs::-webkit-scrollbar { display: none; }
.filter,
.era-filter,
.term-filter {
  flex: 0 0 auto;
  min-height: 44px;
  padding: 8px 16px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--card);
  color: var(--muted);
  font-size: var(--fs-s);
  font-weight: 700;
  white-space: nowrap;
}
.term-filter { font-weight: 700; }
.filter[aria-selected="true"],
.era-filter[aria-pressed="true"],
.term-filter[aria-pressed="true"] {
  border-color: var(--accent-soft);
  background: var(--accent-soft);
  color: var(--accent);
  font-weight: 700;
}

.records,
.era-overviews,
.composer-list,
.instrument-list { display: grid; gap: 16px; }
.era-group,
.timeline-list,
.term-list,
.instrument-section,
.reading-card {
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--card);
}
.record {
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--card);
}
.record-top {
  display: grid;
  grid-template-columns: 64px minmax(0, 1fr);
  gap: 16px;
  align-items: center;
  padding: 16px;
  border-bottom: 1px solid var(--line);
  background: var(--card);
}
.date-block {
  display: flex;
  min-height: 80px;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding-right: 16px;
  border-right: 1px solid var(--line);
  text-align: center;
}
.date-block .month,
.date-block .weekday {
  color: var(--muted);
  font-size: var(--fs-s);
  line-height: 1.35;
}
.date-block .day {
  display: block;
  font-family: inherit;
  font-size: var(--fs-xl);
  font-weight: 700;
  line-height: 1.35;
}
.status {
  display: inline-flex;
  min-height: 24px;
  align-items: center;
  margin: 0 0 8px;
  padding: 4px 12px;
  border-radius: 999px;
  background: var(--accent-soft);
  color: var(--accent);
  font-size: var(--fs-s);
  font-weight: 700;
  line-height: 1.35;
}
.record h3 {
  margin: 0;
  font-size: var(--fs-l);
  font-weight: 700;
  line-height: 1.35;
}
.place {
  margin: 8px 0 0;
  color: var(--muted);
  font-size: var(--fs-s);
}
.program { padding: 16px; }
.section-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin: 0 0 8px;
}
.section-row h4,
.program > h4,
.people h4 {
  margin: 0;
  font-size: var(--fs-m);
  font-weight: 700;
  line-height: 1.35;
}
.program-credits { margin: 0 0 24px; }
.piece { border-top: 1px solid var(--line); }
.piece:first-of-type { border-top: 0; }
.piece-body { padding: 0 0 16px; }
.piece-copy { display: grid; gap: 12px; }
.piece-copy p { margin: 0; color: var(--muted); font-family: inherit; font-size: var(--fs-m); }
.soloist-info { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line); }
.soloist-info h4 { margin: 0 0 8px; font-size: var(--fs-m); font-weight: 700; line-height: 1.35; }
.soloist-info p { margin: 0; color: var(--muted); font-family: inherit; font-size: var(--fs-m); }

/* Every disclosure uses the same row and arrow. */
details { border-top: 1px solid var(--line); }
details:first-child { border-top: 0; }
summary {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 12px;
  min-height: 44px;
  align-items: center;
  padding: 12px 16px;
  color: var(--text);
  font-size: var(--fs-m);
  font-weight: 700;
  line-height: 1.35;
  list-style: none;
  text-decoration: none;
  cursor: pointer;
}
summary::-webkit-details-marker { display: none; }
summary::marker { content: ""; }
summary::after {
  content: "⌄";
  color: var(--muted);
  font-size: var(--fs-m);
  line-height: 1.35;
  transition: transform .16s ease;
}
details[open] > summary::after { transform: rotate(180deg); }
details:not([open]) > :not(summary) { display: none; }
.performer-detail { border-top: 1px solid var(--line); }
.performer-detail:first-child { border-top: 0; }
.performer-detail > p {
  margin: 0;
  padding: 0 16px 16px;
  color: var(--muted);
  font-family: inherit;
  font-size: var(--fs-m);
}
.piece-performer { display: flex; }
.piece-performer::after { margin-left: auto; }
.piece-performer .role-label { margin-right: 0; color: var(--muted); font-size: var(--fs-s); font-weight: 400; }
.piece-performer .role-label::after { content: " · "; }
.piece-performer .performer-name { color: var(--text); font-size: var(--fs-m); font-weight: 700; }
.piece-summary-copy { min-width: 0; }
.piece-title { display: block; font-size: var(--fs-m); font-weight: 700; }
.piece-credit { display: block; margin-top: 4px; color: var(--muted); font-size: var(--fs-s); font-weight: 400; }
.record > details > summary { padding: 12px 16px; border-top: 1px solid var(--line); }
.detail-body { padding: 0 16px 16px; }
.info-detail > summary { padding-left: 0; padding-right: 0; }
.info-section { padding-top: 16px; }
.info-section h4 { margin: 0 0 8px; font-size: var(--fs-m); font-weight: 700; line-height: 1.35; }
.info-list { margin: 0; padding-left: 16px; color: var(--muted); }
.info-list li + li { margin-top: 4px; }
.booking {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 12px;
  align-items: center;
  padding: 16px 0;
  border-bottom: 1px solid var(--line);
}
.booking p { margin: 0; color: var(--muted); }
.booking strong { display: block; color: var(--text); font-size: var(--fs-m); }
.booking span { display: block; margin-top: 4px; font-size: var(--fs-s); overflow-wrap: anywhere; }
.copy {
  min-height: 44px;
  padding: 8px 16px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--card);
  color: var(--accent);
  font-size: var(--fs-s);
  font-weight: 700;
}
.caveat { margin: 16px 0 0; color: var(--muted); font-size: var(--fs-s); }
.prep-list { display: grid; gap: 0; }
.prep-link {
  display: grid;
  min-height: 44px;
  align-content: center;
  padding: 12px 0;
  border-top: 1px solid var(--line);
  color: var(--accent);
  text-decoration: none;
}
.prep-link:first-child { border-top: 0; }
.prep-link strong { font-size: var(--fs-m); font-weight: 700; }
.prep-link strong::after { content: " ↗"; }
.prep-link span { color: var(--muted); font-size: var(--fs-s); }

/* Study navigation */
.study-search-wrap { position: relative; margin: 0 0 16px; }
.study-search {
  width: 100%;
  min-height: 44px;
  padding: 8px 16px;
  border: 1px solid var(--line);
  border-radius: 12px;
  outline: 0;
  background: var(--card);
  color: var(--text);
  font-size: var(--fs-m);
}
.study-search::placeholder { color: var(--muted); }
.study-search:focus { border-color: var(--accent); }
.search-results {
  position: absolute;
  inset: calc(100% + 4px) 0 auto;
  z-index: 4;
  max-height: 384px;
  overflow-y: auto;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--card);
}
.search-result {
  display: grid;
  grid-template-columns: 64px minmax(0, 1fr) auto;
  gap: 8px;
  width: 100%;
  min-height: 44px;
  align-items: center;
  padding: 8px 12px;
  border: 0;
  border-top: 1px solid var(--line);
  background: transparent;
  color: var(--accent);
  text-align: left;
}
.search-result::after { content: none; }
.search-result:first-child { border-top: 0; }
.search-kind { color: var(--accent); font-size: var(--fs-s); font-weight: 700; }
.search-copy strong { display: block; font-size: var(--fs-m); font-weight: 700; }
.search-copy span { display: block; color: var(--muted); font-size: var(--fs-s); }
.search-empty, .term-empty, .empty { margin: 0; padding: 24px 16px; color: var(--muted); text-align: center; }
.empty strong { display: block; color: var(--text); }
.study-tabs {
  display: flex;
  gap: 16px;
  margin: 0 0 16px;
  overflow-x: auto;
  border-bottom: 1px solid var(--line);
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}
.study-tab {
  position: relative;
  flex: 0 0 auto;
  min-height: 44px;
  padding: 8px 0;
  border: 0;
  background: transparent;
  color: var(--muted);
  font-size: var(--fs-m);
  font-weight: 700;
  white-space: nowrap;
}
.study-tab[aria-selected="true"] { color: var(--accent); font-weight: 700; }
.study-count { margin: 0 0 12px; color: var(--muted); font-size: var(--fs-s); }
.timeline-heading-row { margin-top: 24px; }
.era-tabs {
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: 8px;
  margin: 0 0 16px;
}
.era-tab:first-child { grid-column: span 2; }
.era-tab {
  min-width: 0;
  min-height: 44px;
  padding: 8px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--card);
  color: var(--muted);
  font-size: var(--fs-s);
  font-weight: 700;
}
.era-tab[aria-pressed="true"] {
  border-color: var(--accent-soft);
  background: var(--accent-soft);
  color: var(--accent);
}
.dictionary-subtabs {
  display: flex;
  flex-wrap: wrap;
  gap: 0 16px;
  margin: 0 0 16px;
  border-bottom: 1px solid var(--line);
}
.dictionary-subtab {
  position: relative;
  min-height: 44px;
  padding: 8px 0;
  border: 0;
  background: transparent;
  color: var(--muted);
  font-size: var(--fs-m);
  font-weight: 700;
  line-height: 1.35;
  text-align: left;
}
.dictionary-subtab[aria-selected="true"] { color: var(--accent); font-weight: 700; }
.dictionary-subpanel { line-height: 1.6; }

.era-banner {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  padding: 16px 16px 0;
}
.era-banner strong { font-size: var(--fs-l); font-weight: 700; line-height: 1.35; }
.era-banner span { color: var(--muted); font-size: var(--fs-s); }
.era-description { padding: 12px 16px 0; }
.era-description > p { margin: 0; }
.era-description > .era-first-listen { margin: 16px 0 0; padding-top: 16px; border-top: 1px solid var(--line); }
.era-first-listen strong { display: block; margin-bottom: 4px; font-size: var(--fs-m); }
.era-notes { margin-top: 8px; }
.era-notes > summary { padding: 8px 0; }
.era-notes-body { padding: 0 0 16px; }
.era-notes-body ul,
.study-card-body ul,
.key-guide { margin: 0; padding-left: 16px; color: var(--muted); }
.key-table { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); overflow: hidden; border: 1px solid var(--line); border-radius: 12px; }
.key-cell { padding: 8px 4px; border-left: 1px solid var(--line); text-align: center; }
.key-cell:first-child { border-left: 0; }
.key-cell strong, .key-cell span { display: block; }
.key-cell span { color: var(--muted); font-size: var(--fs-s); }
.era-notes-body li + li,
.study-card-body li + li,
.key-guide li + li { margin-top: 8px; }
.era-genres { margin-top: 12px; }
.era-genres .genre-text { color: var(--muted); font-size: var(--fs-s); font-weight: 400; }
.era-genres .study-link {
  min-height: 0;
  padding: 0;
  font-size: var(--fs-s);
  font-weight: 400;
}
.era-genres .study-link-list > * + *::before {
  content: "·";
  margin: 0 6px;
  color: var(--muted);
  font-size: var(--fs-s);
  font-weight: 400;
}
.era-composer-list { border-top: 1px solid var(--line); }
.nested-composer { border-top: 1px solid var(--line); }
.nested-composer:first-child { border-top: 0; }
.nested-composer > summary { min-height: 48px; padding: 8px 16px; }
.composer-summary {
  display: flex;
  min-width: 0;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
}
.composer-summary strong { color: var(--accent); font-size: var(--fs-m); font-weight: 700; }
.composer-years { flex: 0 0 auto; color: var(--muted); font-size: var(--fs-s); font-weight: 400; }
.study-card-body { padding: 0 16px 16px; }
.study-card-body > p { margin: 0; }
.composer-detail-name { padding: 16px 0 12px; color: var(--muted); font-size: var(--fs-s); }
.study-card-body h4,
.reading-card h4 { margin: 24px 0 8px; font-size: var(--fs-m); font-weight: 700; line-height: 1.35; }
.work-row { scroll-margin-top: 64px; }
.work-row.work-highlight { color: var(--accent); font-weight: 700; }
.related-block {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 4px 12px;
  margin-top: 24px;
  padding-top: 12px;
  border-top: 1px solid var(--line);
}
.related-label { color: var(--muted); font-size: var(--fs-s); font-weight: 400; line-height: 1.6; }
.study-link-list { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0; font-size: var(--fs-s); font-weight: 400; line-height: 1.6; }
.related-block:not(.era-genres) .study-link-list .study-link + .study-link::before {
  content: "·";
  margin: 0 6px;
  color: var(--muted);
  font-size: var(--fs-s);
  font-weight: 400;
}
.study-link,
.composer-link {
  display: inline-flex;
  min-height: 44px;
  align-items: center;
  padding: 4px 0;
  border: 0;
  background: transparent;
  color: var(--accent);
  font-size: var(--fs-m);
  font-weight: 700;
  text-align: left;
  text-decoration: none;
}
.related-block .study-link {
  min-height: 0;
  padding: 0;
  font-size: var(--fs-s);
  font-weight: 400;
}
.study-link::after,
.composer-link::after { content: none; }
.source-link {
  display: inline-flex;
  min-height: 44px;
  align-items: center;
  color: var(--accent);
  font-size: var(--fs-m);
  font-weight: 700;
  text-decoration: none;
}
.source-link::after { content: " ↗"; }
.reference-sources { margin-top: 16px; }
.concerto-flow { display: grid; gap: 8px; }
.concerto-flow div { display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: 8px; color: var(--muted); }
.concerto-flow strong { color: var(--text); }

.timeline-list { display: grid; gap: 0; }
.term-list {
  display: grid;
  gap: 12px;
  overflow: visible;
  border: 0;
  border-radius: 0;
  background: transparent;
}
.timeline-row {
  display: grid;
  grid-template-columns: 56px minmax(0, 1fr);
  gap: 12px;
  align-items: start;
  padding: 12px 16px;
  border-top: 1px solid var(--line);
  font-size: var(--fs-m);
  line-height: 1.6;
  text-align: left;
}
.timeline-row:first-child { border-top: 0; }
.timeline-year { color: var(--muted); font-size: var(--fs-m); font-weight: 700; line-height: inherit; }
.timeline-copy { min-width: 0; color: var(--text); font-size: var(--fs-m); line-height: inherit; }
.timeline-copy .study-link {
  display: inline;
  min-height: 0;
  padding: 0;
  font-size: var(--fs-m);
  line-height: inherit;
  vertical-align: baseline;
}
.term-row {
  display: grid;
  grid-template-columns: minmax(80px, 1fr) minmax(0, 2fr);
  gap: 16px;
  padding: 12px 16px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--card);
}
.term-name { font-size: var(--fs-m); font-weight: 700; }
.term-body { min-width: 0; }
.term-definition { margin: 0; color: var(--muted); }
.term-body .related-block { margin-top: 12px; padding-top: 8px; }
.term-row[data-category="형식 · 장르"] .related-block {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 4px 12px;
}
.term-row[data-category="형식 · 장르"] .related-label { margin: 0; }
.term-row[data-category="형식 · 장르"] .study-link-list { gap: 0; }
.term-row[data-category="형식 · 장르"] .study-link {
  min-height: 0;
  padding: 0;
  font-size: var(--fs-s);
  font-weight: 400;
}
.term-row[hidden] { display: none; }

.instrument-intro { margin: 0 0 16px; }
.instrument-intro p { margin: 0; }
.instrument-intro p + p { margin-top: 8px; }
.instrument-body { padding: 0 16px 16px; }
.instrument-body > p { margin: 0 0 12px; color: var(--muted); }
.instrument-row { padding: 12px 0; border-top: 1px solid var(--line); }
.instrument-row strong { display: block; font-size: var(--fs-m); font-weight: 700; }
.instrument-row span { display: block; margin-top: 4px; color: var(--muted); }
.reading-card { padding: 16px; }
.reading-card > p { margin: 0; }
.catalogue-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 16px; }
.catalogue-row { padding: 12px 0; border-top: 1px solid var(--line); }
.catalogue-row strong { display: block; font-size: var(--fs-m); font-weight: 700; }
.catalogue-row span { display: block; margin-top: 4px; color: var(--muted); }
.note-field { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line); }
.note-field label { display: block; margin-bottom: 8px; font-size: var(--fs-m); font-weight: 700; }
.note-field textarea {
  width: 100%;

}

.toast {
  position: fixed;
  left: 50%;
  bottom: calc(16px + env(safe-area-inset-bottom));
  z-index: 8;
  transform: translateX(-50%);
  padding: 8px 16px;
  border-radius: 999px;
  background: var(--text);
  color: var(--card);
  font-size: var(--fs-s);
  opacity: 0;
  pointer-events: none;
}
.toast.show { opacity: 1; }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (max-width: 440px) {
  .record-top { grid-template-columns: 56px minmax(0, 1fr); gap: 12px; }
  .date-block { padding-right: 12px; }
  .term-row { grid-template-columns: 1fr; gap: 4px; }
  .catalogue-grid { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  summary::after { transition: none; }
}

  
[hidden] { display: none !important; }
.era-tabs { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.era-tab:first-child { grid-column: auto; }

.term-row .related-label { margin: 0; }
.term-filters { gap: 8px; }
.artist-links { display: flex; flex-wrap: wrap; gap: 0 16px; }

.record-memo > summary { padding-left: 0; padding-right: 0; }
.empty { padding: 32px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--muted); text-align: center; }

.leftover p { margin: 0 0 12px; }
.leftover-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.btn-primary, .btn-danger { min-height: 48px; border-radius: 12px; font-size: var(--fs-m); font-weight: 700; }
.btn-primary { border: 0; background: var(--accent); color: var(--on-accent); }
.btn-danger { border: 1px solid var(--line); background: transparent; color: var(--danger); }
.btn-danger.confirm { border-color: var(--danger); background: var(--danger); color: var(--on-danger); }
.record-top { grid-template-columns: 76px minmax(0, 1fr); }

.study-tabs { gap: 16px; }
.era-fold > summary { list-style: none; cursor: pointer; }
.era-fold > summary::-webkit-details-marker { display: none; }

.era-fold[open] > summary .era-banner { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 0; }
.era-banner strong { font-size: var(--fs-m); }
.era-banner span { color: var(--muted); font-size: var(--fs-s); font-weight: 400; }
.era-description { padding: 16px 16px 20px; }

.study-card-body { padding: 16px 16px 20px; }

.related-block { margin-top: 20px; }
.related-block, .era-genres, .term-row .related-block, .term-body .related-block { display: flex; flex-wrap: nowrap; align-items: baseline; gap: 16px; border-top: 0; padding-top: 0; }
.related-block .study-link-list { flex: 1 1 0; min-width: 0; }
.related-block .study-link-list { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; }

.related-block .study-link-list > * + *::before,
.era-genres .study-link-list > * + *::before { content: none; margin: 0; }
.era-notes { border-top: 0; }
.related-label, .related-block .study-link, .related-block .genre-text, .era-genres .study-link, .era-genres .genre-text { font-size: var(--fs-s); }
.related-label { display: block; flex: 0 0 auto; margin: 0; color: var(--muted); font-weight: 400; }

.related-block .study-link, .related-block .genre-text { min-height: 0; padding: 0; font-weight: 400; line-height: 1.6; }

.timeline-tag { color: var(--muted); }
.fold-body > .era-people { margin-top: 16px; }
.era-people + .era-genres { margin-top: 8px; }
.people-text { flex: 1 1 0; min-width: 0; font-size: var(--fs-s); line-height: 1.6; }
.event-sum { font-weight: 700; }
.place-list { margin: 0; }
.study-tabs { gap: 20px; }

/* Bottom navigation and screen header */
.wrap { padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
/* 화면 맨 위 제목: 카드 제목보다 작게, 가운데, 양옆에 가는 두 줄. 위에 고정하지 않는다 */
.wrap { padding-top: 0; }
.screen-head { margin: 0 0 12px; padding: 12px 0 0; text-align: center; }
.screen-head h1 {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  margin: 0;
  font-size: var(--fs-l);
  font-weight: 700;
  line-height: 1.4;
  letter-spacing: 0.04em;
}
.screen-head h1::before,
.screen-head h1::after {
  content: "";
  width: 36px;
  height: 4px;
  border-top: 1px solid var(--rule);
  border-bottom: 1px solid var(--rule);
}
.bottom-tabs {
  position: fixed;
  left: 50%;
  bottom: 0;
  z-index: 10;
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  width: min(100%, 560px);
  transform: translateX(-50%);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  border-top: 1px solid var(--line);
  background: var(--card);
}
.bottom-tab {
  position: relative;
  min-width: 0;
  min-height: 56px;
  padding: 8px 2px;
  border: 0;
  background: transparent;
  color: var(--muted);
  font-size: var(--fs-s);
  font-weight: 700;
  white-space: nowrap;
}
.bottom-tab[aria-selected="true"] { color: var(--accent); }
.bottom-tab { display: grid; justify-items: center; align-content: center; gap: 2px; min-height: 60px; padding: 6px 2px; }
.bottom-tab svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.bottom-tab[aria-selected="true"]::before {
  content: "";
  position: absolute;
  top: 0;
  left: 28%;
  right: 28%;
  height: 3px;
  border-radius: 0 0 3px 3px;
  background: var(--accent);
}
.toast { bottom: calc(72px + env(safe-area-inset-bottom, 0px)); }

/* 카드 규칙: 카드 = 머리 + ＋ 줄. 펼친 줄은 제목 줄에만 옅은 배경, 첫 단계는 왼쪽 끝에 강조색 막대 */
:root { --radius: 16px; --pad: 20px; --row: 52px; --stick: 0px; }
#study-eras, #study-dictionary, #picks-panel { --stick: 60px; }
.fold-card,
.record,
.timeline-list,
.empty { overflow: clip; border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); }
.fold-head { padding: var(--pad); border-bottom: 1px solid var(--line); }
.fold-title { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 10px; }
.fold-title h3 { min-width: 0; margin: 0; font-size: var(--fs-l); font-weight: 700; line-height: 1.3; }
.card-badge {
  flex: 0 0 auto;
  margin-left: auto;
  padding: 2px 10px;
  border-radius: 999px;
  background: var(--subtle);
  color: var(--muted);
  font-size: var(--fs-s);
  white-space: nowrap;
}
.fold-head p { margin: 8px 0 0; color: var(--muted); font-size: var(--fs-s); }

details > summary,
details[open] > summary { background: transparent; box-shadow: none; }
summary::after {
  content: "";
  flex: 0 0 auto;
  width: 11px;
  height: 11px;
  margin-right: 2px;
  background: linear-gradient(var(--muted), var(--muted)) center / 11px 1.5px no-repeat,
              linear-gradient(var(--muted), var(--muted)) center / 1.5px 11px no-repeat;
  transform: none;
  transition: background-size .16s ease;
}
details[open] > summary::after { transform: none; background-size: 11px 1.5px, 1.5px 0; }

.fold-row { border-top: 1px solid var(--line); scroll-margin-top: var(--stick); }
.fold-card { scroll-margin-top: var(--stick); }
.fold-head + .fold-row,
.record-top + .fold-row { border-top: 0; }
.fold-row > summary {
  display: flex;
  min-height: var(--row);
  align-items: center;
  gap: 12px;
  padding: 14px var(--pad);
}
.row-name { display: flex; flex: 1 1 auto; min-width: 0; align-items: baseline; gap: 8px; }
.row-name strong { min-width: 0; color: var(--text); font-size: var(--fs-m); font-weight: 700; }
.row-meta { flex: 0 0 auto; color: var(--muted); font-size: var(--fs-s); font-weight: 400; }
.row-year,
.card-badge,
.timeline-year,
.date-block { font-variant-numeric: tabular-nums; }
.row-year { flex: 0 0 auto; color: var(--muted); font-size: var(--fs-s); font-weight: 400; }
.fold-card > .fold-row[open],
.record > .fold-row[open] { box-shadow: inset 3px 0 0 var(--accent); }
.fold-card > .fold-row[open] > summary,
.record > .fold-row[open] > summary {
  position: sticky;
  top: var(--stick);
  z-index: 3;
  background: var(--summary);
  box-shadow: inset 3px 0 0 var(--accent), 0 1px 0 var(--line);
}
.fold-body { padding: 14px var(--pad) var(--pad); }
.fold-body > p { margin: 0; }
.fold-body > p + p { margin-top: 8px; }
.fold-years { color: var(--muted); font-size: var(--fs-s); }
.fold-body .term-definition { color: var(--text); }
.fold-body .memo-text { padding: 0; color: var(--text); }
.fold-body .place-extra { margin: 0; }
/* 박물관 정보: 왼쪽 목차, 오른쪽 내용. 함께 보기도 같은 칸에 맞춰 마지막 줄로 */
.info-table { margin: 0; }
.info-row,
.info-table + .related-block {
  display: grid;
  grid-template-columns: 5em minmax(0, 1fr);
  gap: 12px;
  align-items: baseline;
  margin: 0;
  padding: 10px 0;
  border-top: 1px solid var(--line);
}
.info-row:first-child { padding-top: 0; border-top: 0; }
.info-table + .related-block { padding-bottom: 0; }
.info-row dt { color: var(--muted); font-size: var(--fs-s); }
.info-row dd { margin: 0; }
/* 한 단계 안쪽 ＋ 줄(대표 작품): 접힌 줄은 내용 폭, 펼친 제목 줄 배경은 카드 폭 전체로 깔고 바깥 막대를 다시 그린다.
   펼친 내용은 왼쪽 회색 안내선과 함께 14px 들여 쓴다 */
.inner-list { padding-top: 0; padding-bottom: 8px; }
.inner-row { border-top: 1px solid var(--line); scroll-margin-top: calc(var(--stick) + var(--row)); }
.inner-row:first-child { border-top: 0; }
.inner-row > summary { display: flex; min-height: var(--row); align-items: center; gap: 12px; padding: 14px 0; }
.inner-row[open] > summary {
  position: sticky;
  top: calc(var(--stick) + var(--row));
  z-index: 2;
  margin: 0 calc(-1 * var(--pad));
  padding-right: var(--pad);
  padding-left: var(--pad);
  background: var(--summary);
  box-shadow: inset 3px 0 0 var(--accent), 0 1px 0 var(--line);
}
.inner-body { margin: 14px 0 16px; padding-left: 14px; border-left: 2px solid var(--line); }
.inner-body > p { margin: 0; }
.inner-body > p + p { margin-top: 6px; }
.inner-body .inner-meta { color: var(--muted); font-size: var(--fs-s); }
.fold-body > .composer-detail-name { margin: 0 0 8px; padding: 0; }
.fold-card > .era-notes { margin-top: 0; }

.record-top { padding: var(--pad); }
.record h3 { font-size: var(--fs-l); line-height: 1.35; }
.timeline-row { padding: 12px var(--pad); }
.records > .record { scroll-margin-top: 16px; }

/* 카드가 많으면 탭: 알약 탭 한 줄, 가로로 밀고 위에 고정 */
.card-tabs {
  position: sticky;
  top: 0;
  z-index: 5;
  display: flex;
  flex-wrap: nowrap;
  gap: 8px;
  margin: 0 -16px 8px;
  padding: 8px 16px;
  overflow-x: auto;
  background: var(--bg);
  scrollbar-width: none;
}
.card-tabs::-webkit-scrollbar { display: none; }
.study-search-wrap { z-index: 6; }
.card-tabs > * { flex: 0 0 auto; min-width: auto; padding: 8px 16px; }

  </style>
</head>

    /* ---------- study: region ---------- */
    function setRegion(r) {
      activeRegion = r;

    /* 시대 탭: 고른 탭의 시대 카드만 보인다(조선은 전기·후기 두 장). 탭 줄이 위에 붙어 있으면 카드 맨 위로 올린다.
       시대 이름이나 탭 이름(지역 · 탭)을 받는다 */
    function setEra(name) {
      var key = eraByName[name] ? tabKey(name) : name;
      var region = String(key).split(' · ')[0];
      if (tabsOf(region).indexOf(key) === -1) return;
      activeEra = key;
      saveTab('era:' + region, key);
      var tab = null;
      qsa('#era-picker .term-filter').forEach(function (b) {
        var sel = b.getAttribute('data-era-jump') === key;
        b.setAttribute('aria-pressed', sel ? 'true' : 'false');
        if (sel) tab = b;
      });
      var card = null;
      qsa('[data-era-card]').forEach(function (g) {
        g.hidden = g.getAttribute('data-era-tab') !== key;
        if (!g.hidden && !card) card = g;
      });
      if (tab) tab.scrollIntoView({ block: 'nearest', inline: 'nearest' });
      if (card && card.getBoundingClientRect().top < 60) card.scrollIntoView({ block: 'start' });

    /* ---------- study: navigation ---------- */

    var SCREENS = ['visits', 'korea', 'world', 'timeline', 'dictionary'];
    var REGION_OF = { korea: '한국사', world: '세계사' };
    var SCREEN_OF = { '한국사': 'korea', '세계사': 'world' };

      var panel = REGION_OF[name] ? 'eras' : name;

    function reveal(target) {

    function goTo(kind, value) {
      closeSearch();

        qsa('.composer-card[open], .era-notes[open]').forEach(function (c) { if (c !== card) c.open = false; });
        if (eraByName[ev.era]) setRegion(eraByName[ev.era].region);

        activateStudySection('eras');

        setEra(value);
        reveal(qsa('[data-era-card]').filter(function (c) { return c.getAttribute('data-era-card') === value; })[0]);

      }
      if (kind === 'timeline') {
        activateStudySection('timeline');
        window.requestAnimationFrame(function () { studyView.scrollIntoView({ block: 'start' }); });

        reveal(qsa('[data-dictionary-card]').filter(function (c) {

    /* ---------- study: search ---------- */
    function buildEntries() {

        e.push({ kind: 'place', type: '추천', title: p.name, subtitle: p.where + ' · ' + p.era, value: p.name, search: [p.name, p.where, p.era, p.see].join(' ') });

    var entries = buildEntries();
    function updateSearch() {
      var input = $('study-search'), box = $('study-search-results');
      var q = input.value.trim().toLocaleLowerCase('ko-KR');
      box.textContent = '';
      if (!q) { box.hidden = true; input.setAttribute('aria-expanded', 'false'); return; }
      var matches = entries.map(function (en) {
        var title = en.title.toLocaleLowerCase('ko-KR');
        var alias = (en.alias || en.title).toLocaleLowerCase('ko-KR');
        var s = en.search.toLocaleLowerCase('ko-KR');
        var score = (title === q || alias === q) ? 0 : (title.indexOf(q) === 0 || alias.indexOf(q) === 0) ? 1 : (title.indexOf(q) !== -1 || alias.indexOf(q) !== -1) ? 2 : s.indexOf(q) !== -1 ? 3 : 9;
        return { en: en, score: score };
      }).filter(function (r) { return r.score < 9; }).sort(function (a, b) {
        return a.score - b.score || a.en.title.localeCompare(b.en.title, 'ko-KR');
      }).slice(0, 12);
      if (!matches.length) box.appendChild(el('p', 'search-empty', '찾는 내용이 없음'));
      matches.forEach(function (r) {

    /* ---------- visits: storage ---------- */
    var records;
    /* 방문 기록의 원본은 이 파일. 추가·수정·삭제는 Claude가 RECORDS를 고쳐서 한다 */
    var RECORDS = [
      { id: 'seed-hk-tea', title: '홍콩 차박물관', venue: '홍콩 홍콩공원 안', date: '2026-09-25', time: '', visited: true, topics: ['아편전쟁'], memo: '', museum: 'hk-tea-ware' }
    ];
    records = RECORDS.slice();

    /* 예전 판에서 이 기기에 저장한 추가·수정·삭제. 화면에는 쓰지 않고, 남아 있으면 복사해서 Claude에게 보내도록 알린다 */
    function recordKey(r) { return JSON.stringify([r.title || '', r.venue || '', r.date || '', r.time || '', !!r.visited, r.topics || [], r.memo || '']); }
    function leftovers() {
      var stored = null, added = [], edited = [], removed = [];
      try {
        stored = JSON.parse(window.localStorage.getItem(STORE_KEY) || 'null');
      } catch (e) { stored = null; }
      if (!Array.isArray(stored)) return { added: added, edited: edited, removed: removed, n: 0 };
      var byId = {};
      RECORDS.forEach(function (r) { byId[r.id] = r; });
      stored.forEach(function (r) {
        if (!r || typeof r.title !== 'string') return;
        var f = byId[r.id];
        if (!f) added.push(r);
        else if (recordKey(r) !== recordKey(f)) edited.push(r);
      });
      RECORDS.forEach(function (f) {
        if (!stored.some(function (r) { return r && r.id === f.id; })) removed.push(f);
      });
      return { added: added, edited: edited, removed: removed, n: added.length + edited.length + removed.length };
    }
    function recordText(r) {
      return '이름: ' + r.title +
        '\n날짜: ' + (r.date ? r.date.replace(/-/g, '.') : '없음') + (r.time ? ' ' + r.time : '') +
        '\n장소: ' + (r.venue || '') +
        '\n상태: ' + (r.visited ? '다녀옴' : '예정') +
        (r.topics && r.topics.length ? '\n함께 보기: ' + r.topics.join(', ') : '') +
        (r.memo ? '\n메모: ' + r.memo : '') + '\n';
    }
    function leftoverText(L) {
      var t = '[역사] 예전에 이 기기에서 추가하거나 고친 방문 기록. 파일에 옮겨 줘.\n';
      L.added.forEach(function (r) { t += '\n■ 추가한 기록\n' + recordText(r); });
      L.edited.forEach(function (r) { t += '\n■ 고친 기록\n' + recordText(r); });
      if (L.removed.length) t += '\n■ 지운 기록: ' + L.removed.map(function (r) { return r.title; }).join(', ') + '\n';
      return t;
    }
    var left = leftovers();
    function renderLeftover() {
      $('leftover').hidden = !left.n || filter === 'picks';
      $('leftover-copy').textContent = '이 기기에만 저장된 방문 기록 ' + left.n + '개가 남아 있음. 복사해서 Claude에게 보내면 파일에 옮김. 옮긴 뒤 지우기.';
    }
    function copyText(text) {
      function fallback() {
        try {
          var ta = el('textarea');
          ta.value = text;
          ta.setAttribute('readonly', '');
          ta.style.position = 'fixed';
          ta.style.top = '-1000px';
          document.body.appendChild(ta);
          ta.select();
          var ok = document.execCommand('copy');
          document.body.removeChild(ta);
          showToast(ok ? '복사됨' : '복사가 막힘');
        } catch (e) { showToast('복사가 막힘'); }
      }
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { showToast('복사됨'); }, fallback);
      else fallback();
    }
    function todayKR() {
      var parts = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Seoul', year: 'numeric', month: '2-digit', day: '2-digit' }).formatToParts(new Date());
      var v = {};
      parts.forEach(function (p) { v[p.type] = p.value; });
      return v.year + '-' + v.month + '-' + v.day;
    }
    var WEEK = ['일요일', '월요일', '화요일', '수요일', '목요일', '금요일', '토요일'];
    function fmtTime(t) {
      if (!t) return '';
      var p = t.split(':'), h = Number(p[0]), m = p[1];
      return (h < 12 ? '오전 ' : '오후 ') + (h % 12 === 0 ? 12 : h % 12) + ':' + m;
    }
    function statusOf(r, today) {
      if (r.visited) return 'seen';
      return r.date && r.date < today ? 'seen' : 'upcoming';
    }

    /* ---------- visits: render ---------- */
    var filter = 'all';
    var recordsPanel = $('records-panel');
    var emptyBox = $('empty');
    function renderRecords() {
      qsa('.record', recordsPanel).forEach(function (n) { n.remove(); });
      var today = todayKR();
      var counts = { all: records.length, upcoming: 0, seen: 0, picks: D.places.length };
      records.forEach(function (r) { r._status = statusOf(r, today); counts[r._status] += 1; });
      var sorted = records.slice().sort(function (a, b) {
        if (a._status === b._status) {
          if (a._status === 'upcoming') return (a.date || '').localeCompare(b.date || '') || (a.time || '').localeCompare(b.time || '');
          if (!a.date && b.date) return 1;
          if (a.date && !b.date) return -1;
          return (b.date || '').localeCompare(a.date || '');
        }
        return a._status === 'upcoming' ? -1 : 1;
      });
      var nextUpcoming = sorted.filter(function (r) { return r._status === 'upcoming' && r.date; })[0];
      var picks = filter === 'picks';
      var shown = picks ? [] : sorted.filter(function (r) { return filter === 'all' || r._status === filter; });

      shown.forEach(function (r) {
        var card = el('article', 'record');
        card.setAttribute('data-id', r.id);
        card.setAttribute('data-status', r._status);
        var top = el('div', 'record-top');
        var db = el('div', 'date-block');
        if (r.date) {
          var d = r.date.split('-');
          var weekday = WEEK[new Date(Number(d[0]), Number(d[1]) - 1, Number(d[2])).getDay()];
          db.setAttribute('aria-label', d[0] + '년 ' + Number(d[1]) + '월 ' + Number(d[2]) + '일 ' + weekday);
          db.appendChild(el('span', 'month', d[0] + '.' + d[1]));
          db.appendChild(el('span', 'day', d[2]));
          db.appendChild(el('span', 'weekday', weekday));
        } else {
          db.setAttribute('aria-label', '날짜 없음');
          db.appendChild(el('span', 'month', '날짜'));
          db.appendChild(el('span', 'day', '–'));
          db.appendChild(el('span', 'weekday', '없음'));
        }
        top.appendChild(db);
        var info = el('div');
        var label = r._status === 'seen' ? '방문 완료' : '예정';
        if (r === nextUpcoming) {
          var days = Math.round((new Date(r.date + 'T00:00:00+09:00') - new Date(today + 'T00:00:00+09:00')) / 86400000);
          label = days === 0 ? '오늘' : 'D-' + days;
        }
        info.appendChild(el('span', 'status', label));
        info.appendChild(el('h3', '', r.title));
        var place = [fmtTime(r.time), r.venue].filter(Boolean).join(' · ');
        if (place) info.appendChild(el('p', 'place', place));
        top.appendChild(info);
        card.appendChild(top);

        var hasTopics = r.topics && r.topics.length;
        var placeHit = D.places.filter(function (p) { return p.name === r.title; })[0];
        var museum = r.museum && MUSEUMS[r.museum];
        var infoRows = museum ? MUSEUM_FIELDS.filter(function (f) { return museum[f[0]]; }) : [];
        var hasInfo = infoRows.length;
        if (hasInfo || hasTopics || placeHit) {
          var idet = foldRow('fold-row record-row', '박물관 정보', hasInfo ? hasInfo + '가지' : '');
          var ib = el('div', 'fold-body');
          if (hasInfo) {
            var table = el('dl', 'info-table');
            infoRows.forEach(function (f) {
              var row = el('div', 'info-row');
              row.appendChild(el('dt', '', f[1]));
              row.appendChild(el('dd', '', museum[f[0]]));
              table.appendChild(row);
            });
            ib.appendChild(table);
          }
          if (hasTopics || placeHit) {
            var rblock = el('div', 'related-block');
            rblock.appendChild(el('span', 'related-label', '함께 보기'));
            var rlist = el('div', 'study-link-list');
            (r.topics || []).forEach(function (n) {
              var ref = resolveRef(n);
              if (ref) rlist.appendChild(createLink(n, ref.kind, ref.value));
              else rlist.appendChild(el('span', 'genre-text', n));
            });
            if (placeHit) rlist.appendChild(createLink('가볼 곳에서 보기', 'place', placeHit.name));
            rblock.appendChild(rlist);
            ib.appendChild(rblock);
          }
          idet.appendChild(ib);
          card.appendChild(idet);
        }
        if (museum && museum.works && museum.works.length) {
          var wdet = foldRow('fold-row record-row', '대표 작품', museum.works.length + '점');
          var wb = el('div', 'fold-body inner-list');
          museum.works.forEach(function (w) {
            var wr = foldRow('inner-row', w.name, '', w.when);
            var body = el('div', 'inner-body');
            var line = [w.era, w.kind, w.maker].filter(Boolean).join(' · ');
            if (line) body.appendChild(el('p', 'inner-meta', line));
            if (w.about) body.appendChild(el('p', '', w.about));
            wr.appendChild(body);
            wb.appendChild(wr);
          });
          wdet.appendChild(wb);
          card.appendChild(wdet);
        }
        if (r.memo) {
          var det = foldRow('fold-row record-row', '메모');
          var mb = el('div', 'fold-body');
          mb.appendChild(el('p', 'memo-text', r.memo));
          det.appendChild(mb);
          card.appendChild(det);
        }
        recordsPanel.insertBefore(card, emptyBox);
      });

      qsa('.filter').forEach(function (b) {
        b.textContent = b.getAttribute('data-label') + ' ' + counts[b.getAttribute('data-filter')];
      });
      emptyBox.style.display = (picks || shown.length) ? 'none' : 'block';
      recordsPanel.hidden = picks;
      $('picks-panel').hidden = !picks;
      renderLeftover();
      if (!shown.length) {
        emptyBox.querySelector('strong').textContent = !records.length ? '기록한 방문이 아직 없음' : filter === 'upcoming' ? '예정된 방문이 없음' : '방문 완료 기록이 아직 없음';
      }
      updatePlaceStates();
    }
    function updatePlaceStates() {
      var seen = {};
      records.forEach(function (r) { if (r._status === 'seen') seen[r.title] = true; });
      qsa('[data-place-state]').forEach(function (n) {
        var name = n.getAttribute('data-place-state');
        var p = D.places.filter(function (x) { return x.name === name; })[0];
        n.textContent = seen[name] ? '방문 완료' : (p ? p.where : '');
      });
    }
    function activateFilter(button) {
      filter = button.getAttribute('data-filter');
      qsa('.filter').forEach(function (b) {
        var sel = b === button;
        b.setAttribute('aria-selected', sel ? 'true' : 'false');
        b.tabIndex = sel ? 0 : -1;
      });
      recordsPanel.setAttribute('aria-labelledby', button.id);
      renderRecords();
    }

    /* ---------- init + events ---------- */
    renderEras();
    renderTimeline();
    renderDictionary();
    renderPlaces();
    renderRecords();

    function wireTablist(buttons, activate) {
      buttons.forEach(function (button, index) {
        button.tabIndex = button.getAttribute('aria-selected') === 'true' ? 0 : -1;
        button.addEventListener('keydown', function (event) {
          var next = index;
          if (event.key === 'ArrowRight' || event.key === 'ArrowDown') next = (index + 1) % buttons.length;
          else if (event.key === 'ArrowLeft' || event.key === 'ArrowUp') next = (index - 1 + buttons.length) % buttons.length;
          else if (event.key === 'Home') next = 0;
          else if (event.key === 'End') next = buttons.length - 1;
          else return;
          event.preventDefault();
          buttons[next].focus();
          activate(buttons[next]);
        });
      });
    }
    bottomTabs.forEach(function (b) { b.addEventListener('click', function () { closeSearch(); showScreen(b.getAttribute('data-screen')); }); });
    wireTablist(bottomTabs, function (b) { showScreen(b.getAttribute('data-screen')); });
    var filters = qsa('.filter');
    filters.forEach(function (b) { b.addEventListener('click', function () { activateFilter(b); }); });
    wireTablist(filters, activateFilter);

    qsa('#dictionary-filters .term-filter').forEach(function (b) {
      b.addEventListener('click', function () { selectTermCategory(b.getAttribute('data-category')); });
    });
    qsa('#place-filters .term-filter').forEach(function (b) {
      b.addEventListener('click', function () { selectPlaceGroup(b.getAttribute('data-place-group')); });
    });
    qsa('#era-picker .term-filter').forEach(function (b) {
      b.addEventListener('click', function () { setEra(b.getAttribute('data-era-jump')); });
    });
    qsa('#timeline-filters .term-filter').forEach(function (b) {
      b.addEventListener('click', function () { timelineFilter = b.getAttribute('data-timeline-filter'); applyTimelineFilter(); });
    });

    var search = $('study-search');
    search.addEventListener('input', updateSearch);
    search.addEventListener('keydown', function (event) { if (event.key === 'Escape') { closeSearch(); search.blur(); } });
    document.addEventListener('click', function (event) {
      if (!event.target.closest('.study-search-wrap')) {
        $('study-search-results').hidden = true;
        search.setAttribute('aria-expanded', 'false');
      }
    });
    document.addEventListener('click', function (event) {
      var link = event.target.closest('[data-link-kind]');
      if (link) goTo(link.getAttribute('data-link-kind'), link.getAttribute('data-link-value'));
    });

    /* 위에 붙어 있던 제목을 눌러 접으면 화면을 제목 자리로 돌린다 */
    document.addEventListener('click', function (event) {
      var sm = event.target.closest('summary');
      if (!sm || !sm.parentNode.open) return;
      var d = sm.parentNode;
      if (sm.getBoundingClientRect().top - d.getBoundingClientRect().top < 1) return;
      window.requestAnimationFrame(function () { d.scrollIntoView({ block: 'start' }); });
    });

    $('leftover-copy-btn').addEventListener('click', function () { copyText(leftoverText(left)); });
    var clearTimer;
    $('leftover-clear').addEventListener('click', function () {
      var btn = $('leftover-clear');
      if (!btn.classList.contains('confirm')) {
        btn.classList.add('confirm');
        btn.textContent = '한 번 더 누르면 지움';
        clearTimeout(clearTimer);
        clearTimer = setTimeout(function () { btn.classList.remove('confirm'); btn.textContent = '지우기'; }, 4000);
        return;
      }
      clearTimeout(clearTimer);
      btn.classList.remove('confirm');
      btn.textContent = '지우기';
      try { window.localStorage.removeItem(STORE_KEY); } catch (e) {}
      left = leftovers();
      renderLeftover();
      showToast('지움');
    });
    window.setInterval(renderRecords, 60000);
    showScreen(savedTabs.screen);
  }());
  </script>
</body>
</html>
