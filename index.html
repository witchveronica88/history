<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
  <title>History</title>
  <style>

:root {--fs-xl:24px;--fs-l:18px;--fs-m:16px;--fs-s:14px;
  color-scheme: light;
  --bg: #F6F3EE;
  --card: #FFFFFF;
  --subtle: #EEE9E1;
  --summary: #F3EEE6;
  --text: #24211C;
  --muted: #6C665D;
  --line: #E8E2D8;
  --rule: #C8BEAF;
  --accent: #0F7470;
  --accent-soft: #E2F1EE;
  --on-accent: #FFFFFF;
  --danger: #B3261E;
  --on-danger: #FFFFFF;
  --shadow: 0 1px 2px rgba(60, 45, 25, .04), 0 10px 28px -16px rgba(60, 45, 25, .16);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #131210;
    --card: #1D1B18;
    --subtle: #2A2723;
    --summary: #27241F;
    --text: #EEEAE3;
    --muted: #ABA397;
    --line: #34302A;
    --rule: #554D42;
    --accent: #62CBBE;
    --accent-soft: #1D3632;
    --on-accent: #0B1F1F;
    --danger: #F28B82;
    --on-danger: #3B0A07;
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #131210;
  --card: #1D1B18;
  --subtle: #2A2723;
  --summary: #27241F;
  --text: #EEEAE3;
  --muted: #ABA397;
  --line: #34302A;
  --rule: #554D42;
  --accent: #62CBBE;
  --accent-soft: #1D3632;
  --on-accent: #0B1F1F;
  --danger: #F28B82;
  --on-danger: #3B0A07;
  --shadow: none;
}

* { box-sizing: border-box; }
html {
  scroll-behavior: smooth;
  background: var(--bg);
}
body {
  margin: 0;
  min-width: 0;
  overflow-wrap: break-word;
  background: var(--bg);
  color: var(--text);
  font-family: Pretendard, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  font-size: var(--fs-m);
  font-weight: 400;
  line-height: 1.6;
  letter-spacing: -0.01em;
  word-break: keep-all;
  -webkit-font-smoothing: antialiased;
}
button, input, textarea, summary { font: inherit; letter-spacing: inherit; }
button, a, summary { -webkit-tap-highlight-color: transparent; }
a { color: inherit; }
button { cursor: pointer; }
[hidden] { display: none; }
.wrap {
  width: min(100%, var(--max-w));
  margin: 0 auto;
  padding: 24px 16px calc(32px + env(safe-area-inset-bottom));
}
.view-panel { min-width: 0; }

.primary-tabs {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 4px;
  margin: 0 0 24px;
  padding: 4px;
  border-radius: 999px;
  background: var(--subtle);
}
.primary-tab {
  min-height: 44px;
  padding: 8px 16px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: var(--muted);
  font-size: var(--fs-m);
  font-weight: 700;
}
.primary-tab[aria-selected="true"] {
  background: var(--card);
  color: var(--text);
  font-weight: 700;
}

.filters,
.era-filters,
.term-filters {
  display: flex;
  gap: 8px;
  margin: 0 0 24px;
  flex-wrap: wrap;
  overflow-x: visible;
}
.filters::-webkit-scrollbar,
.era-filters::-webkit-scrollbar,
.term-filters::-webkit-scrollbar,
.study-tabs::-webkit-scrollbar { display: none; }
.filter,
.era-filter,
.term-filter {
  flex: 0 0 auto;
  min-height: 44px;
  padding: 8px 16px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--card);
  color: var(--muted);
  font-size: var(--fs-s);
  font-weight: 700;
  white-space: nowrap;
}
.term-filter { font-weight: 700; }
.filter[aria-selected="true"],
.era-filter[aria-pressed="true"],
.term-filter[aria-pressed="true"] {
  border-color: var(--accent-soft);
  background: var(--accent-soft);
  color: var(--accent);
  font-weight: 700;
}

.records,
.era-overviews,
.composer-list,
.instrument-list { display: grid; gap: 16px; }
.era-group,
.timeline-list,
.term-list,
.instrument-section,
.reading-card {
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--card);
}
.program { padding: 16px; }
.section-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin: 0 0 8px;
}
.section-row h4,
.program > h4,
.people h4 {
  margin: 0;
  font-size: var(--fs-m);
  font-weight: 700;
  line-height: 1.35;
}
.program-credits { margin: 0 0 24px; }
.piece { border-top: 1px solid var(--line); }
.piece:first-of-type { border-top: 0; }
.piece-body { padding: 0 0 16px; }
.piece-copy { display: grid; gap: 12px; }
.piece-copy p { margin: 0; color: var(--muted); font-family: inherit; font-size: var(--fs-m); }
.soloist-info { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line); }
.soloist-info h4 { margin: 0 0 8px; font-size: var(--fs-m); font-weight: 700; line-height: 1.35; }
.soloist-info p { margin: 0; color: var(--muted); font-family: inherit; font-size: var(--fs-m); }

/* Every disclosure uses the same row and arrow. */
details { border-top: 1px solid var(--line); }
details:first-child { border-top: 0; }
summary {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 12px;
  min-height: 44px;
  align-items: center;
  padding: 12px 16px;
  color: var(--text);
  font-size: var(--fs-m);
  font-weight: 700;
  line-height: 1.35;
  list-style: none;
  text-decoration: none;
  cursor: pointer;
}
summary::-webkit-details-marker { display: none; }
summary::marker { content: ""; }
summary::after {
  content: "⌄";
  color: var(--muted);
  font-size: var(--fs-m);
  line-height: 1.35;
  transition: transform .16s ease;
}
details[open] > summary::after { transform: rotate(180deg); }
details:not([open]) > :not(summary) { display: none; }
.performer-detail { border-top: 1px solid var(--line); }
.performer-detail:first-child { border-top: 0; }
.performer-detail > p {
  margin: 0;
  padding: 0 16px 16px;
  color: var(--muted);
  font-family: inherit;
  font-size: var(--fs-m);
}
.piece-performer { display: flex; }
.piece-performer::after { margin-left: auto; }
.piece-performer .role-label { margin-right: 0; color: var(--muted); font-size: var(--fs-s); font-weight: 400; }
.piece-performer .role-label::after { content: " · "; }
.piece-performer .performer-name { color: var(--text); font-size: var(--fs-m); font-weight: 700; }
.piece-summary-copy { min-width: 0; }
.piece-title { display: block; font-size: var(--fs-m); font-weight: 700; }
.piece-credit { display: block; margin-top: 4px; color: var(--muted); font-size: var(--fs-s); font-weight: 400; }
.detail-body { padding: 0 16px 16px; }
.info-detail > summary { padding-left: 0; padding-right: 0; }
.info-section { padding-top: 16px; }
.info-section h4 { margin: 0 0 8px; font-size: var(--fs-m); font-weight: 700; line-height: 1.35; }
.info-list { margin: 0; padding-left: 16px; color: var(--muted); }
.info-list li + li { margin-top: 4px; }
.booking {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 12px;
  align-items: center;
  padding: 16px 0;
  border-bottom: 1px solid var(--line);
}
.booking p { margin: 0; color: var(--muted); }
.booking strong { display: block; color: var(--text); font-size: var(--fs-m); }
.booking span { display: block; margin-top: 4px; font-size: var(--fs-s); overflow-wrap: anywhere; }
.copy {
  min-height: 44px;
  padding: 8px 16px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--card);
  color: var(--accent);
  font-size: var(--fs-s);
  font-weight: 700;
}
.caveat { margin: 16px 0 0; color: var(--muted); font-size: var(--fs-s); }
.prep-list { display: grid; gap: 0; }
.prep-link {
  display: grid;
  min-height: 44px;
  align-content: center;
  padding: 12px 0;
  border-top: 1px solid var(--line);
  color: var(--accent);
  text-decoration: none;
}
.prep-link:first-child { border-top: 0; }
.prep-link strong { font-size: var(--fs-m); font-weight: 700; }
.prep-link strong::after { content: " ↗"; }
.prep-link span { color: var(--muted); font-size: var(--fs-s); }

/* Study navigation */
.study-search-wrap { position: relative; margin: 0 0 16px; }
.study-search {
  width: 100%;
  min-height: 44px;
  padding: 8px 16px;
  border: 1px solid var(--line);
  border-radius: 12px;
  outline: 0;
  background: var(--card);
  color: var(--text);
  font-size: var(--fs-m);
}
.study-search::placeholder { color: var(--muted); }
.study-search:focus { border-color: var(--accent); }
.search-results {
  position: absolute;
  inset: calc(100% + 4px) 0 auto;
  z-index: 4;
  max-height: 384px;
  overflow-y: auto;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--card);
}
.search-result {
  display: grid;
  grid-template-columns: 64px minmax(0, 1fr) auto;
  gap: 8px;
  width: 100%;
  min-height: 44px;
  align-items: center;
  padding: 8px 12px;
  border: 0;
  border-top: 1px solid var(--line);
  background: transparent;
  color: var(--accent);
  text-align: left;
}
.search-result::after { content: none; }
.search-result:first-child { border-top: 0; }
.search-kind { color: var(--accent); font-size: var(--fs-s); font-weight: 700; }
.search-copy strong { display: block; font-size: var(--fs-m); font-weight: 700; }
.search-copy span { display: block; color: var(--muted); font-size: var(--fs-s); }
.search-empty, .term-empty, .empty { margin: 0; padding: 24px 16px; color: var(--muted); text-align: center; }
.empty strong { display: block; color: var(--text); }
.study-tabs {
  display: flex;
  gap: 16px;
  margin: 0 0 16px;
  overflow-x: auto;
  border-bottom: 1px solid var(--line);
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}
.study-tab {
  position: relative;
  flex: 0 0 auto;
  min-height: 44px;
  padding: 8px 0;
  border: 0;
  background: transparent;
  color: var(--muted);
  font-size: var(--fs-m);
  font-weight: 700;
  white-space: nowrap;
}
.study-tab[aria-selected="true"] { color: var(--accent); font-weight: 700; }
.study-count { margin: 0 0 12px; color: var(--muted); font-size: var(--fs-s); }
.timeline-heading-row { margin-top: 24px; }
.era-tabs {
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: 8px;
  margin: 0 0 16px;
}
.era-tab:first-child { grid-column: span 2; }
.era-tab {
  min-width: 0;
  min-height: 44px;
  padding: 8px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--card);
  color: var(--muted);
  font-size: var(--fs-s);
  font-weight: 700;
}
.era-tab[aria-pressed="true"] {
  border-color: var(--accent-soft);
  background: var(--accent-soft);
  color: var(--accent);
}
.dictionary-subtabs {
  display: flex;
  flex-wrap: wrap;
  gap: 0 16px;
  margin: 0 0 16px;
  border-bottom: 1px solid var(--line);
}
.dictionary-subtab {
  position: relative;
  min-height: 44px;
  padding: 8px 0;
  border: 0;
  background: transparent;
  color: var(--muted);
  font-size: var(--fs-m);
  font-weight: 700;
  line-height: 1.35;
  text-align: left;
}
.dictionary-subtab[aria-selected="true"] { color: var(--accent); font-weight: 700; }
.dictionary-subpanel { line-height: 1.6; }

.era-banner {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  padding: 16px 16px 0;
}
.era-banner strong { font-size: var(--fs-l); font-weight: 700; line-height: 1.35; }
.era-banner span { color: var(--muted); font-size: var(--fs-s); }
.era-description { padding: 12px 16px 0; }
.era-description > p { margin: 0; }
.era-description > .era-first-listen { margin: 16px 0 0; padding-top: 16px; border-top: 1px solid var(--line); }
.era-first-listen strong { display: block; margin-bottom: 4px; font-size: var(--fs-m); }
.era-notes-body ul,
.study-card-body ul,
.key-guide { margin: 0; padding-left: 16px; color: var(--muted); }
.key-table { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); overflow: hidden; border: 1px solid var(--line); border-radius: 12px; }
.key-cell { padding: 8px 4px; border-left: 1px solid var(--line); text-align: center; }
.key-cell:first-child { border-left: 0; }
.key-cell strong, .key-cell span { display: block; }
.key-cell span { color: var(--muted); font-size: var(--fs-s); }
.era-notes-body li + li,
.study-card-body li + li,
.key-guide li + li { margin-top: 8px; }
.era-genres { margin-top: 12px; }
.era-genres .genre-text { color: var(--muted); font-size: var(--fs-s); font-weight: 400; }
.era-genres .study-link {
  min-height: 0;
  padding: 0;
  font-size: var(--fs-s);
  font-weight: 400;
}
.era-genres .study-link-list > * + *::before {
  content: "·";
  margin: 0 6px;
  color: var(--muted);
  font-size: var(--fs-s);
  font-weight: 400;
}
.era-composer-list { border-top: 1px solid var(--line); }
.nested-composer { border-top: 1px solid var(--line); }
.nested-composer:first-child { border-top: 0; }
.nested-composer > summary { min-height: 48px; padding: 8px 16px; }
.composer-summary {
  display: flex;
  min-width: 0;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
}
.composer-summary strong { color: var(--accent); font-size: var(--fs-m); font-weight: 700; }
.composer-years { flex: 0 0 auto; color: var(--muted); font-size: var(--fs-s); font-weight: 400; }
.study-card-body { padding: 0 16px 16px; }
.study-card-body > p { margin: 0; }
.composer-detail-name { padding: 16px 0 12px; color: var(--muted); font-size: var(--fs-s); }
.study-card-body h4,
.reading-card h4 { margin: 24px 0 8px; font-size: var(--fs-m); font-weight: 700; line-height: 1.35; }
.work-row { scroll-margin-top: 64px; }
.work-row.work-highlight { color: var(--accent); font-weight: 700; }
.related-block {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 4px 12px;
  margin-top: 24px;
  padding-top: 12px;
  border-top: 1px solid var(--line);
}
.related-label { color: var(--muted); font-size: var(--fs-s); font-weight: 400; line-height: 1.6; }
.study-link-list { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0; font-size: var(--fs-s); font-weight: 400; line-height: 1.6; }
.related-block:not(.era-genres) .study-link-list .study-link + .study-link::before {
  content: "·";
  margin: 0 6px;
  color: var(--muted);
  font-size: var(--fs-s);
  font-weight: 400;
}
.study-link,
.composer-link {
  display: inline-flex;
  min-height: 44px;
  align-items: center;
  padding: 4px 0;
  border: 0;
  background: transparent;
  color: var(--accent);
  font-size: var(--fs-m);
  font-weight: 700;
  text-align: left;
  text-decoration: none;
}
.related-block .study-link {
  min-height: 0;
  padding: 0;
  font-size: var(--fs-s);
  font-weight: 400;
}
.study-link::after,
.composer-link::after { content: none; }
.source-link {
  display: inline-flex;
  min-height: 44px;
  align-items: center;
  color: var(--accent);
  font-size: var(--fs-m);
  font-weight: 700;
  text-decoration: none;
}
.source-link::after { content: " ↗"; }
.reference-sources { margin-top: 16px; }
.concerto-flow { display: grid; gap: 8px; }
.concerto-flow div { display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: 8px; color: var(--muted); }
.concerto-flow strong { color: var(--text); }

.timeline-list { display: grid; gap: 0; }
.term-list {
  display: grid;
  gap: 12px;
  overflow: visible;
  border: 0;
  border-radius: 0;
  background: transparent;
}
.timeline-row {
  display: grid;
  grid-template-columns: 56px minmax(0, 1fr);
  gap: 12px;
  align-items: start;
  padding: 12px 16px;
  border-top: 1px solid var(--line);
  font-size: var(--fs-m);
  line-height: 1.6;
  text-align: left;
}
.timeline-row:first-child { border-top: 0; }
.timeline-year { color: var(--muted); font-size: var(--fs-m); font-weight: 700; line-height: inherit; }
.timeline-copy { min-width: 0; color: var(--text); font-size: var(--fs-m); line-height: inherit; }
.timeline-copy .study-link {
  display: inline;
  min-height: 0;
  padding: 0;
  font-size: var(--fs-m);
  line-height: inherit;
  vertical-align: baseline;
}
.term-row {
  display: grid;
  grid-template-columns: minmax(80px, 1fr) minmax(0, 2fr);
  gap: 16px;
  padding: 12px 16px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--card);
}
.term-name { font-size: var(--fs-m); font-weight: 700; }
.term-body { min-width: 0; }
.term-definition { margin: 0; color: var(--muted); }
.term-body .related-block { margin-top: 12px; padding-top: 8px; }
.term-row[data-category="형식 · 장르"] .related-block {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 4px 12px;
}
.term-row[data-category="형식 · 장르"] .related-label { margin: 0; }
.term-row[data-category="형식 · 장르"] .study-link-list { gap: 0; }
.term-row[data-category="형식 · 장르"] .study-link {
  min-height: 0;
  padding: 0;
  font-size: var(--fs-s);
  font-weight: 400;
}
.term-row[hidden] { display: none; }

.instrument-intro { margin: 0 0 16px; }
.instrument-intro p { margin: 0; }
.instrument-intro p + p { margin-top: 8px; }
.instrument-body { padding: 0 16px 16px; }
.instrument-body > p { margin: 0 0 12px; color: var(--muted); }
.instrument-row { padding: 12px 0; border-top: 1px solid var(--line); }
.instrument-row strong { display: block; font-size: var(--fs-m); font-weight: 700; }
.instrument-row span { display: block; margin-top: 4px; color: var(--muted); }
.reading-card { padding: 16px; }
.reading-card > p { margin: 0; }
.catalogue-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 16px; }
.catalogue-row { padding: 12px 0; border-top: 1px solid var(--line); }
.catalogue-row strong { display: block; font-size: var(--fs-m); font-weight: 700; }
.catalogue-row span { display: block; margin-top: 4px; color: var(--muted); }
.note-field { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line); }
.note-field label { display: block; margin-bottom: 8px; font-size: var(--fs-m); font-weight: 700; }
.note-field textarea {
  width: 100%;
  min-height: 96px;
  resize: vertical;
  padding: 12px 16px;
  border: 1px solid var(--line);
  border-radius: 12px;
  outline: 0;
  background: var(--card);
  color: var(--text);
}
.note-field textarea:focus { border-color: var(--accent); }

.toast {
  position: fixed;
  left: 50%;
  bottom: calc(16px + env(safe-area-inset-bottom));
  z-index: 8;
  transform: translateX(-50%);
  padding: 8px 16px;
  border-radius: 999px;
  background: var(--text);
  color: var(--card);
  font-size: var(--fs-s);
  opacity: 0;
  pointer-events: none;
}
.toast.show { opacity: 1; }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (max-width: 440px) {
  .term-row { grid-template-columns: 1fr; gap: 4px; }
  .catalogue-grid { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  summary::after, .visit-plus { transition: none; }
}

  
[hidden] { display: none !important; }
.era-tabs { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.era-tab:first-child { grid-column: auto; }
.term-row .related-block { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; margin-top: 12px; }
.term-row .related-label { margin: 0; }
.term-filters { gap: 8px; }
.artist-links { display: flex; flex-wrap: wrap; gap: 0 16px; }
.artist-links .study-link { min-height: 36px; }
.memo-text { margin: 0; padding: 0 16px 16px; color: var(--muted); white-space: pre-wrap; }
.empty { padding: 32px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--muted); text-align: center; }
.leftover { margin: 0 0 16px; padding: var(--pad); border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); }
.leftover p { margin: 0 0 12px; }
.leftover-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.btn-primary, .btn-danger { min-height: 48px; border-radius: 12px; font-size: var(--fs-m); font-weight: 700; }
.btn-primary { border: 0; background: var(--accent); color: var(--on-accent); }
.btn-danger { border: 1px solid var(--line); background: transparent; color: var(--danger); }
.btn-danger.confirm { border-color: var(--danger); background: var(--danger); color: var(--on-danger); }

.study-tabs { gap: 16px; }
.era-fold > summary { list-style: none; cursor: pointer; }
.era-fold > summary::-webkit-details-marker { display: none; }
.era-fold > summary .era-banner,
.era-fold[open] > summary .era-banner { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 0; }
.era-banner strong { font-size: var(--fs-m); }
.era-banner span { color: var(--muted); font-size: var(--fs-s); font-weight: 400; }
.era-description { padding: 16px 16px 20px; }
details > summary { background: var(--summary); }
details[open] > summary { box-shadow: inset 0 -1px 0 var(--line); }
.era-fold > summary, .nested-composer > summary { min-height: 52px; padding: 14px 16px; }
.study-card-body { padding: 16px 16px 20px; }
.study-card-body h4 { margin: 20px 0 8px; font-size: var(--fs-m); }
.study-card-body .composer-detail-name { margin: 0 0 8px; }
.related-block { margin-top: 20px; }
.related-block, .era-genres, .term-row .related-block, .term-body .related-block { display: flex; flex-wrap: nowrap; align-items: baseline; gap: 16px; border-top: 0; padding-top: 0; }
.related-block .study-link-list { flex: 1 1 0; min-width: 0; }
.related-block .study-link-list { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; }
.related-block:not(.era-genres) .study-link-list .study-link + .study-link::before { content: none; margin: 0; }
.related-block .study-link-list > * + *::before,
.era-genres .study-link-list > * + *::before { content: none; margin: 0; }
.related-label, .related-block .study-link, .related-block .genre-text, .era-genres .study-link, .era-genres .genre-text { font-size: var(--fs-s); }
.related-label { display: block; flex: 0 0 auto; margin: 0; color: var(--muted); font-weight: 400; }
.related-block .study-link, .related-block .genre-text { min-height: 0; padding: 0; font-weight: 400; line-height: 1.6; }
.timeline-row { grid-template-columns: 96px minmax(0, 1fr); }
.timeline-when { display: grid; gap: 2px; }
.timeline-tag { color: var(--muted); font-size: var(--fs-s); }
.timeline-copy .study-link.timeline-link { display: block; width: 100%; text-align: left; font-size: var(--fs-m); font-weight: 400; line-height: 1.6; text-decoration: none; color: var(--accent); }
.timeline-copy { font-size: var(--fs-m); }
.study-count { margin: 0 0 12px; }

.timeline-tag { color: var(--muted); }
.fold-body > .era-people { margin-top: 16px; }
.era-people + .era-genres { margin-top: 8px; }
.people-text { flex: 1 1 0; min-width: 0; font-size: var(--fs-s); line-height: 1.6; }
.event-sum { font-weight: 700; }
.study-tabs { gap: 20px; }

/* Bottom navigation and screen header */
.wrap { padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
/* 화면 맨 위 제목: 카드 제목보다 작게, 가운데, 양옆에 가는 두 줄. 위에 고정하지 않는다 */
.wrap { padding-top: 0; }
.screen-head { margin: 0 0 12px; padding: 12px 0 0; text-align: center; }
.screen-head h1 {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  margin: 0;
  font-size: var(--fs-l);
  font-weight: 700;
  line-height: 1.4;
  letter-spacing: 0.04em;
}
.screen-head h1::before,
.screen-head h1::after {
  content: "";
  width: 36px;
  height: 4px;
  border-top: 1px solid var(--rule);
  border-bottom: 1px solid var(--rule);
}
.bottom-tabs {
  position: fixed;
  left: 50%;
  bottom: 0;
  z-index: 10;
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  width: min(100%, var(--max-w));
  transform: translateX(-50%);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  border-top: 1px solid var(--line);
  background: var(--card);
}
.bottom-tab {
  position: relative;
  min-width: 0;
  min-height: 56px;
  padding: 8px 2px;
  border: 0;
  background: transparent;
  color: var(--muted);
  font-size: var(--fs-s);
  font-weight: 700;
  white-space: nowrap;
}
.bottom-tab[aria-selected="true"] { color: var(--accent); }
.bottom-tab { display: grid; justify-items: center; align-content: center; gap: 2px; min-height: 60px; padding: 6px 2px; }
.bottom-tab svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.bottom-tab[aria-selected="true"]::before {
  content: "";
  position: absolute;
  top: 0;
  left: 28%;
  right: 28%;
  height: 3px;
  border-radius: 0 0 3px 3px;
  background: var(--accent);
}
.toast { bottom: calc(72px + env(safe-area-inset-bottom, 0px)); }

/* 카드 규칙: 카드 = 머리 + ＋ 줄. 펼친 줄은 제목 줄에만 옅은 배경, 첫 단계는 왼쪽 끝에 강조색 막대 */
:root { --radius: 16px; --pad: 20px; --row: 52px; --stick: 0px; --max-w: 720px; }
#study-eras, #study-dictionary, #records-panel { --stick: 60px; }
.fold-card,
.timeline-list,
.empty { overflow: clip; border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); }
.fold-head { padding: var(--pad); border-bottom: 1px solid var(--line); }
.fold-title { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 10px; }
.fold-title h3 { min-width: 0; margin: 0; font-size: var(--fs-l); font-weight: 700; line-height: 1.3; }
.card-badge {
  flex: 0 0 auto;
  margin-left: auto;
  padding: 2px 10px;
  border-radius: 999px;
  background: var(--subtle);
  color: var(--muted);
  font-size: var(--fs-s);
  white-space: nowrap;
}
.fold-head p { margin: 8px 0 0; color: var(--muted); font-size: var(--fs-s); }

details > summary,
details[open] > summary { background: transparent; box-shadow: none; }
summary::after {
  content: "";
  flex: 0 0 auto;
  width: 11px;
  height: 11px;
  margin-right: 2px;
  background: linear-gradient(var(--muted), var(--muted)) center / 11px 1.5px no-repeat,
              linear-gradient(var(--muted), var(--muted)) center / 1.5px 11px no-repeat;
  transform: none;
  transition: background-size .16s ease;
}
details[open] > summary::after { transform: none; background-size: 11px 1.5px, 1.5px 0; }

.fold-row { border-top: 1px solid var(--line); scroll-margin-top: var(--stick); }
.fold-card { scroll-margin-top: var(--stick); }
.fold-head + .fold-row { border-top: 0; }
.fold-row > summary {
  display: flex;
  min-height: var(--row);
  align-items: center;
  gap: 12px;
  padding: 14px var(--pad);
}
.row-name { display: flex; flex: 1 1 auto; min-width: 0; align-items: baseline; gap: 8px; }
.row-name strong { min-width: 0; color: var(--text); font-size: var(--fs-m); font-weight: 700; }
.row-meta { flex: 0 0 auto; color: var(--muted); font-size: var(--fs-s); font-weight: 400; }
.row-year,
.card-badge,
.timeline-year { font-variant-numeric: tabular-nums; }
.row-year { flex: 0 0 auto; color: var(--muted); font-size: var(--fs-s); font-weight: 400; }
.fold-card > .fold-row[open] { box-shadow: inset 3px 0 0 var(--accent); }
.fold-card > .fold-row[open] > summary {
  position: sticky;
  top: var(--stick);
  z-index: 3;
  background: var(--summary);
  box-shadow: inset 3px 0 0 var(--accent), 0 1px 0 var(--line);
}
.fold-body { padding: 14px var(--pad) var(--pad); }
.fold-body > p { margin: 0; }
.fold-body > p + p { margin-top: 8px; }
.fold-years { color: var(--muted); font-size: var(--fs-s); }
.fold-body .term-definition { color: var(--text); }
.fold-body .memo-text { padding: 0; color: var(--text); }
/* 장소 정보: 왼쪽 목차, 오른쪽 내용. 함께 보기도 같은 칸에 맞춰 마지막 줄로 */
.info-table { margin: 0; }
.info-row,
.info-table + .related-block {
  display: grid;
  grid-template-columns: 5em minmax(0, 1fr);
  gap: 12px;
  align-items: baseline;
  margin: 0;
  padding: 10px 0;
  border-top: 1px solid var(--line);
}
.info-row:first-child { padding-top: 0; border-top: 0; }
.info-table + .related-block { padding-bottom: 0; }
.info-row dt { color: var(--muted); font-size: var(--fs-s); }
.info-row dd { margin: 0; }
/* 한 단계 안쪽 ＋ 줄(방문 기록의 장소 정보·깊이 읽기·대표 작품·메모): 접힌 줄은 내용 폭, 펼친 제목 줄 배경은 카드 폭 전체로 깔고 바깥 막대를 다시 그린다.
   펼친 내용은 왼쪽 회색 안내선과 함께 14px 들여 쓴다 */
.inner-list { padding-top: 0; padding-bottom: 8px; }
.inner-row { border-top: 1px solid var(--line); scroll-margin-top: calc(var(--stick) + var(--row)); }
.inner-row:first-child { border-top: 0; }
.inner-row > summary { display: flex; min-height: var(--row); align-items: center; gap: 12px; padding: 14px 0; }
.inner-row[open] > summary {
  position: sticky;
  top: calc(var(--stick) + var(--row));
  z-index: 2;
  margin: 0 calc(-1 * var(--pad));
  padding-right: var(--pad);
  padding-left: var(--pad);
  background: var(--summary);
  box-shadow: inset 3px 0 0 var(--accent), 0 1px 0 var(--line);
}
.inner-body { margin: 14px 0 16px; padding-left: 14px; border-left: 2px solid var(--line); }
.inner-body > p { margin: 0; }
.inner-body > p + p { margin-top: 6px; }
.inner-body .inner-meta { color: var(--muted); font-size: var(--fs-s); }
/* 깊이 읽기: 펼치면 세 묶음이 한 번에. 장소 정보처럼 회색 이름과 가는 선, 글이 길어 이름은 문단 위에 */
.story-sec { padding: 10px 0; border-top: 1px solid var(--line); }
.story-sec:first-child { padding-top: 0; border-top: 0; }
.story-sec:last-child { padding-bottom: 0; }
.story-label { margin: 0 0 6px; color: var(--muted); font-size: var(--fs-s); font-weight: 400; line-height: 1.5; }
.story-sec > p { margin: 0; }
.story-sec > p + p { margin-top: 10px; }
/* 대표 작품: 깊이 읽기와 같이 한 번에. 작품 이름(16px 굵게) + 오른쪽 회색 연도, 아래 회색 한 줄, 설명 */
.work-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 0 0 4px; }
.work-name { min-width: 0; font-size: var(--fs-m); font-weight: 700; }
.work-sec > .work-meta { color: var(--muted); font-size: var(--fs-s); }
.work-sec > .work-meta + p { margin-top: 6px; }
/* 빈칸 문제: 줄은 강조색 물음표 아이콘 + 옅은 강조색 바탕(펼쳐도 같은 바탕). 문제 사이 가는 선. 빈칸은 강조색 밑줄, 누르면 그 자리에 답(강조색 굵게) */
.fold-card > .quiz-row > summary,
.fold-card > .quiz-row[open] > summary { background: var(--accent-soft); }
.quiz-icon { display: inline-flex; flex: 0 0 auto; }
.quiz-icon svg { width: 22px; height: 22px; fill: none; stroke: var(--accent); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.quiz-icon .dot { fill: var(--accent); stroke: none; }
.quiz-row .row-meta { color: var(--accent); }
.quiz-item { padding: 12px 0; border-top: 1px solid var(--line); }
.quiz-item:first-child { padding-top: 0; border-top: 0; }
.quiz-item:last-child { padding-bottom: 0; }
.quiz-q { margin: 0; cursor: pointer; }
.quiz-blank { display: inline-block; min-width: 4.5em; min-height: 1.4em; margin: 0 2px; padding: 0 2px; border: 0; border-bottom: 2px solid var(--accent); background: transparent; color: var(--accent); font-weight: 700; line-height: 1.3; vertical-align: -0.2em; }
.quiz-blank[aria-pressed="true"] { min-width: 0; vertical-align: baseline; }
/* 방문 기록: 지역마다 카드 하나, 줄 = 작은 사진 + 이름/장소 + 오른쪽 위 날짜, 그 아래 ＋. 누르면 그 자리에서 펼친다 */
.visit-row > summary { padding-top: 12px; padding-bottom: 12px; }
.visit-thumb { flex: 0 0 56px; width: 56px; height: 42px; border-radius: 4px; background: var(--subtle); object-fit: cover; box-shadow: 0 0 0 1px var(--line); }
.visit-text { display: flex; flex: 1 1 auto; min-width: 0; flex-direction: column; gap: 2px; }
.visit-name { color: var(--text); font-size: var(--fs-m); font-weight: 700; line-height: 1.35; }
.visit-sub { color: var(--muted); font-size: var(--fs-s); font-weight: 400; line-height: 1.35; }
.visit-row > summary::after { display: none; }
.visit-side { display: flex; flex: 0 0 auto; flex-direction: column; align-items: flex-end; gap: 8px; }
.visit-date { color: var(--muted); font-size: var(--fs-s); font-weight: 400; line-height: 1.35; font-variant-numeric: tabular-nums; }
.visit-plus {
  width: 11px;
  height: 11px;
  margin-right: 2px;
  background: linear-gradient(var(--muted), var(--muted)) center / 11px 1.5px no-repeat,
              linear-gradient(var(--muted), var(--muted)) center / 1.5px 11px no-repeat;
  transition: background-size .16s ease;
}
.visit-row[open] > summary .visit-plus { background-size: 11px 1.5px, 1.5px 0; }
.visit-date.soon { color: var(--text); font-weight: 700; }
.visit-open .inner-list { padding-top: 0; }
.visit-row .inner-row { scroll-margin-top: calc(var(--stick) + var(--outer, var(--row))); }
.visit-row .inner-row[open] > summary { top: calc(var(--stick) + var(--outer, var(--row))); }
.inner-body .memo-text { padding: 0; color: var(--text); }
/* 다듬기: 따뜻한 종이색 바탕 위에 흰 카드와 옅은 그림자, 고른 탭은 강조색으로 채운다 */
.fold-card, .timeline-list, .empty, .leftover { border-color: var(--line); box-shadow: var(--shadow); }
.study-search { border-color: var(--line); box-shadow: var(--shadow); }
.study-search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.filter[aria-selected="true"],
.era-filter[aria-pressed="true"],
.term-filter[aria-pressed="true"] { border-color: var(--accent); background: var(--accent); color: var(--on-accent); }
.term-filter { transition: background-color .15s ease, color .15s ease, border-color .15s ease; }
.card-badge { background: var(--subtle); }
.fold-title h3 { letter-spacing: -0.015em; }
.screen-head h1 { letter-spacing: 0.32em; padding-left: 0.32em; }
.screen-head h1::before, .screen-head h1::after { width: 44px; }
.bottom-tabs { background: var(--card); background: color-mix(in srgb, var(--card) 94%, transparent); -webkit-backdrop-filter: saturate(1.4) blur(14px); backdrop-filter: saturate(1.4) blur(14px); }
.visit-thumb { border-radius: 6px; }
@media (hover: hover) {
  .fold-row > summary:hover, .inner-row > summary:hover { background: var(--summary); }
  .term-filter:not([aria-pressed="true"]):hover { border-color: var(--rule); color: var(--text); }
}
@media (prefers-reduced-motion: reduce) { .term-filter { transition: none; } }
/* 장소 사진: 펼친 기록 맨 위, 카드 폭 전체(왼쪽 강조색 막대 3px는 남긴다) */
.record-photo { display: block; width: calc(100% - 3px); margin-left: 3px; aspect-ratio: 16 / 9; object-fit: cover; background: var(--line); }
.credit-link { color: var(--accent); text-decoration: none; overflow-wrap: anywhere; }
.fold-body > .composer-detail-name { margin: 0 0 8px; padding: 0; }
.fold-card > .era-notes { margin-top: 0; }

.timeline-row { padding: 12px var(--pad); }

/* 카드가 많으면 탭: 알약 탭 한 줄, 가로로 밀고 위에 고정 */
.card-tabs {
  position: sticky;
  top: 0;
  z-index: 5;
  display: flex;
  flex-wrap: nowrap;
  gap: 8px;
  margin: 0 -16px 8px;
  padding: 8px 16px;
  overflow-x: auto;
  background: var(--bg);
  scrollbar-width: none;
}
.card-tabs::-webkit-scrollbar { display: none; }
.study-search-wrap { z-index: 6; }
.card-tabs > * { flex: 0 0 auto; min-width: auto; padding: 8px 16px; }

  </style>
</head>
<body>
  <main class="wrap">
    <header class="screen-head">
      <h1>역사</h1>
    </header>

    <section class="view-panel" id="visit-view" role="tabpanel" aria-labelledby="tab-visits">
      <nav class="term-filters card-tabs" id="visit-tabs" aria-label="방문 기록 지역"></nav>
      <div class="leftover" id="leftover" hidden>
        <p id="leftover-copy"></p>
        <div class="leftover-actions">
          <button class="btn-primary" id="leftover-copy-btn" type="button">복사</button>
          <button class="btn-danger" id="leftover-clear" type="button">지우기</button>
        </div>
      </div>
      <section class="records" id="records-panel" aria-live="polite">
        <div class="empty" id="empty" role="status"><strong>기록한 방문이 아직 없다</strong></div>
      </section>
    </section>

    <section class="view-panel" id="study-view" role="tabpanel" aria-labelledby="tab-korea" hidden>
      <div class="study-search-wrap">
        <input class="study-search" id="study-search" type="search" inputmode="search" autocomplete="off" aria-label="시대, 사건, 연표, 사전, 박물관과 유적지 통합 검색" aria-controls="study-search-results" aria-expanded="false" placeholder="역사 공부 전체 검색">
        <div class="search-results" id="study-search-results" role="listbox" hidden></div>
      </div>

      <section class="study-panel" id="study-eras" data-study-panel="eras">
        <nav class="term-filters card-tabs" id="era-picker" aria-label="시대 선택"></nav>
        <div class="era-overviews" id="era-overviews"></div>
      </section>

      <section class="study-panel" id="study-timeline" data-study-panel="timeline" hidden>
        <div class="term-filters" id="timeline-filters" aria-label="연표 보기"></div>
        <p class="study-count" id="timeline-count"></p>
        <div class="timeline-list" id="timeline-list"></div>
      </section>

      <section class="study-panel" id="study-dictionary" data-study-panel="dictionary" hidden>
        <div class="term-filters card-tabs" id="dictionary-filters" aria-label="사전 분류"></div>
        <div id="dictionary-list"></div>
      </section>
    </section>
  </main>

  <nav class="bottom-tabs" aria-label="역사 메뉴" role="tablist">
    <button class="bottom-tab" id="tab-visits" type="button" role="tab" aria-controls="visit-view" aria-selected="true" data-screen="visits"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10l9-5 9 5"/><path d="M5 10v8M9.5 10v8M14.5 10v8M19 10v8"/><path d="M3 20h18"/></svg><span>기록</span></button>
