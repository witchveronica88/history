  <script>window.HIST_DATA = {"eras": [{"name": "한국사 · 고조선과 삼국", "points": ["구석기 시대는 약 70만 년 전부터이고, 약 1만 년 전부터 농사와 토기를 쓰는 신석기 시대가 이어졌다.", "청동기 시대에 계급이 생기고 고인돌이 만들어졌다. 단군이 고조선을 세웠다는 이야기가 전하고, 고조선은 기원전 108년 한나라에 무너졌다.", "전통 기록은 신라(기원전 57), 고구려(기원전 37), 백제(기원전 18)가 세워졌다고 전한다. 낙동강 유역에서는 가야 연맹이 일어났다.", "한강 유역을 차지한 나라가 차례로 전성기를 맞았다. 4세기 백제 근초고왕, 5세기 고구려 장수왕, 6세기 신라 진흥왕이다.", "고구려는 수나라와 당나라의 침입을 막아 냈다(612 살수대첩, 645 안시성 전투).", "신라가 당나라와 손잡고 백제(660)와 고구려(668)를 무너뜨린 뒤, 676년 당나라 세력까지 몰아냈다."], "years": "약 70만 년 전–676", "summary": "고조선에서 시작해 고구려·백제·신라·가야가 서로 겨루다 신라가 삼국을 통일하기까지의 시기다.", "people": "단군(건국 이야기 속 인물), 위만, 소수림왕, 광개토대왕, 장수왕, 근초고왕, 무령왕, 성왕, 법흥왕, 진흥왕, 김춘추, 김유신", "words": "구석기·신석기·청동기·철기, 고인돌, 8조법, 연맹왕국, 율령, 불교, 골품제, 화백 회의, 한강 유역", "region": "한국사"}, {"name": "한국사 · 남북국", "points": ["676년 신라가 삼국 통일을 마쳤다. 신문왕이 진골 귀족을 누르고 국학을 세웠으며(682) 전국을 9주 5소경으로 나눠 다스렸다.", "698년 대조영이 발해를 세웠다. 9세기 선왕 때 '해동성국'으로 불렸고 926년 거란에 멸망했다.", "8세기 통일신라에서 불국사와 석굴암 같은 불교 문화가 꽃피었다. 원효와 의상이 불교를 널리 퍼뜨렸다.", "9세기에 진골 귀족의 왕위 다툼과 골품제의 한계로 신라가 흔들리고, 지방에서 호족과 6두품이 성장했다.", "900년 후백제, 901년 후고구려(뒤에 태봉)가 세워지고 후삼국 시대가 열렸다. 935년 신라가 고려에 항복했다."], "years": "676–935", "summary": "신라가 삼국을 통일한 뒤 북쪽의 발해와 함께 남북으로 나라가 나뉘어 있던 시기다.", "people": "신문왕, 대조영, 무왕, 문왕, 선왕, 원효, 의상, 장보고, 최치원, 견훤, 궁예", "words": "골품제, 해동성국, 진골, 6두품, 호족, 선종, 후삼국", "region": "한국사"}, {"name": "한국사 · 고려", "points": ["918년 왕건이 고려를 세우고 936년 후삼국을 통일했다. 광종이 노비안검법(956)과 과거제(958)로 왕권을 키우고, 성종이 유교 정치의 틀을 갖췄다.", "993년 서희가 거란과 담판해 강동 6주를 얻고, 1019년 강감찬이 귀주에서 거란군을 크게 물리쳤다.", "12세기 문벌 귀족이 권력을 쥐면서 이자겸의 난(1126)과 묘청의 서경 천도 운동(1135)이 일어났다.", "1170년 무신정변으로 약 100년간 무신이 권력을 잡았다.", "1231년 몽골의 침입이 시작되어 강화도로 수도를 옮기고 항쟁했다. 1270년 개경으로 돌아온 뒤 원나라의 간섭을 받았다.", "공민왕이 원나라의 간섭에서 벗어나려 개혁을 폈다. 1377년 청주 흥덕사에서 『직지』를 금속활자로 찍었다.", "1388년 이성계가 위화도에서 군대를 돌리고 1392년 조선을 세웠다."], "years": "918–1392", "summary": "호족 연합으로 시작해 귀족 사회, 무신 정권, 몽골의 간섭을 거치며 약 470년 이어진 나라다.", "people": "왕건, 광종, 성종, 서희, 강감찬, 윤관, 묘청, 최충헌, 공민왕, 최영, 이성계", "words": "문벌 귀족, 음서, 과거제, 무신정권, 권문세족, 신진사대부, 삼별초, 팔만대장경", "region": "한국사"}, {"name": "한국사 · 조선", "points": ["1392년 이성계가 조선을 세우고 1394년 한양으로 수도를 옮겼다. 태종이 왕권을 다졌다.", "세종(재위 1418–1450) 때 훈민정음을 만들고(1443) 과학과 음악, 농업이 크게 발전했다. 1485년 성종 때 『경국대전』이 완성되었다.", "16세기 네 번의 사화를 겪으면서도 사림이 성장했다. 선조 때 사림이 정권을 잡고 붕당으로 나뉘었다.", "1592–1598년 임진왜란, 1636–1637년 병자호란을 겪었다. 두 전쟁을 기준으로 조선 전기와 후기를 나눈다.", "17세기 붕당의 다툼이 예송(1659·1674)과 숙종 때의 환국으로 거세졌다.", "영조와 정조(18세기)가 탕평 정치를 펴고, 정조가 1796년 수원 화성을 완성했다. 실학과 서민 문화가 꽃피었다.", "1800년 정조가 세상을 떠난 뒤 몇몇 가문이 권력을 쥐는 세도정치로 삼정이 문란해지고 농민 봉기가 일어났다."], "years": "1392–1863", "summary": "성리학을 바탕으로 나라의 틀을 세우고, 두 번의 큰 전쟁을 겪은 뒤 개혁과 쇠퇴를 거친 시기다.", "people": "이성계, 정도전, 태종, 세종, 성종, 조광조, 이황, 이이, 이순신, 광해군, 인조, 숙종, 영조, 정조, 정약용", "words": "성리학, 양반, 의정부와 6조, 경국대전, 훈민정음, 사화, 서원과 향약, 반정, 대동법, 균역법, 실학, 삼정의 문란", "region": "한국사"}, {"name": "한국사 · 근대", "points": ["1863년 고종이 왕이 되고 흥선대원군이 정치를 이끌며 서양 세력의 접근을 막았다(1866 병인양요, 1871 신미양요).", "1876년 강화도 조약으로 항구를 열고, 임오군란(1882)과 갑신정변(1884)이 일어났다.", "1894년 동학농민운동이 일어나고 청일전쟁과 갑오개혁이 이어졌다.", "1897년 고종이 대한제국을 선포했다. 1905년 을사늑약으로 외교권을 빼앗기고 1910년 일본에 나라를 빼앗겼다.", "1919년 3·1 운동이 일어나고 대한민국 임시정부가 세워졌다.", "1920년 봉오동·청산리 전투, 1927년 신간회 등 무장 투쟁과 민족 운동이 이어졌다.", "1932년 윤봉길 의거와 1940년 한국광복군 창설로 독립운동이 계속되었고, 1945년 8월 15일 광복을 맞았다."], "years": "1863–1945", "summary": "서양과 일본의 압력 속에서 나라가 흔들리다 식민 지배를 받고, 독립운동으로 맞선 시기다.", "people": "흥선대원군, 고종, 전봉준, 안중근, 유관순, 홍범도, 김좌진, 김구, 이봉창, 윤봉길", "words": "불평등 조약, 치외법권, 위정척사와 개화, 동학, 의병, 을사늑약, 식민 통치, 민족자결주의", "region": "한국사"}, {"name": "한국사 · 현대", "points": ["1945년 광복 뒤 38도선을 경계로 남북이 나뉘고, 1948년 남과 북에 서로 다른 정부가 세워졌다.", "1950년 6·25 전쟁이 일어나 1953년 정전 협정을 맺었다.", "1960년 4·19 혁명으로 이승만 정부가 물러났다.", "1961년 5·16 군사 정변 뒤 박정희 정부가 경제 개발을 이끌고 1972년 유신 체제를 세웠다.", "1980년 5·18 민주화운동, 1987년 6월 민주항쟁을 거쳐 대통령을 국민이 직접 뽑게 되었다.", "1997년 외환위기를 겪고, 1998년 처음으로 선거를 통한 여야 정권 교체가 이루어졌다. 2000년 첫 남북 정상회담이 열렸다."], "years": "1945–", "summary": "분단과 전쟁을 겪고 산업화와 민주화를 거쳐 오늘에 이른 시기다.", "people": "이승만, 김구, 박정희, 전두환, 김영삼, 김대중", "words": "휴전과 종전, 계엄령, 산업화, 직선제", "region": "한국사"}, {"name": "세계사 · 서양 고대", "points": ["기원전 8세기경부터 그리스에 아테네, 스파르타 같은 도시국가(폴리스)가 생겨났다.", "기원전 508년 아테네에서 시민이 참여하는 민주정이 시작되고, 그리스가 페르시아 전쟁(기원전 492–479)을 막아 냈다.", "기원전 4세기 알렉산드로스가 동서에 걸친 큰 제국을 세워 헬레니즘 문화가 퍼졌다.", "로마가 공화정 아래 지중해를 차지하고, 기원전 27년 황제가 다스리는 제국이 되었다.", "313년 기독교가 공인되고 392년 국교가 되었다. 395년 제국이 동서로 나뉘고 476년 서로마가 무너졌다."], "years": "기원전 8세기–476", "summary": "그리스와 로마가 민주정, 철학, 법 같은 서양 문명의 뿌리를 만든 시기다.", "people": "페리클레스, 소크라테스, 플라톤, 아리스토텔레스, 알렉산드로스, 카이사르, 아우구스투스, 콘스탄티누스", "words": "폴리스, 민주정, 공화정, 기독교", "region": "세계사"}, {"name": "세계사 · 서양 중세", "points": ["게르만족이 옮겨 와 나라를 세우고, 800년 프랑크 왕 카롤루스가 교황에게 황제의 관을 받았다.", "영주와 기사가 땅을 매개로 맺은 봉건제와, 농노가 장원에서 일하는 장원제가 자리 잡았다.", "로마 가톨릭 교회가 유럽 사람들의 생활과 생각을 이끌었다. 1054년 서쪽 로마 교회와 동쪽 정교회가 갈라졌다.", "1096년부터 약 200년간 십자군 전쟁이 이어졌다. 교황권이 약해지고 무역과 도시가 살아났다.", "동쪽의 비잔티움 제국은 1천 년 넘게 이어지다 1453년 오스만 제국에 무너졌다."], "years": "476–1453", "summary": "서유럽은 교회와 영주가 사회를 이끌고, 동쪽에서는 비잔티움 제국이 로마를 이어 간 시기다.", "people": "카롤루스 대제, 유스티니아누스, 우르바누스 2세, 살라딘", "words": "봉건제, 기독교, 그리스 정교, 십자군", "region": "세계사"}, {"name": "세계사 · 서양 근세", "points": ["14–16세기 이탈리아에서 르네상스가 일어나 인간과 고전을 새롭게 바라봤다.", "1517년 루터가 교회를 비판하며 종교개혁이 시작되었다. 1648년 베스트팔렌 조약으로 30년 전쟁이 끝났다.", "1492년 콜럼버스가 아메리카에, 1498년 바스쿠 다 가마가 인도에 닿으며 신항로가 열렸다.", "16–18세기 왕이 관료와 상비군을 거느리고 큰 권력을 쥐는 절대왕정이 나타났다(루이 14세)."], "years": "14–18세기", "summary": "유럽이 신 중심에서 인간 중심으로 눈을 돌리고, 바다로 나가 세계와 이어진 시기다.", "people": "레오나르도 다 빈치, 미켈란젤로, 마르틴 루터, 칼뱅, 콜럼버스, 엘리자베스 1세, 루이 14세", "words": "인문주의, 면벌부, 노예무역, 절대왕정", "region": "세계사"}, {"name": "세계사 · 서양 근대", "points": ["17세기 과학혁명과 18세기 계몽사상이 퍼지며 나라의 주인은 국민이라는 생각이 자랐다.", "영국의 명예혁명(1688), 미국 독립혁명(1776), 프랑스 혁명(1789)이 이어졌다.", "1815년 빈 체제가 옛 질서를 되돌리려 했지만 자유주의와 민족주의가 퍼져 이탈리아(1861)와 독일(1871)이 통일되었다.", "18세기 후반 영국에서 산업혁명이 시작되고, 19세기 후반 열강이 아시아와 아프리카를 식민지로 나눠 가졌다."], "years": "17–19세기", "summary": "시민혁명과 산업혁명으로 오늘날 정치와 경제의 틀이 만들어지고, 그 힘이 제국주의로 이어진 시기다.", "people": "뉴턴, 로크, 루소, 워싱턴, 나폴레옹, 비스마르크, 링컨, 마르크스", "words": "계몽주의, 입헌군주제, 삼권 분립, 민족주의, 산업화, 자본주의, 사회주의, 제국주의", "region": "세계사"}, {"name": "세계사 · 현대 세계", "points": ["1914–1918년 제1차 세계대전이 일어나고, 1917년 러시아 혁명으로 첫 사회주의 국가가 세워졌다.", "1929년 대공황 뒤 전체주의가 힘을 얻고, 1939–1945년 제2차 세계대전이 일어났다.", "1945년 국제연합(UN)이 만들어지고 미국과 소련이 맞서는 냉전이 시작되었다.", "1989년 베를린 장벽이 무너지고 1991년 소련이 해체되며 냉전이 끝났다.", "냉전 뒤 1993년 유럽연합(EU)이 출범하고, 2008년 금융위기와 2020년 코로나19가 세계를 흔들었다."], "years": "1914–", "summary": "두 번의 세계대전과 냉전을 거쳐 오늘의 세계에 이른 시기다.", "people": "레닌, 스탈린, 히틀러, 루스벨트, 처칠, 트루먼, 케네디, 고르바초프", "words": "민족자결주의, 공산주의, 대리전, 데탕트", "region": "세계사"}, {"name": "세계사 · 서아시아", "points": ["기원전 3500년경 메소포타미아, 기원전 3100년경 이집트에서 인류 최초의 문명이 생겨났다.", "기원전 550년 아케메네스 왕조 페르시아가 일어나 관용 정책으로 큰 제국을 다스렸다.", "7세기 무함마드가 이슬람을 시작하고, 이슬람 세계가 아바스 왕조 때 학문과 무역의 중심이 되었다.", "1299년경 일어난 오스만 제국이 1453년 콘스탄티노폴리스를 차지하고 쉴레이만 1세 때 전성기를 맞았다.", "1922년 오스만 제국이 끝나고 1923년 튀르키예 공화국이 세워졌다. 1948년 이스라엘이 건국되며 중동 전쟁이 이어졌다."], "years": "기원전 3500경–", "summary": "최초의 문명에서 페르시아, 이슬람, 오스만으로 큰 제국이 이어지고 오늘날 중동에 이른 흐름이다.", "people": "함무라비, 키루스 2세, 다리우스 1세, 무함마드, 메흐메트 2세, 쉴레이만 1세, 무스타파 케말", "words": "이슬람, 칼리프, 술탄, 예니체리, 튀르키예", "region": "세계사"}, {"name": "세계사 · 인도", "points": ["기원전 2500년경 인더스강 유역에서 계획도시를 갖춘 문명이 번성했다.", "기원전 1500년경 아리아인이 들어와 카스트제와 브라만교를 만들고, 석가모니가 불교를 열었다.", "마우리아 왕조의 아소카왕이 불교를 퍼뜨리고, 굽타 왕조 때 힌두교가 자리 잡았다.", "16세기 이슬람 왕조인 무굴 제국이 번성해 타지마할을 남겼다.", "1757년부터 영국이 인도를 차지했고, 간디의 비폭력 운동 끝에 1947년 인도와 파키스탄이 따로 독립했다."], "years": "기원전 2500경–", "summary": "불교와 힌두교, 이슬람이 겹겹이 쌓이고 영국의 지배를 거쳐 독립한 인도의 흐름이다.", "people": "석가모니, 아소카왕, 아크바르, 샤자한, 간디, 네루", "words": "불교, 신분제, 식민지", "region": "세계사"}, {"name": "세계사 · 중국", "points": ["기원전 1600년경 상나라가 갑골문을 썼고, 춘추전국 시대에 제자백가가 나타났다.", "기원전 221년 진시황이 중국을 처음 통일하고, 한나라가 유학과 비단길로 중국 문명의 틀을 다졌다.", "오랜 분열 끝에 589년 수나라가 다시 통일하고, 당나라 때 동아시아 문화권이 만들어졌다.", "송나라 때 성리학과 화약·나침반·인쇄술이 발달하고, 원·명·청이 이어지며 오늘날 영토의 틀이 잡혔다.", "1840년 아편전쟁 뒤 흔들리다 1911년 신해혁명으로 황제가 사라지고, 1949년 중화인민공화국이 세워졌다."], "years": "기원전 1600경–", "summary": "분열과 통일을 되풀이하며 동아시아의 중심이 되었다가 근대에 흔들리고 다시 일어선 중국의 흐름이다.", "people": "공자, 진시황, 한 무제, 당 태종, 주희, 쿠빌라이, 강희제, 쑨원, 마오쩌둥, 덩샤오핑", "words": "제자백가, 군현제, 조공과 책봉, 도교, 불평등 조약", "region": "세계사"}, {"name": "세계사 · 일본", "points": ["3–4세기 야마토 정권이 일어나고, 645년 다이카 개신 뒤 천황 중심의 율령 국가가 만들어졌다.", "1185년 가마쿠라 막부가 서며 무사(사무라이)가 다스리는 막부 시대가 시작되었다.", "15–16세기 전국 시대를 거쳐 도요토미 히데요시가 통일하고, 1603년 도쿠가와 이에야스가 에도 막부를 열었다.", "1868년 메이지 유신으로 빠르게 근대화한 뒤 청일전쟁, 러일전쟁을 거쳐 제국주의 국가가 되었다.", "1945년 패전 뒤 평화헌법을 만들고 경제 대국으로 다시 일어섰다."], "years": "3세기–", "summary": "천황의 율령 국가에서 무사의 막부 시대를 거쳐 근대화와 침략, 패전에 이른 일본의 흐름이다.", "people": "미나모토노 요리토모, 오다 노부나가, 도요토미 히데요시, 도쿠가와 이에야스, 메이지 천황", "words": "봉건제, 제국주의", "region": "세계사"}], "events": [{"title": "고조선", "era": "한국사 · 고조선과 삼국", "bg": ["청동기 문화를 바탕으로 농사가 발달하고 계급이 생기면서 한반도 북부와 만주에 나라가 생겨났다.", "『삼국유사』는 단군왕검이 '널리 사람을 이롭게 한다'는 홍익인간의 뜻을 품고 고조선을 세웠다는 이야기를 전한다."], "dev": ["비파형 동검과 고인돌이 고조선 문화가 퍼진 범위를 보여 준다.", "기원전 2세기 위만이 왕이 된 뒤 철기 문화를 받아들이고, 주변 나라와 한나라 사이의 중계 무역으로 힘을 키웠다.", "생명과 재산, 노동을 지키는 8조법이 있었고 그중 세 조목이 전한다.", "기원전 109년 한나라 무제가 침공했다. 싸우는 사이 지배층이 갈라지고 기원전 108년 수도 왕검성이 함락되었다."], "res": ["한나라가 그 땅에 낙랑 등 군현을 두었다.", "이후 부여, 고구려, 옥저, 동예, 삼한 같은 여러 나라가 성장했다."], "when": "기원전 2333–기원전 108 · 한반도 북부와 만주", "sum": "한국사에서 처음 세워진 나라다. 청동기 문화 위에서 일어나 철기를 받아들이며 성장하다 한나라에 무너졌다.", "mem": "개천절(10월 3일)은 고조선 건국을 기념하는 날이다. 기원전 2333년은 조선 시대 역사책 『동국통감』을 따른 건국 해이고, 끝난 해는 기원전 108년이다.", "see": "한국사 · 고조선과 삼국, 고구려", "id": "event-01"}, {"title": "고구려", "era": "한국사 · 고조선과 삼국", "bg": ["고구려는 압록강 중류의 산이 많은 땅에서 시작해 일찍부터 정복 활동으로 힘을 키웠다.", "전통 기록은 주몽(동명성왕)이 기원전 37년에 나라를 세웠다고 전한다."], "dev": ["소수림왕이 불교를 받아들이고 태학을 세웠으며(372) 율령을 반포해(373) 나라의 틀을 갖췄다.", "391년 왕위에 오른 광개토대왕이 만주와 한강 이북까지 영토를 넓히고, 400년 신라에 침입한 왜군을 물리쳤다.", "427년 장수왕이 수도를 평양으로 옮기고 475년 백제의 수도 한성을 함락했다.", "612년 을지문덕이 살수(지금의 청천강)에서 수나라 군대를 크게 물리쳤다(살수대첩).", "645년 당나라 태종이 쳐들어왔으나 안시성에서 막아 냈다."], "res": ["고구려는 동북아시아의 강국이 되어 중국 왕조의 침입을 막는 방파제 역할을 했다.", "오랜 전쟁으로 힘이 빠진 데다 연개소문이 죽은 뒤 지배층이 갈라졌고, 668년 신라와 당나라의 공격으로 멸망했다.", "광개토대왕릉비(중국 지안)와 충주 고구려비가 이 시기 고구려의 힘을 전한다."], "when": "기원전 37–668 · 만주와 한반도 북부", "sum": "만주와 한반도 북부를 다스린 군사 강국이다. 5세기에 전성기를 맞고 수나라와 당나라의 침입을 막아 냈다.", "mem": "소수림왕이 터를 닦고, 광개토대왕이 넓히고, 장수왕이 남쪽으로 내려갔다. 612 살수대첩, 645 안시성이다.", "see": "백제, 신라와 삼국 통일", "id": "event-02"}, {"title": "백제", "era": "한국사 · 고조선과 삼국", "bg": ["전통 기록은 고구려에서 내려온 온조가 기원전 18년에 한강 유역에 나라를 세웠다고 전한다.", "기름진 한강 유역에 자리 잡아 일찍부터 바닷길로 중국, 왜와 교류했다."], "dev": ["4세기 근초고왕 때 삼국 가운데 가장 먼저 전성기를 맞았다. 371년 고구려 평양성을 공격해 고국원왕이 전사했다.", "475년 고구려 장수왕에게 수도 한성을 잃고 웅진(공주)으로 옮겼다.", "무령왕(재위 501–523)이 나라를 다시 안정시키고, 성왕이 538년 사비(부여)로 수도를 옮기며 중흥을 꾀했다.", "성왕은 신라와 함께 한강 유역을 되찾았으나 신라 진흥왕이 이를 차지하자 맞서 싸우다 554년 관산성 전투에서 전사했다."], "res": ["660년 신라와 당나라의 공격으로 사비성이 함락되어 멸망했다.", "무령왕릉과 백제 금동대향로가 백제 문화의 높은 수준을 보여 준다.", "불교와 한자, 여러 기술을 왜에 전해 일본 고대 문화에 영향을 주었다."], "when": "기원전 18–660 · 한강 유역과 충청·전라", "sum": "한강 유역에서 시작해 웅진과 사비로 수도를 옮기며 세련된 문화를 꽃피운 나라다.", "mem": "수도는 한성 → 웅진(475) → 사비(538) 순서다. 『삼국사기』가 온조왕의 궁궐을 두고 쓴 '검소하되 누추하지 않고 화려하되 사치스럽지 않다(검이불루 화이불치)'는 말이 백제 문화를 설명할 때 자주 쓰인다.", "see": "고구려, 신라와 삼국 통일", "id": "event-03"}, {"title": "신라와 삼국 통일", "era": "한국사 · 고조선과 삼국", "bg": ["전통 기록은 박혁거세가 기원전 57년에 나라를 세웠다고 전한다. 한반도 동남쪽에 자리해 삼국 가운데 가장 늦게 발전했다.", "법흥왕이 율령을 반포하고(520) 불교를 공인해(527) 나라의 틀을 갖췄다.", "진흥왕이 화랑도를 정비하고 553년 한강 유역을 차지하며 전성기를 열었다. 562년에는 대가야를 병합했다."], "dev": ["고구려와 백제의 공격에 몰리자 김춘추가 648년 당나라와 동맹을 맺었다.", "660년 신라와 당나라 연합군이 백제를, 668년 고구려를 무너뜨렸다. 김유신이 신라군을 이끌었다.", "당나라가 옛 백제와 고구려 땅을 지배하고 신라까지 차지하려 하자 신라가 맞서 싸웠다.", "675년 매소성, 676년 기벌포 전투에서 당나라 군대를 몰아냈다."], "res": ["신라가 대동강과 원산만 이남을 차지하며 삼국을 통일했다.", "고구려 유민이 698년 북쪽에 발해를 세워 남북국 시대가 열렸다.", "외세를 끌어들였다는 한계와 한반도 대부분을 하나로 묶었다는 의미를 함께 평가받는다."], "when": "기원전 57–676 · 한반도 동남부에서 한반도로", "sum": "가장 늦게 출발한 신라가 한강 유역을 차지하고 당나라와 손잡아 삼국을 통일한 과정이다.", "mem": "한강을 차지한 순서가 전성기 순서다. 4세기 백제, 5세기 고구려, 6세기 신라다. 통일은 660 백제, 668 고구려, 676 완성이다.", "see": "고구려, 백제, 가야, 통일신라", "id": "event-04"}, {"title": "가야", "era": "한국사 · 고조선과 삼국", "bg": ["낙동강 하류는 철이 많이 나고 바닷길이 열려 있어 일찍부터 작은 나라들이 성장했다.", "『삼국유사』는 김수로가 42년에 금관가야를 세웠다는 이야기를 전한다."], "dev": ["전기에는 김해의 금관가야가 연맹을 이끌며 철을 낙랑과 왜에 팔았다.", "400년 고구려군이 신라를 도와 왜와 가야를 공격한 뒤 금관가야가 약해졌다.", "후기에는 고령의 대가야가 연맹을 이끌었다."], "res": ["여러 작은 나라가 느슨하게 묶인 연맹에 머물러 하나의 강한 왕국으로 크지 못했다.", "532년 금관가야가 신라 법흥왕에게, 562년 대가야가 진흥왕에게 병합되었다.", "철기 기술과 토기, 우륵이 신라에 전한 가야금 같은 문화를 남겼다."], "when": "42–562 · 낙동강 유역", "sum": "낙동강 유역의 작은 나라들이 철과 바다 무역으로 번영한 연맹이다. 끝내 신라에 병합되었다.", "mem": "앞은 김해 금관가야, 뒤는 고령 대가야다. 532년과 562년에 차례로 신라에 들어갔다.", "see": "신라와 삼국 통일, 한국사 · 고조선과 삼국", "id": "event-05"}, {"title": "발해", "era": "한국사 · 남북국", "bg": ["668년 고구려가 멸망한 뒤 당나라가 많은 고구려 사람들을 중국 안쪽으로 옮겼다.", "696년 거란이 당나라에 반란을 일으켜 혼란해진 틈에 대조영이 고구려 유민과 말갈 사람을 이끌고 탈출했다."], "dev": ["698년 대조영이 동모산에서 나라를 세웠다(처음 이름은 진국, 뒤에 발해).", "무왕이 당나라와 맞서며 영토를 넓히고, 문왕이 당나라와 교류하며 제도를 갖췄다.", "9세기 선왕 때 전성기를 맞아 '바다 동쪽의 번성한 나라'라는 뜻의 '해동성국'으로 불렸다.", "일본에 보낸 국서에서 고구려를 이었다는 뜻을 밝혔다."], "res": ["926년 거란의 공격으로 멸망했다.", "일부 유민이 고려로 와서 받아들여졌다.", "발해를 어느 나라 역사로 볼 것인지를 두고 한국과 중국의 역사 인식이 다르다."], "when": "698–926 · 만주와 한반도 북부", "sum": "고구려가 무너진 뒤 고구려 유민이 세운 나라다. 신라와 함께 남북국 시대를 이뤘다.", "mem": "698년에 세워져 926년에 멸망, 약 230년 이어졌다. 신라와 발해가 남북에 함께 있어 이 시기를 남북국 시대라고 부른다.", "see": "한국사 · 남북국, 고구려, 통일신라", "id": "event-06"}, {"title": "통일신라", "era": "한국사 · 남북국", "bg": ["삼국을 통일한 뒤 넓어진 땅과 늘어난 백성을 다스리고 세 나라의 문화를 하나로 묶어야 했다."], "dev": ["신문왕이 681년 김흠돌의 난을 누르고 진골 귀족의 힘을 줄였다. 682년 국학을 세우고 전국을 9주 5소경으로 나눠 다스렸다.", "원효와 의상이 불교를 백성에게 널리 퍼뜨렸다.", "8세기 중엽 불국사와 석굴암을 짓고 771년 성덕대왕신종을 완성했다.", "828년 장보고가 완도에 청해진을 두고 바다 무역을 이끌었다."], "res": ["8세기 말부터 진골 귀족의 왕위 다툼이 거세지고, 골품제에 막힌 6두품의 불만이 커졌다.", "지방에서 호족이 힘을 키우고 농민 봉기가 이어졌다.", "900년 후백제, 901년 후고구려가 세워져 후삼국 시대가 열렸고, 935년 신라가 고려에 항복했다."], "when": "676–935 · 한반도", "sum": "삼국을 통일한 신라가 왕권을 다지고 불교 문화를 꽃피웠다가 골품제의 한계로 흔들린 시기다.", "mem": "골품제가 신라를 떠받쳤지만, 뒤에는 6두품과 호족의 불만을 키워 나라를 흔들었다.", "see": "신라와 삼국 통일, 발해, 고려 건국", "id": "event-07"}, {"title": "고려 건국", "era": "한국사 · 고려", "bg": ["9세기 신라는 왕위 다툼과 흉년, 무거운 세금으로 흔들렸다.", "지방에서는 군대와 땅을 가진 호족이 힘을 키우고 농민 봉기가 이어졌다.", "견훤이 900년 후백제를, 궁예가 901년 후고구려를 세워 후삼국 시대가 열렸다."], "dev": ["918년 궁예가 쫓겨난 뒤 왕건이 고려를 세웠다.", "935년 신라 경순왕이 고려에 항복하고, 후백제의 견훤도 고려로 귀순했다.", "936년 왕건이 후백제를 무너뜨리고 후삼국을 통일했다.", "광종이 노비안검법(956)으로 억울하게 노비가 된 사람을 풀어 주어 호족의 힘을 줄이고, 과거제(958)로 시험을 보아 관리를 뽑았다.", "성종이 최승로의 시무 28조를 받아들여 유교를 바탕으로 나라의 제도를 갖췄다."], "res": ["왕건은 호족과 혼인을 맺고 성씨를 내려 주며 나라를 안정시켰다.", "나라 이름 '고려'는 고구려를 잇는다는 뜻으로 알려져 있다. 발해가 거란에 멸망한 뒤 발해 유민도 받아들였다.", "태조가 호족을 달래고, 광종이 호족의 힘을 줄이고, 성종이 제도를 완성하며 고려의 틀이 잡혔다."], "when": "918–997 · 고려", "sum": "왕건이 호족을 아우르며 고려를 세우고 후삼국을 통일한 뒤, 광종과 성종이 나라의 틀을 다진 과정이다.", "mem": "건국 918, 통일 936이다. 태조는 호족 달래기, 광종은 호족 힘 빼기, 성종은 제도 완성이다.", "see": "통일신라, 한국사 · 고려, 거란과 여진의 침입", "id": "event-08"}, {"title": "거란과 여진의 침입", "era": "한국사 · 고려", "bg": ["거란은 926년 발해를 멸망시킨 뒤 중국 송나라와 대립했다.", "고려는 송나라와 가깝게 지내고 거란을 멀리해 거란이 뒤를 걱정하게 됐다."], "dev": ["993년 거란이 처음 침입했다. 서희가 거란 장수 소손녕과 담판해 '고려는 고구려를 이은 나라'임을 밝히고 교류를 약속하는 대신 압록강 동쪽 땅 강동 6주를 얻었다.", "1010년 거란이 다시 침입해 개경이 점령당하고 왕이 피란했다.", "1018년 거란이 세 번째로 쳐들어오자 1019년 강감찬이 귀주에서 크게 물리쳤다(귀주대첩).", "12세기 초 여진이 강해지자 윤관이 별무반을 이끌고 여진을 몰아낸 뒤 동북 9성을 쌓았다(1107). 9성은 1109년 여진에 돌려주었다."], "res": ["고려는 북쪽 국경에 천리장성을 쌓아 방어를 다졌다.", "여진이 세운 금나라가 신하의 나라가 되라고 요구하자 권력을 쥔 이자겸이 받아들였다.", "안에서는 문벌 귀족이 권력을 쥐면서 이자겸의 난(1126)과 묘청의 서경 천도 운동(1135)이 일어나 지배층이 흔들렸다."], "when": "993–1135 · 고려", "sum": "거란과 여진의 침입을 외교와 전투로 막아 냈지만, 안에서는 문벌 귀족 사회가 흔들린 시기다.", "mem": "993 서희의 말로 이기고, 1019 강감찬의 칼로 이긴다. 여진은 윤관의 별무반이다.", "see": "고려 건국, 발해, 무신 정권과 몽골 침입", "id": "event-09"}, {"title": "무신 정권과 몽골 침입", "era": "한국사 · 고려", "bg": ["고려는 문신을 높이 대접하고 무신은 낮게 보는 분위기였다. 의종이 문신들과 놀이에 빠져 지내는 동안 무신의 불만이 쌓였다.", "13세기 몽골이 유라시아에 걸친 큰 제국으로 성장했다."], "dev": ["1170년 정중부 등 무신이 문신을 대거 죽이고 의종을 몰아냈다(무신정변).", "1196년 최충헌이 권력을 잡고 최씨 가문이 4대 60여 년 동안 정권을 쥐었다.", "지배층이 바뀌는 사이 망이·망소이의 난(1176), 만적의 난(1198) 같은 농민과 천민의 봉기가 이어졌다.", "1225년 고려에 왔던 몽골 사신이 숨진 일을 빌미로 1231년 몽골이 침입했다. 1232년 최우가 강화도로 수도를 옮기고 장기 항전에 들어갔다.", "백성들은 산성과 섬에 들어가 싸웠고, 부처의 힘으로 나라를 지키겠다는 마음으로 팔만대장경을 새겼다(1236–1251)."], "res": ["1259년 몽골과 강화를 맺고, 1270년 개경으로 돌아오며 무신 정권이 끝났다.", "이에 반대한 삼별초가 진도와 제주도에서 1273년까지 싸웠다.", "이후 고려는 약 80년간 원나라의 간섭을 받았다."], "when": "1170–1270 · 고려", "sum": "무신이 문신을 몰아내고 약 100년간 권력을 잡은 사이, 몽골이 침입해 고려가 강화도에서 오래 맞선 시기다.", "mem": "1170 무신정변, 1231 몽골 침입, 1232 강화도 천도, 1270 개경 환도다. 고려는 무신정변과 몽골 침입을 기점으로 앞뒤가 갈린다.", "see": "거란과 여진의 침입, 원 간섭기와 공민왕", "id": "event-10"}, {"title": "원 간섭기와 공민왕", "era": "한국사 · 고려", "bg": ["몽골과 강화한 뒤 고려 왕은 원나라 공주와 혼인하고 원나라의 간섭을 받았다.", "원나라에 기댄 권문세족이 넓은 농장을 차지하고 백성을 노비로 삼았다."], "dev": ["14세기 중엽 원나라가 약해지자 1351년 왕위에 오른 공민왕이 원나라의 간섭에서 벗어나려 했다.", "1356년 기철 등 친원 세력을 없애고 쌍성총관부를 공격해 철령 이북 땅을 되찾았다.", "1366년 신돈을 앞세워 전민변정도감을 두고, 권문세족이 빼앗은 땅을 주인에게 돌려주고 억울하게 노비가 된 사람을 풀어 주었다.", "홍건적과 왜구가 쳐들어오자 최영과 이성계 같은 무장이 물리치며 이름을 얻었다."], "res": ["권문세족의 반발로 개혁은 멈췄고, 공민왕은 1374년 시해되었다.", "개혁 과정에서 성장한 신진사대부와 외적을 막아 낸 신흥 무인 세력이 손잡고 새 왕조를 열었다."], "when": "1270–1392 · 고려", "sum": "원나라의 간섭 속에 권문세족이 힘을 키우자 공민왕이 개혁에 나섰고, 그 과정에서 조선을 세울 세력이 자란 시기다.", "mem": "공민왕 때 자란 신진사대부(붓)와 외적을 막은 무인(칼)이 손잡아 조선을 세웠다.", "see": "무신 정권과 몽골 침입, 조선 건국", "id": "event-11"}, {"title": "조선 건국", "era": "한국사 · 조선", "bg": ["14세기 후반 원나라가 약해지고 명나라가 일어났다. 고려를 개혁하려던 신진사대부는 고려를 고쳐 쓰자는 쪽(정몽주)과 새 나라를 세우자는 쪽(정도전)으로 갈라졌다.", "1388년 명나라가 옛 원나라 영토였던 철령 이북 땅을 요구하자 최영이 요동을 공격하려 했다."], "dev": ["이성계는 작은 나라가 큰 나라를 공격할 수 없다는 이유 등을 들어 반대했지만 출정했다.", "1388년 압록강의 위화도에서 군대를 돌려 개경으로 돌아와 권력을 잡았다(위화도 회군).", "정도전 등 신진사대부와 함께 과전법(1391)으로 토지 제도를 고쳤다.", "1392년 이성계가 왕위에 올라 조선을 세우고 1394년 한양으로 수도를 옮겼다.", "이방원(태종)이 왕자의 난으로 정도전을 없애고 왕위에 올라, 6조 직계제와 호패법으로 왕권을 다졌다."], "res": ["불교를 중시한 고려와 달리 성리학을 나라의 기본 사상으로 삼았다.", "태조가 태종과 갈등해 함흥에 머물 때 보낸 사신이 돌아오지 못했다는 이야기에서 '함흥차사'라는 말이 생겼다고 전한다."], "when": "1388–1418 · 고려에서 조선으로", "sum": "이성계가 군대를 돌려 권력을 잡고 정도전과 함께 조선을 세운 뒤, 태종이 왕권을 다진 과정이다.", "mem": "1388 회군, 1392 건국, 1394 한양 천도다.", "see": "원 간섭기와 공민왕, 세종과 조선 전기", "id": "event-12"}, {"title": "세종과 조선 전기", "era": "한국사 · 조선", "bg": ["태종이 다져 놓은 강한 왕권 위에서 세종이 1418년 왕위에 올랐다.", "우리말을 적을 글자가 없어 한자를 빌려 썼고 글을 배우기 어려운 백성이 많았다."], "dev": ["세종이 집현전을 두어 학자를 키우며 학문과 제도를 발전시켰다.", "1443년 세종이 훈민정음을 만들고, 1446년 만든 원리와 쓰는 법을 설명한 『훈민정음』을 펴내 널리 알렸다.", "장영실 같은 기술자가 활약하며 해시계 앙부일구(1434), 측우기(1441) 같은 과학 기구가 만들어졌다.", "북쪽에 4군 6진을 개척해 압록강과 두만강까지 국경을 넓혔다.", "세조가 계유정난(1453)으로 권력을 잡은 뒤 법전 편찬을 시작했고, 1485년 성종 때 『경국대전』이 완성되었다."], "res": ["정치와 법, 과학, 문화가 고루 발전한 조선 전기의 황금기가 열렸다.", "『훈민정음』 해례본은 유네스코 세계기록유산이 되었고, 한글날(10월 9일)이 만들어졌다."], "when": "1418–1494 · 조선", "sum": "세종이 훈민정음을 만들고 과학과 문화를 일으켰으며, 성종 때 『경국대전』으로 나라의 틀이 완성된 시기다.", "mem": "태종이 왕권을 다지고, 세종이 문화를 꽃피우고, 성종이 법전을 완성했다. 훈민정음은 1443년에 만들고 1446년에 반포했다.", "see": "조선 건국, 사림의 성장", "id": "event-13"}, {"title": "사림의 성장", "era": "한국사 · 조선", "bg": ["세조의 즉위를 도운 공신(훈구)이 높은 벼슬과 넓은 땅을 차지했다.", "성종이 이들을 견제하려고 김종직 같은 지방 선비(사림)를 불러 썼다."], "dev": ["훈구의 반격으로 사림이 크게 화를 입는 사화가 네 번 일어났다. 무오사화(1498), 갑자사화(1504), 기묘사화(1519), 을사사화(1545)다.", "중종 때 조광조가 현량과로 인재를 뽑고 공신의 거짓 공훈을 바로잡으려다 기묘사화로 목숨을 잃었다.", "사림은 서원과 향약을 바탕으로 지방에서 뿌리를 내렸다. 1543년 주세붕이 백운동서원을 세웠다.", "이황과 이이 같은 성리학자가 활약했다."], "res": ["선조 때 사림이 정권을 잡았다.", "1575년 무렵 사림이 동인과 서인으로 나뉘며 붕당 정치가 시작되었다."], "when": "1498–1575 · 조선", "sum": "지방 선비인 사림이 네 번의 사화를 겪으면서도 서원과 향약으로 힘을 키워 정권을 잡은 과정이다.", "mem": "사화는 무오·갑자·기묘·을사, 네 번이다. 사림이 버틴 힘은 서원(학교)과 향약(마을 규약)이다.", "see": "세종과 조선 전기, 임진왜란과 병자호란, 붕당과 환국", "id": "event-14"}, {"title": "임진왜란과 병자호란", "era": "한국사 · 조선", "bg": ["조선은 오랜 평화로 군사 대비가 허술했다.", "일본은 도요토미 히데요시가 1590년 전국을 통일하고 명나라 정복을 내걸며 조선을 길로 삼으려 했다."], "dev": ["1592년 4월 일본군이 부산에 상륙해 약 20일 만에 한양을 점령하고 선조가 피란했다.", "이순신의 수군이 옥포와 한산도 등에서 연이어 이기고 전국에서 의병이 일어났다. 명나라가 군대를 보내 돕고 1593년 권율이 행주산성에서 이겼다.", "1597년 일본이 다시 침입했고(정유재란) 이순신이 명량에서 적은 배로 크게 이겼다. 1598년 일본군이 물러나는 길에 노량 해전에서 이순신이 전사했다.", "광해군이 명나라와 후금 사이에서 중립 외교를 폈지만 1623년 인조반정으로 쫓겨났다.", "명나라를 가까이하고 후금을 멀리한 인조 정부는 1627년 정묘호란을 겪었다. 1636년 청나라가 다시 쳐들어오자(병자호란) 인조가 남한산성에서 버티다 1637년 삼전도에서 항복했다."], "res": ["전 국토가 황폐해지고 인구와 농지가 크게 줄었으며 경복궁 등 많은 문화재가 불탔다.", "소현세자 등이 청나라에 볼모로 끌려가고 수많은 백성이 포로가 되었다.", "두 전쟁 뒤 신분제와 나라의 질서가 흔들렸다. 이 두 전쟁을 기준으로 조선 전기와 후기를 나눈다."], "when": "1592–1637 · 조선", "sum": "일본과 청나라가 차례로 쳐들어온 두 전쟁이다. 조선은 큰 피해를 입었고 나라의 모습이 크게 바뀌었다.", "mem": "임진년(1592)에 일본, 병자년(1636)에 청나라가 쳐들어왔다. 광해군의 중립 외교와 인조의 친명 외교를 견줘 보면 흐름이 잡힌다.", "see": "사림의 성장, 붕당과 환국", "id": "event-15"}, {"title": "붕당과 환국", "era": "한국사 · 조선", "bg": ["선조 때 사림이 동인과 서인으로 나뉜 뒤, 처음에는 붕당이 서로 견제하며 함께 나라를 이끌었다.", "전쟁 뒤 나라를 다시 세우는 과정에서 개혁을 두고 의견이 갈렸다. 1608년 경기도에서 시작한 대동법은 오랜 논쟁 끝에 1708년 황해도까지 넓혀졌다."], "dev": ["현종 때 효종과 효종비가 세상을 떠나자, 대비가 상복을 얼마 동안 입어야 하는지를 두고 서인과 남인이 맞섰다. 이를 예송이라 하며 1659년과 1674년 두 번 벌어졌다.", "숙종은 집권 붕당을 한꺼번에 바꾸는 환국을 여러 번 일으켰다(1680 경신환국, 1689 기사환국, 1694 갑술환국).", "인현왕후와 장희빈을 둘러싼 다툼도 환국과 얽혔다."], "res": ["상대 붕당을 아예 몰아내려는 다툼이 거세지면서 붕당끼리의 균형이 무너졌다.", "서인에서 갈라진 노론이 힘을 키웠고, 영조와 정조의 탕평 정치로 이어졌다."], "when": "1659–1724 · 조선", "sum": "함께 나라를 이끌던 붕당이 예송과 환국을 거치며 상대를 몰아내는 다툼으로 바뀐 시기다.", "mem": "붕당은 공존(견제) → 대립(예송) → 한 당의 독차지(환국) 순서로 바뀌었다.", "see": "사림의 성장, 임진왜란과 병자호란, 영조와 정조의 개혁", "id": "event-16"}, {"title": "영조와 정조의 개혁", "era": "한국사 · 조선", "bg": ["17세기 이후 붕당이 서로 다투며 정권을 뒤엎는 일이 되풀이되었다.", "전쟁 뒤 경제가 회복되며 상업과 농업이 발전하고 학문도 활기를 띠었다."], "dev": ["영조(재위 1724–1776)가 여러 붕당의 인재를 고루 쓰는 탕평 정치를 폈다.", "1750년 영조가 군포를 2필에서 1필로 줄이는 균역법을 시행했다.", "정조(재위 1776–1800)가 1776년 규장각을 세워 학문을 키우고, 젊은 관리를 다시 가르치는 초계문신제로 인재를 길렀다.", "정조가 1794–1796년 수원 화성을 쌓고, 1791년 신해통공으로 시전 상인의 특권을 줄여 자유로운 장사를 넓혔다.", "정약용, 박지원 같은 실학자가 활약하고 김홍도, 신윤복의 풍속화 같은 서민 문화가 꽃피었다."], "res": ["정치와 민생이 안정되었으나, 정조가 죽은 뒤 몇몇 가문이 권력을 쥐는 세도정치로 이어졌다."], "when": "1724–1800 · 조선", "sum": "두 왕이 신하들의 다툼을 누르고 백성의 부담을 덜며 문화를 일으킨 시기다.", "mem": "영조는 탕평과 균역법, 정조는 규장각·수원 화성·신해통공이다. 영조가 끝나는 해(1776)에 정조가 시작한다.", "see": "붕당과 환국, 세도정치", "id": "event-17"}, {"title": "세도정치", "era": "한국사 · 조선", "bg": ["1800년 정조가 갑자기 세상을 떠나고 어린 왕들(순조·헌종·철종)이 잇달아 왕위에 올랐다."], "dev": ["안동 김씨, 풍양 조씨 같은 왕의 외척 가문이 60여 년 동안 권력을 쥐었다.", "돈으로 벼슬을 사고파는 일이 흔해지고, 땅세(전정)·군포(군정)·곡식 대여(환곡)를 걷는 삼정이 크게 문란해졌다.", "1811년 평안도에서 홍경래의 난이 일어났다.", "1860년 최제우가 동학을 만들어 모든 사람이 귀하다는 생각을 퍼뜨렸다.", "1862년 진주에서 시작된 농민 봉기가 전국으로 번졌다(임술 농민 봉기)."], "res": ["나라의 힘이 안에서부터 약해진 채 서양 세력과 일본의 압력을 맞게 되었다."], "when": "1800–1863 · 조선", "sum": "정조가 죽은 뒤 몇몇 외척 가문이 권력을 독차지하면서 정치가 어지러워지고 백성의 삶이 무너진 시기다.", "mem": "정조가 죽은 1800년부터 고종이 왕이 된 1863년까지 약 60년이다. 삼정은 전정·군정·환곡이다.", "see": "영조와 정조의 개혁, 개항과 동학농민운동", "id": "event-18"}, {"title": "개항과 동학농민운동", "era": "한국사 · 근대", "bg": ["세도정치로 나라가 어지럽고 1862년 농민 봉기가 전국에서 일어났다.", "서양 배들이 자주 나타나 통상을 요구하고, 메이지 유신을 마친 일본도 조선에 문을 열라고 요구했다."], "dev": ["1863년 고종이 12세로 즉위하고 아버지 흥선대원군이 정치를 이끌었다. 세도 가문을 누르고 서원을 줄였으며 경복궁을 다시 지었다(1865–1868).", "1866년 프랑스(병인양요), 1871년 미국(신미양요)이 강화도를 공격했다. 흥선대원군은 서양과 교류하지 않겠다는 뜻으로 척화비를 세웠다.", "1873년 고종이 직접 정치를 시작했다. 1875년 운요호 사건 뒤 1876년 일본과 강화도 조약을 맺어 부산 등 항구를 열었다.", "개화를 둘러싼 갈등으로 임오군란(1882)과 갑신정변(1884)이 일어났다.", "1894년 전봉준이 이끈 동학 농민군이 일어나 전주성을 점령했다. 청나라와 일본이 군대를 보내자 정부와 화약을 맺었으나, 일본이 경복궁을 점령하자 다시 일어났다가 우금치 전투에서 크게 패했다."], "res": ["강화도 조약은 일본의 해안 측량과 일본인을 일본 법으로 재판하는 권리를 인정한 불평등 조약이었다.", "이후 미국(1882) 등 여러 나라와 조약을 맺고 서양 문물이 들어왔다.", "1894년 청일전쟁이 일어나고, 갑오개혁으로 신분제가 공식적으로 없어졌다. 농민군의 요구가 일부 반영되었다."], "when": "1863–1894 · 조선", "sum": "흥선대원군이 서양을 막다 물러난 뒤 조선이 일본에 항구를 열고, 안팎의 갈등이 동학농민운동으로 터진 시기다.", "mem": "1866 병인양요, 1871 신미양요, 1876 강화도 조약이다. 1894년에는 동학농민운동, 청일전쟁, 갑오개혁이 한 해에 일어났다.", "see": "세도정치, 국권 침탈과 저항", "id": "event-19"}, {"title": "국권 침탈과 저항", "era": "한국사 · 근대", "bg": ["청일전쟁에서 이긴 일본의 간섭이 커졌다. 1895년 일본 세력이 명성황후를 시해하는 을미사변이 일어났고, 1896년 고종이 러시아 공사관으로 피신했다(아관파천).", "러시아와 일본이 한반도를 두고 대립했다."], "dev": ["1896년 독립협회가 세워지고 만민공동회를 열어 나라의 자주와 개혁을 외쳤다.", "1897년 고종이 궁으로 돌아와 대한제국을 선포하고 황제가 되어 광무개혁을 폈다.", "1904년 러일전쟁이 시작되고, 1905년 을사늑약으로 외교권을 빼앗겼다. 1906년 통감부가 설치되었다.", "1907년 고종이 헤이그에 특사를 보냈으나 강제로 물러나고 군대가 해산되자 의병이 크게 일어났다. 국채 보상 운동 같은 애국 계몽 운동도 이어졌다.", "1909년 안중근이 하얼빈에서 이토 히로부미를 처단했다.", "1910년 일본이 강제로 병합 조약을 맺어 나라를 빼앗았다(국권 피탈, 경술국치)."], "res": ["1910년부터 1945년까지 일제 강점기가 이어졌다.", "많은 사람이 의병과 독립운동에 나섰다."], "when": "1895–1910 · 대한제국", "sum": "고종이 황제가 되어 나라를 지키려 했지만 일본에 외교권과 나라를 차례로 빼앗긴 과정이다.", "mem": "러일전쟁(1904) → 을사늑약(1905) → 군대 해산(1907) → 국권 피탈(1910) 순서다. 외교권을 빼앗긴 지 5년 만에 나라를 빼앗겼다.", "see": "개항과 동학농민운동, 3·1 운동", "id": "event-20"}, {"title": "3·1 운동", "era": "한국사 · 근대", "bg": ["1910년대 일제가 헌병 경찰을 앞세운 무단 통치와 토지 조사 사업으로 한국인을 억압했다.", "제1차 세계대전 뒤 '민족의 운명은 스스로 결정한다'는 민족자결주의가 퍼졌다.", "1919년 1월 고종이 갑자기 세상을 떠나고 도쿄의 유학생들이 독립을 선언했다(2·8 독립선언)."], "dev": ["1919년 3월 1일 민족 대표 33인이 독립선언서를 낭독하고, 탑골공원에서 학생과 시민이 만세를 외쳤다.", "시위가 전국과 해외로 퍼지고 농민, 노동자, 학생 등 다양한 사람이 참여했다.", "일제가 무력으로 진압해 많은 사람이 죽거나 다쳤고 제암리 학살 같은 일이 벌어졌다.", "천안 아우내 장터에서 만세를 이끈 유관순이 붙잡혀 옥에서 숨졌다."], "res": ["1919년 4월 상하이에 민주 공화제를 내건 대한민국 임시정부가 세워졌다.", "일제가 통치 방식을 이른바 문화 통치로 바꿨다.", "다른 나라의 독립운동에도 영향을 주었다는 평가를 받는다."], "when": "1910–1919 · 한반도와 해외", "sum": "무단 통치에 억눌린 민족이 한목소리로 독립을 외친 대규모 만세 운동이다.", "mem": "1919년 3월 1일이다. 임시정부도 같은 해에 세워졌다.", "see": "국권 침탈과 저항, 1920년대 민족 운동", "id": "event-21"}, {"title": "1920년대 민족 운동", "era": "한국사 · 근대", "bg": ["3·1 운동 뒤 일제는 이른바 문화 통치로 바꿔 겉으로는 언론과 집회를 조금 허용했지만, 실제로는 경찰을 늘리고 친일파를 길러 민족을 나누려 했다.", "산미 증식 계획(1920–)으로 쌀 생산을 늘렸지만 더 많은 쌀이 일본으로 실려 가 농민의 삶이 어려워졌다."], "dev": ["1920년 홍범도가 봉오동에서, 김좌진 등이 청산리에서 일본군을 크게 물리쳤다.", "1919년 김원봉이 만든 의열단이 일제 기관과 관리를 공격했다.", "국내에서는 우리 물건을 쓰자는 물산 장려 운동과 민립 대학 설립 운동이 일어났다.", "1926년 6·10 만세 운동이 일어나고, 1927년 민족주의와 사회주의 세력이 함께 신간회를 만들었다.", "1929년 광주 학생 항일 운동이 전국으로 번졌다."], "res": ["일제의 분열 정책 속에서도 무장 투쟁과 민족 운동이 이어졌다.", "신간회는 1931년 해체되었지만, 좌우가 손잡은 가장 큰 민족 운동 단체로 평가받는다."], "when": "1920–1930 · 한반도와 만주", "sum": "일제가 문화 통치로 민족을 나누려 하자 만주의 무장 투쟁과 국내의 민족 운동으로 맞선 시기다.", "mem": "1920년대는 만주의 승리(봉오동·청산리)와 국내의 좌우 합작(신간회) 두 가지로 기억한다.", "see": "3·1 운동, 임시정부와 한국광복군", "id": "event-22"}, {"title": "임시정부와 한국광복군", "era": "한국사 · 근대", "bg": ["1931년 만주 사변, 1937년 중일 전쟁, 1941년 태평양 전쟁을 일으킨 일제가 한반도를 전쟁 물자를 대는 기지로 삼았다.", "일제는 신사 참배와 일본식 이름 강요(창씨개명, 1940), 우리말 교육 금지를 밀어붙이는 민족 말살 통치를 폈다. 징용과 징병으로 사람들을 끌고 갔고, 일본군 '위안부' 피해도 이때 일어났다."], "dev": ["어려움에 빠진 대한민국 임시정부에서 김구가 한인애국단을 만들었다(1931).", "1932년 1월 이봉창이 도쿄에서 일왕에게 폭탄을 던졌고, 4월 윤봉길이 상하이 훙커우 공원에서 일본군 지휘부에 폭탄을 던졌다.", "윤봉길 의거 뒤 중국 국민당 정부가 임시정부를 적극 돕기 시작했다.", "임시정부는 여러 곳을 옮겨 다니다 충칭에 자리 잡고 1940년 한국광복군을 만들었다. 1941년 일본에 선전 포고를 하고 국내 진공 작전을 준비했다."], "res": ["1943년 카이로 선언에서 연합국이 한국의 독립을 약속했다.", "1945년 8월 15일 일본이 항복해 광복을 맞았다. 국내 진공 작전은 일본의 항복으로 실행되지 못했다."], "when": "1931–1945 · 한반도와 중국", "sum": "일제가 민족 말살 통치를 펴는 동안 대한민국 임시정부가 의거와 한국광복군으로 독립 전쟁을 준비한 시기다.", "mem": "1932 윤봉길 의거로 임시정부가 다시 일어섰고, 1940년 한국광복군을 만들었다.", "see": "1920년대 민족 운동, 광복과 분단", "id": "event-23"}, {"title": "광복과 분단", "era": "한국사 · 현대", "bg": ["제2차 세계대전 중인 1943년 카이로 선언에서 한국의 독립이 약속되었다.", "미국과 소련이 서로 맞서는 냉전이 시작되었다."], "dev": ["1945년 8월 15일 일본이 항복하며 광복을 맞았다. 38도선을 경계로 북쪽에 소련군, 남쪽에 미군이 들어왔다.", "1945년 12월 모스크바 3국 외상 회의에서 신탁 통치가 논의되자 좌익과 우익이 크게 갈라졌다.", "김구와 김규식이 1948년 4월 남북 협상에 나섰지만, 5월 10일 남쪽에서만 총선거가 치러졌다.", "1948년 8월 15일 대한민국 정부가, 9월 9일 북쪽에 다른 정부가 세워졌다."], "res": ["분단이 굳어지고 이는 6·25 전쟁의 배경이 되었다."], "when": "1945–1948 · 한반도", "sum": "일본이 항복해 해방을 맞았지만 38도선을 경계로 남과 북에 서로 다른 정부가 세워진 과정이다.", "mem": "1945 광복, 1948 두 정부다. 3년 사이에 갈렸다.", "see": "임시정부와 한국광복군, 6·25 전쟁", "id": "event-24"}, {"title": "6·25 전쟁", "era": "한국사 · 현대", "bg": ["분단 뒤 38도선 부근에서 충돌이 계속되었다.", "냉전 속에서 북한은 소련과 중국의 지원을 약속받았다."], "dev": ["1950년 6월 25일 북한이 남침해 사흘 만에 서울을 점령했다.", "국군과 유엔군이 낙동강 방어선을 지키다 9월 인천상륙작전으로 서울을 되찾았다.", "10월 국군과 유엔군이 압록강 부근까지 북진하자 중국군이 개입해 1951년 1월 서울을 다시 내줬다(1·4 후퇴).", "이후 38도선 부근에서 밀고 밀리는 전투가 이어졌다.", "1953년 7월 27일 정전 협정이 맺어졌다."], "res": ["수많은 사람이 죽거나 다치고 가족이 헤어져 이산가족이 생겼다.", "분단이 굳어지고 한미상호방위조약이 맺어졌다(1953).", "전국이 폐허가 되었고 이후 오랜 재건이 이어졌다."], "when": "1950–1953 · 한반도", "sum": "북한의 남침으로 시작되어 3년간 이어진 전쟁이다. 세계 냉전의 대표적인 충돌이다.", "mem": "1950년 6월 25일에 시작해 1953년 7월 27일에 멈춘 3년 전쟁이다.", "see": "광복과 분단, 4·19 혁명", "id": "event-25"}, {"title": "4·19 혁명", "era": "한국사 · 현대", "bg": ["이승만 정부는 전쟁 중 발췌 개헌(1952)으로 대통령 직선제를 만들고, 1954년 사사오입 개헌으로 초대 대통령의 연임 제한을 없애 오래 집권했다.", "부패가 심해진 가운데 1960년 3월 15일 정·부통령 선거에서 대규모 부정이 벌어졌다."], "dev": ["3월 마산에서 부정선거에 항의하는 시위가 일어났다.", "4월 11일 마산 앞바다에서 시위 중 숨진 학생 김주열의 시신이 발견되며 분노가 커졌다.", "4월 19일 서울의 학생과 시민이 거리로 나서고 경찰의 발포로 많은 사람이 희생되었다.", "4월 26일 이승만이 대통령에서 물러났다."], "res": ["내각제로 헌법을 고쳐 장면 내각이 들어섰다.", "이듬해 5·16 군사 정변으로 이 정부가 무너졌다."], "when": "1960 · 대한민국", "sum": "학생과 시민이 부정선거에 맞서 이승만 정부를 물러나게 한 민주 혁명이다.", "mem": "4월 19일에 거리로 나가 일주일 뒤인 26일에 하야를 이끌어 냈다.", "see": "6·25 전쟁, 산업화와 유신", "id": "event-26"}, {"title": "산업화와 유신", "era": "한국사 · 현대", "bg": ["6·25 전쟁 뒤 나라는 매우 가난했다.", "4·19 혁명 뒤 들어선 장면 내각 시기인 1961년 5·16 군사 정변이 일어나 박정희가 권력을 잡았다."], "dev": ["1962년 제1차 경제개발 5개년 계획이 시작되었다.", "수출을 앞세워 경공업에서 중화학공업으로 산업을 키웠다. 1970년 경부고속도로가 개통되고 새마을 운동이 시작되었다.", "1977년 수출 100억 달러를 달성했다.", "1969년 3선 개헌에 이어 1972년 대통령이 사실상 계속 집권할 수 있는 유신 헌법을 만들었다(10월 유신)."], "res": ["소득이 빠르게 늘고 도시화가 진행되어 '한강의 기적'이라 불렸다.", "반면 1970년 전태일의 죽음이 알린 노동자의 열악한 환경과 유신 체제의 억압이라는 어두운 면도 컸다.", "1979년 부마 민주 항쟁에 이어 10·26 사태로 박정희가 숨지며 18년 집권이 끝났다."], "when": "1961–1979 · 대한민국", "sum": "박정희 정부 18년 동안 수출과 공업으로 빠르게 성장했지만, 유신 체제로 민주주의가 크게 뒷걸음친 시기다.", "mem": "1962 경제개발 계획 시작, 1972 유신, 1977 수출 100억 달러다. 성장과 독재, 두 얼굴을 함께 기억한다.", "see": "4·19 혁명, 5·18과 6월 민주항쟁", "id": "event-27"}, {"title": "5·18과 6월 민주항쟁", "era": "한국사 · 현대", "bg": ["1979년 10·26 사태 뒤 민주화의 기대가 커졌지만('서울의 봄'), 그해 12월 12일 전두환 등 신군부가 군사 반란으로 권력을 잡았다.", "1980년 5월 신군부가 계엄령을 전국으로 넓히며 민주화 요구를 눌렀다."], "dev": ["1980년 5월 18일 광주 시민이 계엄 철폐를 요구했고 군의 진압에 맞서 싸웠다(5·18 민주화운동).", "1987년 1월 대학생 박종철이 경찰 조사 중 고문으로 숨지고, 4월 13일 정부가 개헌 논의를 막자(4·13 호헌 조치) 분노가 커졌다.", "6월 연세대 학생 이한열이 최루탄에 맞아 쓰러지며 전국에서 시위가 일어났다(6월 민주항쟁).", "6월 29일 정부가 대통령 직선제 개헌을 받아들였다(6·29 선언)."], "res": ["그해 헌법이 고쳐져 대통령을 국민이 직접 뽑게 되었다(5년 단임).", "이후 민주주의가 점차 자리 잡았다."], "when": "1979–1987 · 대한민국", "sum": "군사 정권에 맞선 시민의 저항이 이어져 대통령을 직접 뽑는 제도를 얻어 낸 과정이다.", "mem": "1980년 광주, 1987년 직선제다.", "see": "산업화와 유신, 민주주의의 발전", "id": "event-28"}, {"title": "민주주의의 발전", "era": "한국사 · 현대", "bg": ["1987년 대통령 직선제를 얻어 낸 뒤 군사 정권의 흔적을 지우고 남북 관계를 풀어 갈 과제가 남았다.", "1990년대 많은 대기업이 빚을 크게 늘려 사업을 넓혔고 금융 기관도 부실해졌다."], "dev": ["노태우 정부가 북방 외교를 폈다. 1991년 남북한이 유엔에 함께 가입하고 남북 기본 합의서를 채택했다.", "김영삼 정부가 1993년 금융 실명제를 시행하고 1995년 지방 자치제를 전면 실시했다.", "1997년 11월 정부가 IMF에 구제 금융을 신청했다. 많은 기업이 문을 닫고 실업자가 크게 늘었다.", "1998년 김대중 정부가 들어서며 처음으로 선거를 통한 여야 정권 교체가 이루어졌다. 국민은 금을 모아 나라의 빚을 갚는 '금 모으기 운동'을 벌였다.", "2000년 6월 첫 남북 정상회담이 열리고 6·15 남북 공동 선언이 발표되었다."], "res": ["2001년 IMF에서 빌린 돈을 모두 갚았다.", "금융과 기업 구조가 크게 바뀌었으나 일자리가 불안정해지는 문제도 생겼다.", "산업화와 민주화를 함께 이룬 오늘의 대한민국으로 이어졌다."], "when": "1988–2000 · 대한민국", "sum": "직선제 이후 민주주의가 자리 잡고 남북 관계가 풀리는 한편, 외환위기를 겪고 이겨 낸 시기다.", "mem": "1993 금융 실명제, 1997 외환위기, 1998 첫 여야 정권 교체, 2000 6·15 남북 공동 선언이다.", "see": "5·18과 6월 민주항쟁, 광복과 분단", "id": "event-29"}, {"title": "고대 그리스", "era": "세계사 · 서양 고대", "bg": ["산이 많고 평야가 좁은 땅이라 하나의 나라 대신 아테네, 스파르타 같은 여러 도시국가(폴리스)가 생겨났다.", "폴리스들은 따로 다스려졌지만 같은 말과 신을 섬기며 올림피아 제전을 함께 열었다."], "dev": ["아테네는 바다 무역으로 성장하고, 기원전 508년 개혁으로 시민이 민회에서 직접 결정하는 민주정의 틀을 갖췄다. 페리클레스 때 전성기를 맞았다.", "스파르타는 적은 수의 시민이 엄격한 군사 훈련으로 많은 사람을 다스렸다.", "기원전 492년부터 페르시아가 침략했지만 마라톤 전투(기원전 490)와 살라미스 해전(기원전 480)에서 그리스가 이겼다.", "이후 아테네와 스파르타가 펠로폰네소스 전쟁(기원전 431–404)에서 맞붙어 그리스 전체가 약해졌다."], "res": ["소크라테스, 플라톤, 아리스토텔레스로 이어진 철학과 민주정이 서양 문명의 뿌리가 되었다(파르테논 신전).", "다만 정치에 참여할 수 있는 시민은 성인 남성뿐이고 여성, 노예, 외국인은 빠졌다."], "when": "기원전 8–4세기 · 그리스", "sum": "여러 도시국가로 이루어진 그리스에서 민주정과 철학이 꽃피고, 페르시아를 막아 낸 뒤 내전으로 약해진 과정이다.", "mem": "아테네는 바다·민주정·철학, 스파르타는 내륙·군사다. 그리스를 약하게 만든 것은 페르시아가 아니라 내전(펠로폰네소스 전쟁)이었다.", "see": "알렉산드로스 제국, 고대 오리엔트", "id": "event-30"}, {"title": "알렉산드로스 제국", "era": "세계사 · 서양 고대", "bg": ["폴리스들이 내전으로 지친 사이 그리스 북쪽의 마케도니아가 필리포스 2세 때 그리스를 장악했다.", "기원전 336년 아들 알렉산드로스가 20세에 왕위에 올랐다."], "dev": ["기원전 334년 동방 원정을 시작해 페르시아 제국을 무너뜨리고 이집트와 인도 서북부까지 나아갔다.", "정복한 곳곳에 알렉산드리아라는 도시를 세우고, 그리스 사람과 페르시아 사람의 혼인을 장려했다.", "기원전 323년 바빌론에서 30대 초반의 나이로 세상을 떠났다."], "res": ["제국은 부하 장군들이 나눠 가졌다.", "그리스 문화와 동방 문화가 섞인 헬레니즘 문화가 퍼지고, 이집트의 알렉산드리아가 학문의 중심이 되었다.", "폴리스를 넘어 온 세상을 하나로 보는 세계 시민주의가 나타났고, 그리스 조각의 영향은 인도의 간다라 불상에까지 이어졌다."], "when": "기원전 334–30 · 그리스에서 인도 서북부까지", "sum": "마케도니아의 알렉산드로스가 동방 원정으로 큰 제국을 세우고, 그리스와 동방 문화가 섞인 헬레니즘 문화를 낳은 사건이다.", "mem": "20세에 왕이 되고 10여 년 만에 제국을 만들었다. 헬레니즘은 '그리스 + 동방'이다.", "see": "고대 그리스, 로마 제국, 인도의 통일 왕조", "id": "event-31"}, {"title": "로마 제국", "era": "세계사 · 서양 고대", "bg": ["로마는 기원전 509년 왕을 쫓아내고 공화정을 세웠다. 귀족과 평민이 다투다 12표법과 호민관으로 타협했다.", "카르타고와 벌인 포에니 전쟁(기원전 264–146)에서 이겨 지중해를 차지했지만, 빈부 격차가 커지고 내전이 이어졌다."], "dev": ["카이사르가 권력을 잡았다가 암살된 뒤, 기원전 27년 옥타비아누스가 '아우구스투스'라는 칭호를 받으며 황제가 다스리는 제국이 시작되었다.", "약 200년 동안 길과 법으로 이어진 안정기('로마의 평화')가 이어졌다.", "박해받던 기독교를 313년 콘스탄티누스 황제가 밀라노 칙령으로 공인하고, 392년 테오도시우스 황제가 국교로 삼았다.", "395년 제국이 동서로 나뉘고, 476년 게르만 용병대장에 의해 서로마 제국이 무너졌다."], "res": ["동쪽의 비잔티움 제국은 1453년까지 이어졌다.", "로마법, 라틴어, 도로와 도시, 기독교가 유럽 문명의 바탕이 되었다."], "when": "기원전 509–476 · 지중해", "sum": "도시국가에서 시작한 로마가 공화정을 거쳐 지중해를 둘러싼 대제국이 되었다가 동서로 나뉘어 서쪽이 무너진 과정이다.", "mem": "왕정 → 공화정(포에니 전쟁으로 확장) → 제정(로마의 평화) → 동서 분열 순서다. 313 공인, 392 국교, 476 서로마 멸망이다.", "see": "알렉산드로스 제국, 중세 서유럽, 비잔티움 제국", "id": "event-32"}, {"title": "중세 서유럽", "era": "세계사 · 서양 중세", "bg": ["서로마 제국이 무너진 뒤 게르만족이 곳곳에 나라를 세웠고, 노르만족과 이슬람 세력의 침입으로 질서가 무너졌다.", "스스로를 지킬 힘이 있는 지방의 영주에게 사람들이 기대게 되었다."], "dev": ["프랑크 왕국의 카롤루스 대제가 서유럽 대부분을 차지하고, 800년 교황에게 황제의 관을 받았다. 로마와 게르만, 기독교 문화가 하나로 섞였다.", "왕과 영주, 기사가 땅을 주고 충성을 약속하는 봉건제가 자리 잡았다. 주군이 의무를 어기면 관계를 끊을 수 있는 계약이었다.", "영주의 땅(장원)에서 농노가 농사를 지으며 거의 스스로 먹고사는 장원제가 이어졌다.", "로마 가톨릭 교회가 흩어진 유럽을 하나로 묶고, 교황이 황제와 맞설 만큼 큰 권위를 가졌다."], "res": ["왕의 힘이 약하고 지방이 저마다 다스려지는 사회가 되었다.", "1215년 영국 귀족들이 대헌장으로 왕의 권력을 제한한 것처럼, 계약과 의회의 전통이 싹텄다.", "1347년부터 퍼진 흑사병으로 인구가 크게 줄어 농민의 처지가 나아지고 봉건 질서가 흔들렸다."], "when": "5–14세기 · 서유럽", "sum": "서로마가 무너진 뒤 영주와 기사, 농노가 땅으로 묶인 봉건 사회가 자리 잡고 교회가 유럽을 이끈 시기다.", "mem": "봉건제는 땅과 충성을 바꾸는 '계약'이었다. 이 전통이 대헌장과 의회로 이어진다.", "see": "로마 제국, 십자군 전쟁, 르네상스", "id": "event-33"}, {"title": "십자군 전쟁", "era": "세계사 · 서양 중세", "bg": ["11세기 셀주크 튀르크가 예루살렘 일대를 차지하고 비잔티움 제국을 위협했다.", "1095년 교황 우르바누스 2세가 성지 탈환을 호소하자 유럽 곳곳에서 호응했다."], "dev": ["1096년 제1차 십자군이 출발해 1099년 예루살렘을 점령했다.", "이슬람 세력이 반격해 1187년 살라딘이 예루살렘을 되찾았다.", "갈수록 장사의 이익을 노리는 원정으로 바뀌어, 1204년 제4차 십자군은 같은 기독교 도시인 콘스탄티노폴리스를 약탈했다.", "1291년 마지막 거점인 아크레가 함락되었다."], "res": ["성지는 지키지 못했고, 전쟁을 이끈 교황과 영주·기사의 힘이 약해진 대신 왕권이 강해졌다.", "동서 교역이 활발해져 이탈리아 도시가 성장하고, 이슬람 세계의 학문과 문물이 유럽에 전해졌다."], "when": "1096–1291 · 서유럽과 서아시아", "sum": "유럽의 기독교 세계가 성지 예루살렘을 되찾겠다며 이슬람 세력과 약 200년간 벌인 전쟁이다.", "mem": "전쟁은 졌지만 무역과 도시가 살아나 르네상스의 문을 열었다.", "see": "중세 서유럽, 비잔티움 제국, 이슬람 세계", "id": "event-34"}, {"title": "비잔티움 제국", "era": "세계사 · 서양 중세", "bg": ["395년 로마 제국이 동서로 나뉘었고, 동쪽 절반은 서로마가 무너진 뒤에도 이어졌다.", "당시 사람들은 스스로를 로마 제국이라 불렀다. 비잔티움 제국은 후대 사람들이 붙인 이름이다."], "dev": ["330년 콘스탄티누스 황제가 유럽과 아시아가 만나는 보스포루스 해협 옆에 새 수도를 세우고 콘스탄티노폴리스라 이름 붙였다. 3겹 성벽 덕분에 오랫동안 함락되지 않았다.", "6세기 유스티니아누스 황제가 지중해 영토 일부를 되찾고 로마법을 정리했으며(로마법 대전), 537년 하기아 소피아 대성당을 완성했다.", "황제가 교회의 우두머리까지 겸했다. 1054년 서유럽의 로마 가톨릭과 동유럽의 그리스 정교회가 완전히 갈라졌다.", "1071년 셀주크 튀르크에 패해 아나톨리아를 많이 잃고, 1204년 제4차 십자군에게 수도를 약탈당했다.", "1453년 오스만 제국의 메흐메트 2세가 콘스탄티노폴리스를 점령하며 제국이 끝났다."], "res": ["고대 로마에서 이어진 제국이 1천 년 넘게 버티다 사라졌다.", "피난한 학자들이 고대 문헌을 이탈리아로 가져가 르네상스에 영향을 줬다.", "러시아가 그리스 정교를 이어받아 자신을 '제3의 로마'라 여기게 되었다."], "when": "330–1453 · 콘스탄티노폴리스", "sum": "로마의 동쪽 절반이 콘스탄티노폴리스를 중심으로 1천 년 넘게 이어지다 오스만 제국에 무너진 나라다.", "mem": "330 새 수도, 537 하기아 소피아, 1054 교회 분열, 1204 십자군 약탈, 1453 함락이다. 도시 이름은 비잔티움 → 콘스탄티노폴리스 → 이스탄불로 바뀌었다.", "see": "로마 제국, 십자군 전쟁, 오스만 제국", "id": "event-35"}, {"title": "르네상스", "era": "세계사 · 서양 근세", "bg": ["십자군 전쟁 뒤 피렌체, 베네치아 같은 이탈리아 도시가 상업으로 부유해졌고, 메디치 가문 같은 후원자가 학자와 예술가를 도왔다.", "흑사병으로 교회의 권위가 흔들리고, 비잔티움 제국의 학자들이 고대 문헌을 이탈리아로 가져왔다."], "dev": ["'인간'을 중심에 두고 생각하는 인문주의가 퍼졌다.", "미술에서는 레오나르도 다 빈치, 미켈란젤로, 라파엘로가 활약했다.", "1450년경 구텐베르크가 활판 인쇄술을 발전시켜 책과 생각이 빠르게 퍼졌다.", "이탈리아에서 시작해 알프스 북쪽 유럽으로 퍼졌다."], "res": ["신 중심의 세계관에서 인간과 자연을 탐구하는 태도로 바뀌며 종교개혁과 과학혁명의 바탕이 되었다."], "when": "14–16세기 · 이탈리아에서 유럽으로", "sum": "고대 그리스·로마의 학문과 예술을 다시 배우며 인간과 현실을 새롭게 바라본 문화 운동이다.", "mem": "르네상스는 '다시 태어남'이라는 뜻이다.", "see": "중세 서유럽, 종교개혁", "id": "event-36"}, {"title": "종교개혁", "era": "세계사 · 서양 근세", "bg": ["중세 말 교회가 부유해지고 세속적으로 변했다는 비판이 컸다.", "교회가 성당 건축 자금을 모으려고 죄를 용서해 준다는 증서(면벌부)를 팔았다.", "인쇄술이 퍼져 비판의 글이 빠르게 전해졌다."], "dev": ["1517년 루터가 독일 비텐베르크에서 면벌부를 비판하는 95개조 반박문을 냈다.", "1521년 교회에서 쫓겨났지만 성서를 독일어로 옮겨 일반 사람도 읽게 했다.", "칼뱅이 스위스 제네바에서 개혁을 이끌고, 영국은 헨리 8세 때(1534) 영국 국교회를 세웠다.", "1555년 아우크스부르크 화의로 독일 제후가 루터파를 선택할 수 있게 되었다."], "res": ["가톨릭(구교)과 개신교(신교)가 갈라지고, 가톨릭도 스스로 개혁에 나섰다.", "종교 갈등이 30년 전쟁(1618–1648)으로 번졌고, 베스트팔렌 조약으로 신앙 선택과 주권을 가진 나라 사이의 질서가 자리 잡았다."], "when": "1517–1648 · 유럽", "sum": "루터가 가톨릭 교회를 비판하며 시작해 개신교가 생겨나고, 종교 전쟁 끝에 새 국제 질서가 선 사건이다.", "mem": "1517년 비텐베르크, 95개조다. 인쇄술이 루터의 글을 빠르게 퍼뜨렸다.", "see": "르네상스, 신항로 개척, 절대 왕정", "id": "event-37"}, {"title": "신항로 개척", "era": "세계사 · 서양 근세", "bg": ["오스만 제국이 지중해 동쪽 교역로를 차지하자, 유럽은 아시아의 향신료와 금·은을 직접 구할 새 바닷길을 찾았다.", "나침반과 새 배 같은 항해 기술이 발전하고 포르투갈과 에스파냐 왕실이 탐험을 후원했다."], "dev": ["1488년 포르투갈의 디아스가 아프리카 남쪽 끝 희망봉에 닿았다.", "1492년 에스파냐의 후원을 받은 콜럼버스가 아메리카에 닿았다.", "1498년 바스쿠 다 가마가 희망봉을 돌아 인도에 도착했다.", "1519–1522년 마젤란 일행이 처음으로 지구를 한 바퀴 돌았다."], "res": ["유럽 무역의 중심이 지중해에서 대서양으로 옮겨 가고, 아메리카의 은이 쏟아져 들어와 물가가 크게 올랐다.", "아즈텍과 잉카가 무너지고 원주민 인구가 질병과 학살로 크게 줄었다.", "아프리카 사람들을 노예로 끌고 가는 대서양 노예무역이 커졌고, 감자와 옥수수 같은 작물이 세계로 퍼졌다."], "when": "15–16세기 · 대서양과 세계의 바다", "sum": "유럽의 배가 새 항로를 개척하며 세계가 바다로 이어지고, 아메리카와 아프리카에는 식민 지배가 시작된 시기다.", "mem": "1492 콜럼버스, 1498 인도 도착, 1522 세계 일주 완성이다. 유럽에는 기회, 아메리카와 아프리카에는 수탈의 시작이었다.", "see": "르네상스, 오스만 제국, 절대 왕정", "id": "event-38"}, {"title": "절대 왕정", "era": "세계사 · 서양 근세", "bg": ["봉건 귀족이 약해지고 상공업으로 돈을 번 시민 계급이 성장하던 때, 왕이 두 세력 사이에서 권력을 모았다."], "dev": ["왕의 권력은 신이 주었다는 왕권신수설을 내세우고, 왕에게 충성하는 관료와 상비군을 두었다.", "수출을 늘리고 수입을 막아 나라의 부를 쌓는 중상주의를 폈다.", "에스파냐의 펠리페 2세, 영국의 엘리자베스 1세가 강한 왕권을 휘둘렀다.", "프랑스의 루이 14세는 1661년부터 직접 다스리며 '태양왕'이라 불렸고 베르사유 궁전을 지었다.", "18세기 러시아의 표트르 대제와 프로이센의 프리드리히 2세도 나라를 강하게 개혁했다."], "res": ["중앙에서 나라 전체를 다스리는 근대 국가의 틀이 만들어졌다.", "중상주의로 성장한 시민 계급이 뒤에는 왕의 권력을 무너뜨리는 시민혁명의 주역이 되었다."], "when": "16–18세기 · 유럽", "sum": "왕이 관료와 상비군을 거느리고 큰 권력을 쥔 정치 체제다.", "mem": "왕이 세금을 걷으려고 키운 시민 계급이 나중에 왕을 무너뜨렸다.", "see": "종교개혁, 과학혁명과 계몽사상", "id": "event-39"}, {"title": "과학혁명과 계몽사상", "era": "세계사 · 서양 근대", "bg": ["르네상스의 인문주의와 인쇄술, 새 관측 도구로 옛 권위를 의심하는 분위기가 퍼졌다."], "dev": ["1543년 코페르니쿠스가 지동설을 발표하고, 17세기 초 갈릴레이가 망원경으로 하늘을 관측했다. 1633년 갈릴레이는 종교 재판에서 지동설을 철회하도록 강요받았다.", "1687년 뉴턴이 『프린키피아』에서 만유인력 법칙을 정리했다.", "영국은 1688년 명예혁명으로 왕을 바꾸고 이듬해 권리장전으로 의회가 중심이 되는 입헌군주제를 열었다. 로크는 나라가 국민의 약속으로 세워진다는 사회계약설로 이를 뒷받침했다.", "18세기 몽테스키외가 삼권 분립을, 루소가 국민 주권을 주장하는 등 계몽사상이 퍼졌다."], "res": ["이성과 실험으로 세상을 이해한다는 생각이 자리 잡아 미국 독립혁명과 프랑스 혁명의 바탕이 되었다."], "when": "1543–18세기 · 유럽", "sum": "관찰과 실험으로 자연을 새롭게 설명한 과학혁명과, 이성으로 사회를 바꾸자는 계몽사상이 퍼진 변화다.", "mem": "1543 지동설에서 1687 중력 법칙까지 약 150년이다. 로크·몽테스키외·루소가 시민혁명의 생각을 만들었다.", "see": "절대 왕정, 미국 독립혁명, 프랑스 혁명과 나폴레옹", "id": "event-40"}, {"title": "미국 독립혁명", "era": "세계사 · 서양 근대", "bg": ["영국이 전쟁으로 쓴 비용을 식민지에 세금으로 물리자 '대표 없이 세금 없다'는 반발이 일어났다.", "1773년 보스턴 차 사건 등으로 갈등이 깊어졌다."], "dev": ["1775년 렉싱턴에서 무력 충돌이 시작되었다.", "1776년 7월 4일 독립 선언서를 발표했다. 모든 사람이 평등하게 태어났다는 생각을 담았다.", "1777년 새러토가 승리 뒤 프랑스가 미국을 돕고 1781년 요크타운에서 승리했다.", "1783년 파리 조약으로 영국이 독립을 인정했다."], "res": ["1787년 권력을 나누고 연방제를 채택한 헌법이 만들어지고, 1789년 워싱턴이 초대 대통령이 되었다.", "프랑스 혁명과 라틴아메리카 독립에 영향을 줬다.", "노예제가 유지되고 원주민이 배제된 한계도 있었다."], "when": "1775–1783 · 북아메리카", "sum": "영국의 식민지였던 13개 지역이 영국과 싸워 독립하고 대통령제 공화국을 세운 사건이다.", "mem": "1776년 7월 4일 독립 선언이다.", "see": "과학혁명과 계몽사상, 프랑스 혁명과 나폴레옹", "id": "event-41"}, {"title": "프랑스 혁명과 나폴레옹", "era": "세계사 · 서양 근대", "bg": ["프랑스 왕실은 재정이 어려웠고, 대다수 평민(제3신분)은 세금을 내면서도 정치에서 배제됐다.", "계몽사상이 퍼지고 흉년으로 먹을 것이 부족했다."], "dev": ["1789년 7월 14일 파리 시민이 바스티유 감옥을 습격했다. 8월 '자유와 평등'을 담은 인권 선언이 나왔다.", "1792년 왕정이 폐지되고 1793년 루이 16세가 처형되었다. 이어 로베스피에르의 공포정치가 이어졌다.", "1799년 나폴레옹이 권력을 잡고 1804년 황제가 되어 나폴레옹 법전을 만들었다.", "1812년 러시아 원정에 실패하고 1815년 워털루 전투에서 패해 물러났다."], "res": ["유럽 왕들이 빈 회의에서 옛 질서를 되돌리려 했으나 자유, 평등, 민족주의 사상은 퍼져 나갔다."], "when": "1789–1815 · 프랑스와 유럽", "sum": "시민이 왕과 귀족 중심의 신분제를 무너뜨리고, 이후 나폴레옹이 유럽에 혁명의 생각을 퍼뜨린 사건이다.", "mem": "1789년 7월 14일 바스티유 습격이다. 영국(1688) → 미국(1776) → 프랑스(1789) 순서로 시민혁명이 이어졌다.", "see": "미국 독립혁명, 국민 국가의 형성", "id": "event-42"}, {"title": "국민 국가의 형성", "era": "세계사 · 서양 근대", "bg": ["나폴레옹이 물러난 뒤 1815년 빈 회의에서 유럽 왕들이 혁명 전의 질서로 되돌리려 했다(빈 체제).", "그러나 혁명으로 퍼진 자유주의와 '한 민족은 한 나라를 이뤄야 한다'는 민족주의가 이미 퍼져 있었다."], "dev": ["프랑스에서 1830년 7월 혁명, 1848년 2월 혁명이 일어나 빈 체제가 무너졌다.", "이탈리아는 카보우르와 가리발디의 활약으로 1861년 왕국을 세우고 1870년 로마까지 합쳤다.", "독일은 프로이센의 비스마르크가 '철과 피'로 전쟁을 이끌어 1871년 통일했다.", "미국은 노예제를 둘러싼 남북전쟁(1861–1865)을 치렀고, 링컨이 1863년 노예 해방을 선언했다."], "res": ["오늘날 유럽과 미국의 나라 지도가 대부분 만들어졌다.", "강해진 국민 국가들이 서로 경쟁하며 제국주의로 나아갔다."], "when": "1815–1871 · 유럽과 미국", "sum": "빈 체제에 맞선 자유주의와 민족주의가 퍼져 이탈리아와 독일이 통일되고, 미국이 남북전쟁을 거쳐 하나로 묶인 과정이다.", "mem": "19세기 유럽을 움직인 두 힘은 자유주의와 민족주의다. 1861 이탈리아, 1871 독일이다.", "see": "프랑스 혁명과 나폴레옹, 산업 혁명과 제국주의", "id": "event-43"}, {"title": "산업 혁명과 제국주의", "era": "세계사 · 서양 근대", "bg": ["영국은 식민지와 무역으로 자본이 쌓였고 석탄과 철이 풍부했다.", "인클로저로 농촌에서 밀려난 사람들이 도시로 모여 일할 사람이 많았다."], "dev": ["1760년대부터 방적기와 방직기가 발명되고, 1769년 와트가 증기기관을 개량해 공장에서 대량 생산이 가능해졌다.", "1825년 증기기관차가 달리는 철도가 놓이기 시작하고, 19세기에 산업혁명이 유럽과 미국, 일본으로 퍼졌다.", "긴 노동시간과 아동 노동 같은 문제가 커지자 마르크스 등이 노동자가 주인이 되는 사회주의를 주장했다(1848 『공산당 선언』).", "원료와 시장을 찾아 열강이 아시아와 아프리카를 차지했다. 1884–1885년 베를린 회의에서 아프리카를 나누는 규칙을 정했고, 1914년 무렵 아프리카 대부분이 식민지가 되었다."], "res": ["도시와 노동자 계급이 생기고 자본주의가 세계로 퍼졌다.", "민족을 무시하고 그은 국경이 훗날 분쟁의 씨앗이 되었고, 식민지 경쟁이 제1차 세계대전의 배경이 되었다."], "when": "1760–1914 · 영국에서 세계로", "sum": "기계와 공장으로 물건을 대량으로 만들게 된 산업혁명이, 원료와 시장을 찾아 다른 지역을 식민지로 삼는 제국주의로 이어진 흐름이다.", "mem": "물건이 넘친다 → 팔 곳과 원료가 필요하다 → 식민지 쟁탈 → 제1차 세계대전으로 이어진다.", "see": "국민 국가의 형성, 제1차 세계대전, 영국 지배와 독립", "id": "event-44"}, {"title": "제1차 세계대전", "era": "세계사 · 현대 세계", "bg": ["제국주의 경쟁 속에 유럽이 독일·오스트리아·이탈리아의 삼국 동맹과 영국·프랑스·러시아의 삼국 협상으로 갈라졌다.", "발칸반도는 민족 갈등이 심해 '유럽의 화약고'라 불렸다."], "dev": ["1914년 6월 사라예보에서 오스트리아 황태자 부부가 암살되자 오스트리아가 세르비아를 공격하고 동맹국들이 줄줄이 참전했다.", "참호를 파고 맞서는 긴 전투가 이어지고 독가스, 전차, 비행기 같은 새 무기가 쓰였다. 나라의 모든 힘을 쏟는 총력전이었다.", "1917년 독일의 무제한 잠수함 작전으로 미국이 참전했다.", "같은 해 러시아에서 혁명이 일어나 러시아가 전쟁에서 빠졌다.", "1918년 11월 독일이 항복했다."], "res": ["1919년 베르사유 조약으로 독일은 막대한 배상금과 영토 축소를 떠안았다.", "1920년 국제연맹이 만들어졌지만 미국이 참여하지 않아 힘이 약했다.", "독일, 러시아, 오스트리아-헝가리, 오스만 제국이 무너지고, 민족자결주의가 퍼졌다."], "when": "1914–1918 · 유럽에서 세계로", "sum": "유럽 강대국이 동맹을 맺고 맞붙어 전 세계로 번진 첫 세계 전쟁이다.", "mem": "1914 사라예보, 1917 미국 참전, 1919 베르사유 조약이다. 가혹한 베르사유 조약이 제2차 세계대전의 씨앗이 되었다.", "see": "산업 혁명과 제국주의, 러시아 혁명, 제2차 세계대전, 튀르키예 공화국", "id": "event-45"}, {"title": "러시아 혁명", "era": "세계사 · 현대 세계", "bg": ["제1차 세계대전이 길어지며 식량이 부족해지고 황제 니콜라이 2세에 대한 불만이 커졌다."], "dev": ["1917년 3월(러시아 달력 2월) 시민의 봉기로 황제가 물러나고 임시정부가 들어섰다.", "1917년 11월(러시아 달력 10월) 레닌이 이끄는 볼셰비키가 권력을 잡고 전쟁에서 빠졌다.", "내전을 거쳐 1922년 소비에트 사회주의 공화국 연방(소련)이 세워졌다."], "res": ["토지와 공장을 나라가 관리하는 사회주의 체제가 처음 등장했다.", "레닌이 죽은 뒤 스탈린이 독재 체제를 굳혔다.", "자본주의 국가들과 대립하며 이후 냉전으로 이어졌다."], "when": "1917 · 러시아", "sum": "황제의 전제 정치가 무너지고 세계 최초의 사회주의 국가가 세워진 사건이다.", "mem": "1917년, 레닌과 볼셰비키다.", "see": "제1차 세계대전, 냉전", "id": "event-46"}, {"title": "제2차 세계대전", "era": "세계사 · 현대 세계", "bg": ["1929년 10월 뉴욕 주식시장이 폭락하며 대공황이 세계로 번졌다. 미국은 뉴딜 정책으로, 영국과 프랑스는 식민지와 묶은 경제로 버텼다.", "식민지가 적은 독일(히틀러, 1933 집권), 이탈리아(무솔리니), 일본에서 개인보다 나라를 앞세우는 전체주의가 힘을 얻었다."], "dev": ["1939년 9월 1일 독일이 폴란드를 침공하며 전쟁이 시작되었다.", "1941년 6월 독일이 소련을 침공하고, 12월 일본이 진주만을 공격해 미국이 참전했다.", "1944년 6월 연합군이 노르망디에 상륙하고 1945년 5월 독일이 항복했다.", "1945년 8월 미국이 히로시마와 나가사키에 원자폭탄을 떨어뜨리고 일본이 항복했다.", "전쟁 중 나치 독일이 유대인 약 600만 명을 조직적으로 학살했다(홀로코스트)."], "res": ["5천만 명이 넘는 사람이 목숨을 잃은 것으로 추정된다.", "1945년 국제연합(UN)이 만들어지고, 유럽 중심의 시대가 끝나며 미국과 소련이 맞서는 시대가 열렸다.", "아시아와 아프리카의 식민지가 독립하는 흐름이 빨라졌다. 한국은 광복을 맞았다."], "when": "1939–1945 · 유럽, 아시아, 태평양", "sum": "대공황 뒤 힘을 얻은 전체주의 국가들이 일으켜 세계 곳곳이 전쟁터가 된, 인류 역사상 가장 큰 전쟁이다.", "mem": "1929 대공황, 1939 폴란드 침공, 1941 진주만, 1945 종전이다.", "see": "제1차 세계대전, 냉전, 광복과 분단", "id": "event-47"}, {"title": "냉전", "era": "세계사 · 현대 세계", "bg": ["제2차 세계대전 뒤 미국 중심의 자본주의 진영과 소련 중심의 공산주의 진영이 맞섰다."], "dev": ["1947년 미국이 트루먼 독트린과 마셜 계획으로 공산주의 확산을 막으려 했다.", "1949년 서방의 NATO, 1955년 소련 쪽의 바르샤바 조약 기구가 만들어졌다.", "6·25 전쟁(1950–1953), 베트남 전쟁(1955–1975) 같은 대리전이 벌어지고, 1962년 쿠바 미사일 위기로 핵전쟁 직전까지 갔다.", "1961년 베를린 장벽이 세워지고, 1969년 아폴로 11호가 달에 착륙하는 등 우주 경쟁도 벌어졌다. 1970년대에는 긴장이 누그러졌다(데탕트).", "1985년 고르바초프가 개혁(페레스트로이카)과 개방(글라스노스트)을 추진했다."], "res": ["1989년 동유럽이 민주화되고 11월 베를린 장벽이 무너졌다. 1990년 독일이 통일되었다.", "1991년 12월 소련이 해체되며 냉전이 끝나고 미국이 유일한 초강대국으로 남았다.", "한국은 1990년 소련, 1992년 중국과 수교했다."], "when": "1947–1991 · 세계", "sum": "미국과 소련이 직접 싸우지는 않았지만 세계를 두 진영으로 나누어 맞서다, 소련이 무너지며 끝난 대립이다.", "mem": "미국과 소련은 직접 부딪치지 않았지만, 한국과 베트남에서는 실제 전쟁이 벌어졌다. 1989 장벽 붕괴, 1991 소련 해체다.", "see": "러시아 혁명, 제2차 세계대전, 6·25 전쟁, 냉전 이후의 세계", "id": "event-48"}, {"title": "냉전 이후의 세계", "era": "세계사 · 현대 세계", "bg": ["1991년 소련이 해체되며 미국이 유일한 초강대국으로 남았다.", "인터넷과 휴대전화가 퍼지며 세계가 빠르게 하나로 이어졌다(세계화)."], "dev": ["1993년 유럽연합(EU)이 출범하고, 1995년 세계무역기구(WTO)가 만들어졌다.", "2001년 9월 11일 테러 조직 알카에다가 납치한 여객기로 뉴욕 세계무역센터와 워싱턴 국방부 청사를 공격해 약 3천 명이 숨졌다. 미국은 아프가니스탄(2001)과 이라크(2003)에서 전쟁을 벌였다.", "2008년 미국에서 시작된 금융위기가 세계로 번졌다.", "2020년 코로나19가 세계적으로 유행했다."], "res": ["나라 사이의 경제가 더 깊이 얽히는 한편, 테러와 전염병, 기후 변화처럼 한 나라가 풀기 어려운 문제가 커졌다."], "when": "1991– · 세계", "sum": "냉전이 끝난 뒤 세계가 하나로 이어지면서 새로운 갈등과 과제가 나타난 시기다.", "mem": "1993 EU, 2001 9·11, 2008 금융위기, 2020 코로나19다.", "see": "냉전, 중동 분쟁", "id": "event-49"}, {"title": "고대 오리엔트", "era": "세계사 · 서아시아", "bg": ["티그리스·유프라테스강 유역 메소포타미아에서 기원전 3500년경 도시가 생기고 쐐기 문자가 만들어졌다.", "나일강 유역에서 기원전 3100년경 이집트가 통일되고 피라미드가 세워졌다."], "dev": ["기원전 1750년경 바빌로니아의 함무라비 왕이 법전을 만들었다.", "기원전 7세기 아시리아가 오리엔트를 처음 통일했지만 가혹하게 다스려 오래가지 못했다.", "기원전 550년 키루스 2세가 아케메네스 왕조 페르시아를 세웠다. 정복한 사람들의 종교와 풍습을 존중하는 관용 정책을 폈다.", "다리우스 1세가 전국에 총독을 보내고 '왕의 길'을 닦아 큰 제국을 다스렸다. 기원전 330년 알렉산드로스에게 무너졌다.", "224년 일어난 사산 왕조 페르시아가 동서 무역으로 번영하고 조로아스터교를 국교로 삼았다. 651년 이슬람 세력에 무너졌다."], "res": ["문자, 법, 행정의 기본 틀이 만들어져 이후 그리스와 로마 등에 영향을 줬다.", "선과 악이 싸우고 최후의 심판이 온다는 조로아스터교의 생각은 유대교, 기독교, 이슬람에 영향을 준 것으로 보는 견해가 많다."], "when": "기원전 3500경–651 · 서아시아와 이집트", "sum": "큰 강 유역에서 최초의 문명이 생겨나고, 그 땅 위에 관용으로 다스린 페르시아 제국이 선 흐름이다.", "mem": "아시리아는 공포로 다스려 짧게 끝났고, 페르시아는 관용으로 다스려 크게 번영했다.", "see": "고대 그리스, 알렉산드로스 제국, 이슬람 세계", "id": "event-50"}, {"title": "이슬람 세계", "era": "세계사 · 서아시아", "bg": ["7세기 아라비아 반도의 메카는 상업과 순례의 중심이었지만 빈부 격차가 컸다.", "610년경 상인 출신 무함마드가 신의 계시를 받았다고 전하며, 유일신 알라 앞에서 모두가 평등하다고 가르쳤다."], "dev": ["622년 박해를 피해 메디나로 옮겼다(헤지라). 이 해가 이슬람 달력의 원년이다. 630년 메카를 차지했다.", "무함마드가 죽은 뒤 후계자인 칼리프들이 시리아, 이집트, 페르시아를 정복했다. 후계자 문제로 수니파와 시아파가 갈라졌다.", "661년 우마이야 왕조가 다마스쿠스를 수도로 삼고 711년 에스파냐까지 진출했다. 아랍인을 우대해 불만을 샀다.", "750년 아바스 왕조가 바그다드를 수도로 삼고 민족을 가리지 않고 사람을 썼다. 751년 탈라스 전투에서 당나라에 이겼다.", "인두세(지즈야)를 내면 다른 종교를 믿을 수 있게 해 정복한 땅을 안정시켰다."], "res": ["이슬람 세계가 동서 무역과 학문의 중심이 되어 그리스 고전을 번역하고 수학, 의학, 천문학을 발전시켰다. 이 학문이 뒤에 유럽에 전해졌다.", "탈라스 전투 때 잡힌 당나라 포로를 통해 제지술이 이슬람 세계로 전해졌다는 이야기가 전한다.", "1258년 몽골이 바그다드를 함락하며 아바스 왕조가 끝났다."], "when": "610–1258 · 아라비아에서 에스파냐까지", "sum": "무함마드가 이슬람을 시작한 뒤 100여 년 만에 서아시아에서 에스파냐까지 퍼지고, 아바스 왕조 때 학문과 무역의 중심이 된 흐름이다.", "mem": "622년이 이슬람 달력의 첫해다. 우마이야는 아랍인 중심, 아바스는 모두에게 열린 제국이다.", "see": "고대 오리엔트, 십자군 전쟁, 오스만 제국", "id": "event-51"}, {"title": "오스만 제국", "era": "세계사 · 서아시아", "bg": ["11세기 셀주크 튀르크가 아나톨리아(지금의 튀르키예 땅)에 들어와 자리 잡았다.", "13세기 몽골의 침입으로 셀주크가 약해진 틈에 오스만이 1299년경 작은 나라를 세웠다."], "dev": ["14세기 발칸반도로 진출해 유럽에 발판을 마련했다.", "1453년 메흐메트 2세가 콘스탄티노폴리스를 점령해 수도로 삼았다. 하기아 소피아는 모스크가 되었다.", "1517년 셀림 1세가 이집트를 정복하고 이슬람 성지 메카와 메디나를 차지했다.", "1520년 즉위한 쉴레이만 1세 때 전성기를 맞아 유럽, 아시아, 아프리카에 걸친 제국이 되었다. 1529년 빈을 포위했지만 실패했다.", "크리스트교 소년을 뽑아 키운 술탄 직속 군대 예니체리가 군사력의 바탕이 되고, 여러 종교 공동체(밀레트)가 저마다 자치를 누렸다."], "res": ["이스탄불이 이슬람 세계의 중심 도시로 성장했다.", "오스만이 지중해 동쪽을 차지하자 유럽이 새 바닷길을 찾아 나섰다.", "1683년 두 번째 빈 포위에 실패한 뒤 영토를 잃기 시작했다."], "when": "1299–1683 · 아나톨리아에서 세 대륙으로", "sum": "작은 나라로 출발해 콘스탄티노폴리스를 차지하고 쉴레이만 1세 때 세 대륙에 걸친 대제국이 된 나라다.", "mem": "1299 건국, 1453 콘스탄티노폴리스, 1517 이집트, 1520 쉴레이만 즉위, 1683 빈 포위 실패다.", "see": "비잔티움 제국, 신항로 개척, 튀르키예 공화국", "id": "event-52"}, {"title": "튀르키예 공화국", "era": "세계사 · 서아시아", "bg": ["1683년 빈 포위에 실패한 뒤 오스만은 영토를 잃기 시작했다. 1830년 그리스가 독립하는 등 발칸의 민족이 차례로 떨어져 나갔다.", "1839년 서양식 개혁(탄지마트)을 시작했지만 쇠퇴를 막지 못해 '유럽의 병자'로 불렸다."], "dev": ["1914년 제1차 세계대전에 독일 편으로 참전했다가 1918년 패배하고, 연합국이 이스탄불 등을 점령했다.", "1919년 무스타파 케말이 저항을 이끌기 시작해 1922년 침입한 그리스군을 몰아냈다.", "1922년 술탄제가 폐지되며 약 620년 이어진 오스만 제국이 끝났다.", "1923년 10월 29일 앙카라를 수도로 튀르키예 공화국이 선포되고 케말이 초대 대통령이 되었다."], "res": ["1924년 칼리프 제도를 없애고 정치와 종교를 나누었으며, 문자를 아랍 문자에서 라틴 문자로 바꿨다(1928).", "1934년 여성에게 투표권을 주고, 케말은 '튀르크의 아버지'라는 뜻의 아타튀르크 성을 받았다. 1938년 이스탄불 돌마바흐체 궁전에서 세상을 떠났다."], "when": "1830–1938 · 튀르키예", "sum": "쇠퇴하던 오스만 제국이 제1차 세계대전 패배로 무너지고, 무스타파 케말이 그 자리에 세운 근대 국가다.", "mem": "1922 술탄제 폐지, 1923 공화국이다. 수도는 이스탄불이 아니라 앙카라다.", "see": "오스만 제국, 제1차 세계대전, 중동 분쟁", "id": "event-53"}, {"title": "중동 분쟁", "era": "세계사 · 서아시아", "bg": ["오스만 제국이 무너진 뒤 영국과 프랑스가 아랍 지역을 나눠 다스리며 국경을 그었다.", "영국은 전쟁 중 아랍인에게는 독립을(1915 맥마흔 선언), 유대인에게는 팔레스타인의 민족 국가를(1917 밸푸어 선언) 약속했다."], "dev": ["1948년 이스라엘이 건국되자 아랍 나라들과 전쟁이 벌어졌고, 1973년까지 네 차례 중동 전쟁이 이어졌다.", "많은 팔레스타인 사람이 살던 곳을 떠나 난민이 되었다.", "1979년 이란에서 이슬람 혁명이 일어나 왕정이 무너졌다.", "1993년 오슬로 협정으로 이스라엘과 팔레스타인 해방 기구가 서로를 인정했지만 갈등은 끝나지 않았다."], "res": ["석유를 둘러싼 강대국의 개입과 종교·민족 갈등이 얽혀 분쟁이 오늘날까지 이어진다.", "2001년 9·11 테러 뒤 미국이 아프가니스탄과 이라크에서 전쟁을 벌였다."], "when": "1915– · 중동", "sum": "제1차 세계대전 때의 엇갈린 약속과 이스라엘 건국에서 시작해 오늘날까지 이어지는 중동의 분쟁이다.", "mem": "1917 밸푸어 선언, 1948 이스라엘 건국, 1979 이란 혁명이다.", "see": "튀르키예 공화국, 냉전 이후의 세계", "id": "event-54"}, {"title": "인더스 문명과 불교", "era": "세계사 · 인도", "bg": ["기원전 2500년경 인더스강 유역의 모헨조다로와 하라파에서 하수도까지 갖춘 계획도시가 번성했다.", "기원전 1500년경 중앙아시아에서 아리아인이 들어왔다."], "dev": ["아리아인은 브라만(사제), 크샤트리아(왕족·무사), 바이샤(평민), 수드라(노예)로 나뉘는 엄격한 신분제(카스트)를 만들었다.", "제사를 맡은 브라만이 가장 높은 자리에 서는 브라만교가 자리 잡았다.", "기원전 6–5세기경 크샤트리아 출신 석가모니(고타마 싯다르타)가 신분 차별을 부정하고 깨달음과 자비를 가르치는 불교를 열었다."], "res": ["불교는 브라만의 특권에 불만을 품은 왕족과 상인의 지지를 받으며 퍼졌다.", "카스트는 오랫동안 인도 사회에 남아 영향을 주었다."], "when": "기원전 25–5세기 · 인더스강과 갠지스강", "sum": "인더스 문명 뒤 아리아인이 카스트와 브라만교를 만들고, 이에 맞서 석가모니가 불교를 연 흐름이다.", "mem": "불교는 카스트와 브라만의 특권에 맞선 가르침으로 시작했다.", "see": "인도의 통일 왕조, 고대 오리엔트", "id": "event-55"}, {"title": "인도의 통일 왕조", "era": "세계사 · 인도", "bg": ["알렉산드로스가 인도 서북부까지 들어왔다가 물러간 뒤, 여러 나라로 나뉜 인도를 하나로 묶으려는 왕조가 나타났다."], "dev": ["기원전 4세기 말 마우리아 왕조가 인도를 처음 거의 통일했다. 아소카왕은 전쟁의 참상을 뉘우치고 불교를 널리 퍼뜨렸다.", "1–3세기 쿠샨 왕조 때 그리스 조각의 영향을 받은 간다라 불상이 만들어지고, 대승 불교가 중앙아시아와 중국으로 퍼졌다.", "4–6세기 굽타 왕조 때 힌두교가 자리 잡고 산스크리트 문학과 아잔타 석굴 같은 고전 문화가 꽃피었다. 0을 쓰는 인도의 셈법은 아라비아 숫자의 바탕이 되었다.", "1526년 이슬람 왕조인 무굴 제국이 세워졌다. 아크바르 황제는 힌두교도에게 물리던 세금을 없애는 등 관용 정책을 폈다.", "샤자한 황제가 죽은 왕비를 위해 아그라에 타지마할을 지었다."], "res": ["불교, 힌두교, 이슬람이 겹겹이 쌓이며 여러 종교와 문화가 함께하는 인도가 만들어졌다.", "불교는 정작 인도에서는 힌두교에 밀려 줄어들었다."], "when": "기원전 4세기–1857 · 인도", "sum": "마우리아, 쿠샨, 굽타, 무굴 같은 왕조가 이어지며 불교, 힌두교, 이슬람 문화가 쌓인 흐름이다.", "mem": "마우리아(불교) → 쿠샨(간다라 불상) → 굽타(힌두교) → 무굴(이슬람·타지마할) 순서다.", "see": "인더스 문명과 불교, 알렉산드로스 제국, 영국 지배와 독립", "id": "event-56"}, {"title": "영국 지배와 독립", "era": "세계사 · 인도", "bg": ["17세기 말부터 무굴 제국이 약해지는 사이 영국과 프랑스가 동인도 회사를 앞세워 인도에 들어왔다."], "dev": ["1757년 플라시 전투에서 이긴 영국 동인도 회사가 벵골을 차지하며 인도 지배를 넓혔다.", "1857년 동인도 회사의 인도인 병사(세포이)들이 일으킨 항쟁이 전국으로 번졌지만 진압되었다. 이듬해 영국 정부가 인도를 직접 다스렸고, 1877년 영국 왕이 인도 황제를 겸했다.", "1885년 인도 국민회의가 만들어지고, 20세기 들어 간디가 비폭력·불복종 운동을 이끌었다. 1930년 영국의 소금 독점에 맞서 바다까지 걸은 소금 행진이 유명하다.", "1947년 8월 독립했지만 힌두교도가 많은 인도와 이슬람교도가 많은 파키스탄으로 나뉘었다."], "res": ["나뉘는 과정에서 큰 충돌과 피란이 일어났고, 1948년 간디가 암살되었다.", "카슈미르 분쟁이 이어지고, 1971년 동파키스탄이 방글라데시로 독립했다."], "when": "1757–1947 · 인도", "sum": "영국 동인도 회사에서 시작한 식민 지배를 간디의 비폭력 운동 등으로 이겨 내고 독립했지만, 인도와 파키스탄으로 나뉜 과정이다.", "mem": "1757 플라시, 1857 세포이 항쟁, 1947 독립과 분리다. 영국이 종교 갈등을 부추긴 것이 분리의 배경으로 꼽힌다.", "see": "인도의 통일 왕조, 산업 혁명과 제국주의", "id": "event-57"}, {"title": "춘추전국과 진·한", "era": "세계사 · 중국", "bg": ["기원전 1600년경 황허 유역에 상(은)나라가 세워져 갑골문을 썼고, 이어 주나라가 왕족과 공신에게 땅을 나눠 주는 봉건제로 다스렸다.", "주 왕실이 약해지자 기원전 770년경부터 여러 나라가 다투는 춘추전국 시대가 약 550년 이어졌다."], "dev": ["혼란을 끝낼 방법을 두고 공자의 유가, 법가, 도가, 묵가 같은 제자백가가 나타났다.", "법을 엄격히 세운 진나라가 기원전 221년 중국을 처음 통일했다. 진시황은 군현제를 펴고 문자, 화폐, 도량형을 통일했으며 만리장성의 기틀을 닦았다.", "가혹한 통치로 진나라는 15년 만에 무너지고, 기원전 202년 한나라가 들어섰다.", "한 무제가 유학을 나라의 학문으로 삼고, 장건을 서역에 보낸 일을 계기로 비단길이 열렸다."], "res": ["중앙에서 지방을 다스리는 통일 제국의 틀과 유학, 한자가 이후 중국과 동아시아에 이어졌다.", "중국 사람을 한족, 중국 글자를 한자라 부르는 것도 한나라에서 왔다."], "when": "기원전 770–220 · 중국", "sum": "여러 나라가 다투던 춘추전국 시대를 진나라가 처음 통일하고, 한나라가 유학과 비단길로 중국 문명의 틀을 다진 과정이다.", "mem": "분열(춘추전국) → 짧고 강한 통일(진) → 길고 안정된 통일(한)이 중국사의 기본 흐름이다. 221년 통일하고 15년 만에 무너졌다.", "see": "남북조와 수·당, 인도의 통일 왕조", "id": "event-58"}, {"title": "남북조와 수·당", "era": "세계사 · 중국", "bg": ["220년 한나라가 무너진 뒤 위·촉·오 삼국 시대를 거쳐, 북방 유목 민족이 화북으로 내려오며 약 360년간 위진남북조의 분열이 이어졌다.", "그 사이 유목민과 한족의 문화가 섞이고 불교가 널리 퍼졌다."], "dev": ["581년 세워진 수나라가 589년 중국을 다시 통일하고 과거제를 시작했다.", "수나라는 남북을 잇는 대운하를 만들고 고구려를 여러 번 공격했지만 크게 패해(612 살수대첩) 618년 무너졌다.", "618년 세워진 당나라가 율령과 과거제, 조용조 같은 제도를 갖추고 수도 장안을 국제도시로 키웠다.", "755년 안사의 난 뒤 약해지다 907년 무너졌다."], "res": ["당나라의 율령, 한자, 유학, 불교가 신라와 발해, 일본에 퍼져 동아시아 문화권이 만들어졌다."], "when": "220–907 · 중국", "sum": "오랜 분열 끝에 수나라가 중국을 다시 통일하고, 당나라가 동아시아 문화의 중심이 된 과정이다.", "mem": "진–한처럼 수(짧은 통일, 대운하와 무리한 원정)–당(긴 번영)이 짝을 이룬다.", "see": "춘추전국과 진·한, 송과 몽골 제국, 고구려", "id": "event-59"}, {"title": "송과 몽골 제국", "era": "세계사 · 중국", "bg": ["당나라가 무너진 뒤 혼란을 끝낸 송나라(960)가 무신보다 문신을 앞세워 다스렸다.", "몽골 초원의 유목 부족들은 오랫동안 서로 싸웠다."], "dev": ["송나라 때 상업이 크게 발달하고 화약, 나침반, 활판 인쇄술이 쓰였다. 주희가 성리학을 정리했다.", "북방의 거란(요)과 여진(금)에 밀려 송은 1127년 남쪽으로 내려갔다(남송).", "1206년 테무친이 칭기즈 칸으로 추대되어 몽골을 통일하고 중앙아시아와 페르시아를 정복했다. 후손들은 러시아와 동유럽까지 원정했다.", "1271년 쿠빌라이가 원나라를 세우고 1279년 남송을 무너뜨렸다."], "res": ["몽골 제국이 길과 역참을 정비해 동서 교류가 크게 늘었다. 고려도 몽골의 침입과 간섭을 받았다.", "화약, 나침반 같은 기술은 이슬람 세계를 거쳐 유럽에 전해졌고, 성리학은 원나라를 거쳐 고려에 들어왔다."], "when": "960–1368 · 중국과 유라시아", "sum": "문신이 다스린 송나라가 경제와 학문을 꽃피우고, 칭기즈 칸의 몽골이 유라시아를 하나로 묶어 원나라를 세운 시기다.", "mem": "송은 문치·성리학·3대 발명품, 몽골은 1206 칭기즈 칸, 1271 원나라다.", "see": "남북조와 수·당, 명나라와 청나라, 무신 정권과 몽골 침입", "id": "event-60"}, {"title": "명나라와 청나라", "era": "세계사 · 중국", "bg": ["원나라가 흔들리자 한족의 반란이 잇따랐다."], "dev": ["1368년 주원장이 명나라를 세우고 원을 북쪽으로 몰아냈다.", "정화가 남해 원정(1405–1433)으로 아프리카 동해안까지 가고, 1420년 베이징 자금성이 완성되었다.", "만주족이 세운 청나라가 1644년 베이징에 들어갔다.", "강희제, 옹정제, 건륭제 때 전성기를 맞아 타이완과 몽골, 티베트, 신장까지 다스리며 오늘날 중국 영토의 틀을 만들었다."], "res": ["청나라 전성기까지 중국은 세계에서 손꼽히는 경제 대국이었다.", "18세기 말부터 인구가 크게 늘고 관리가 부패하며 흔들리기 시작했다."], "when": "1368–1840 · 중국", "sum": "한족의 명나라가 원을 몰아내고, 뒤이어 만주족의 청나라가 들어서 오늘날 중국 영토의 틀을 만든 시기다.", "mem": "명(정화·자금성) → 청(강희·옹정·건륭) 순서다. 명은 임진왜란 때 조선을 돕고, 청은 병자호란으로 조선을 침략했다.", "see": "송과 몽골 제국, 아편전쟁과 신해혁명, 임진왜란과 병자호란", "id": "event-61"}, {"title": "아편전쟁과 신해혁명", "era": "세계사 · 중국", "bg": ["영국은 청에서 차를 많이 사며 은이 빠져나가자, 인도에서 만든 아편을 청에 몰래 팔았다.", "1839년 청이 광저우에서 아편을 몰수해 폐기하자 영국이 이를 구실로 삼았다."], "dev": ["1840년 영국이 청을 공격했고(아편전쟁), 1842년 난징 조약으로 청은 홍콩을 넘기고 항구 5곳을 열었다.", "태평천국 운동(1851–1864)이 일어나고, 서양 기술만 받아들이자는 양무운동이 이어졌다.", "1895년 청일전쟁에 지자 1898년 정치 제도까지 바꾸자는 변법자강 운동이 일어났지만 100여 일 만에 실패했다. 1899년 외세를 몰아내자는 의화단 운동도 진압되었다.", "1911년 쑨원의 삼민주의를 따른 혁명 세력이 봉기해 신해혁명을 일으키고, 1912년 중화민국이 세워졌다."], "res": ["2천 년 넘게 이어진 황제 지배가 끝났다.", "그러나 군벌이 다투고 열강의 침략이 이어져 혼란이 계속되었다.", "아편전쟁 뒤 일본과 조선에도 개항 압력이 커졌다."], "when": "1840–1912 · 청나라", "sum": "아편전쟁으로 서양에 문을 연 청나라가 개혁과 저항에 잇따라 실패하다 신해혁명으로 무너진 과정이다.", "mem": "양무운동(기술만) → 변법자강(제도까지) → 신해혁명(황제를 없애고 공화국으로) 순서다. 1842 난징 조약, 1911 신해혁명이다.", "see": "명나라와 청나라, 중화인민공화국, 개항과 동학농민운동", "id": "event-62"}, {"title": "중화인민공화국", "era": "세계사 · 중국", "bg": ["신해혁명 뒤에도 군벌이 다투고 일본이 침략하자, 젊은 지식인들이 옛 문화를 바꾸자는 신문화 운동을 벌였다.", "1919년 베이징 학생들이 일본과 열강에 맞서 5·4 운동을 일으켰다."], "dev": ["장제스의 국민당과 마오쩌둥의 공산당이 손잡고 일본과 싸우다(중일전쟁, 1937–1945), 전쟁 뒤 국공 내전을 벌였다.", "1949년 10월 1일 공산당이 중화인민공화국을 세우고, 국민당은 타이완으로 옮겨 갔다.", "마오쩌둥의 대약진 운동(1958)과 문화대혁명(1966–1976)으로 큰 혼란과 희생이 따랐다.", "1978년 덩샤오핑이 개혁·개방을 시작해 시장 경제를 받아들였다.", "1989년 6월 민주화를 요구한 시위가 톈안먼 광장에서 무력으로 진압되었다."], "res": ["정치는 공산당이 이끌고 경제는 시장을 여는 오늘날 중국의 체제가 만들어졌다.", "중국은 빠르게 성장해 세계 2위의 경제 대국이 되었다."], "when": "1919–1989 · 중국", "sum": "5·4 운동 뒤 국공 내전을 거쳐 공산당이 중화인민공화국을 세우고, 혼란 끝에 개혁·개방으로 성장한 과정이다.", "mem": "마오쩌둥은 이념(문화대혁명의 혼란), 덩샤오핑은 실용(개혁·개방)이다. 1949 건국, 1978 개혁·개방, 1989 톈안먼이다.", "see": "아편전쟁과 신해혁명, 냉전", "id": "event-63"}, {"title": "고대 일본과 막부", "era": "세계사 · 일본", "bg": ["한반도와 중국에서 벼농사, 철기, 불교, 한자가 전해지고 3–4세기 야마토 정권이 일어났다."], "dev": ["645년 다이카 개신으로 당나라를 본뜬 천황 중심의 율령 국가를 만들기 시작했다.", "710년 나라, 794년 헤이안(교토)으로 수도를 옮겼다. 헤이안 시대에 가나 문자가 만들어졌다.", "헤이안 후기 지방의 장원이 커지고 치안이 불안해지자, 스스로 무장한 무사(사무라이)가 성장했다.", "1185년 미나모토노 요리토모가 가마쿠라 막부를 열고 1192년 쇼군(정이대장군)이 되었다. 천황은 남고 쇼군이 실제로 다스렸다.", "가마쿠라 막부는 13세기 몽골의 두 차례 침입을 막아 냈다. 이후 무로마치 막부(1338)가 이어졌다."], "res": ["문신이 다스린 한국, 중국과 달리 무사가 주군과 가신 관계로 다스리는 일본만의 봉건 사회가 자리 잡았다.", "막부 정치는 1867년까지 약 700년 이어졌다."], "when": "3세기–1467 · 일본", "sum": "천황 중심의 율령 국가가 서고, 무사가 성장해 쇼군이 다스리는 막부 시대가 열린 과정이다.", "mem": "천황 통치(고대) → 무사·쇼군 통치(가마쿠라·무로마치·에도 막부) → 천황 복귀(메이지 유신)로 나뉜다.", "see": "전국 시대와 에도 막부, 남북조와 수·당", "id": "event-64"}, {"title": "전국 시대와 에도 막부", "era": "세계사 · 일본", "bg": ["1467년 오닌의 난 뒤 무로마치 막부가 힘을 잃고, 지방 영주(다이묘)들이 약 100년간 싸우는 전국 시대가 이어졌다."], "dev": ["오다 노부나가가 포르투갈에서 들어온 조총을 앞세워 통일의 기반을 닦았다.", "도요토미 히데요시가 1590년 전국을 통일하고 1592년 조선을 침략했다가(임진왜란) 실패했다.", "도쿠가와 이에야스가 1600년 세키가하라 전투에서 이기고 1603년 에도 막부를 열었다.", "다이묘가 1년씩 에도에 와서 머물게 하는 참근교대로 영주들을 통제하고, 서양 나라 가운데서는 나가사키 데지마의 네덜란드와만 교역했다."], "res": ["약 260년 동안 큰 전쟁 없이 평화가 이어졌다.", "네덜란드를 통해 서양 학문(난학)을 받아들이고, 상인(조닌) 문화로 가부키와 우키요에가 꽃피었다."], "when": "1467–1867 · 일본", "sum": "100년 넘는 전국 시대를 노부나가, 히데요시, 이에야스가 차례로 끝내고, 에도 막부가 260년 평화를 이끈 과정이다.", "mem": "노부나가가 떡을 찧고, 히데요시가 반죽하고, 이에야스가 앉아서 먹었다는 말이 전한다.", "see": "고대 일본과 막부, 메이지 유신과 제국주의, 임진왜란과 병자호란", "id": "event-65"}, {"title": "메이지 유신과 제국주의", "era": "세계사 · 일본", "bg": ["1853년 미국의 페리가 군함을 이끌고 와 개항을 요구했고, 막부가 1854년 미일 화친 조약에 이어 불평등 조약을 맺었다.", "막부에 대한 불만이 커지고 사쓰마와 조슈 번 같은 세력이 막부를 무너뜨리려 했다."], "dev": ["1867년 마지막 쇼군이 권력을 천황에게 돌려주고, 1868년 메이지 천황 중심의 새 정부가 들어섰다(메이지 유신).", "1871년 번을 없애고 현을 두어 중앙에서 다스리고, 1873년 징병제를 시행했다. 이와쿠라 사절단을 서양에 보내 제도를 배웠다.", "철도, 학교, 근대 공업을 들여오고 1889년 헌법을 만들었다.", "청일전쟁(1894–1895)과 러일전쟁(1904–1905)에서 이기고 1910년 대한제국을 강제로 병합했다.", "1931년 만주사변, 1937년 중일전쟁, 1941년 태평양 전쟁을 일으켰다가 1945년 패전했다."], "res": ["미군정 아래 전쟁을 하지 않겠다는 평화헌법(1947 시행)을 만들고, 6·25 전쟁 특수 등으로 경제 대국이 되었다.", "침략과 식민 지배를 어떻게 기억할지를 두고 이웃 나라와의 갈등이 이어진다."], "when": "1853–1945 · 일본", "sum": "일본이 막부를 무너뜨리고 서양 제도를 받아들여 빠르게 근대 국가가 되었지만, 그 힘으로 이웃 나라를 침략하다 패전한 과정이다.", "mem": "1853 페리, 1868 메이지 유신, 1894 청일전쟁, 1904 러일전쟁, 1910 한국 병합, 1945 패전이다.", "see": "전국 시대와 에도 막부, 국권 침탈과 저항, 제2차 세계대전", "id": "event-66"}], "timeline": [["기원전 3500경", "세계", "메소포타미아에서 도시가 생기고 쐐기 문자가 만들어졌다.", "고대 오리엔트"], ["기원전 3100경", "세계", "이집트가 통일되었다.", "고대 오리엔트"], ["기원전 2500경", "세계", "인더스강 유역에서 계획도시를 갖춘 문명이 번성했다.", "인더스 문명과 불교"], ["기원전 2333", "한국", "단군이 고조선을 세웠다는 이야기가 전한다. 건국 연대는 확정되지 않았다.", "고조선"], ["기원전 1750경", "세계", "바빌로니아에서 함무라비 법전이 만들어졌다.", "고대 오리엔트"], ["기원전 1600경", "세계", "중국에서 상(은)나라가 세워졌다.", "춘추전국과 진·한"], ["기원전 770", "세계", "주 왕실이 약해지며 춘추전국 시대가 시작되었다.", "춘추전국과 진·한"], ["기원전 550", "세계", "키루스 2세가 아케메네스 왕조 페르시아를 세웠다.", "고대 오리엔트"], ["기원전 508", "세계", "아테네에서 시민이 참여하는 민주정이 시작되었다.", "고대 그리스"], ["기원전 431", "세계", "아테네와 스파르타가 펠로폰네소스 전쟁을 시작했다.", "고대 그리스"], ["기원전 334", "세계", "알렉산드로스가 동방 원정을 시작했다.", "알렉산드로스 제국"], ["기원전 264", "세계", "로마와 카르타고의 포에니 전쟁이 시작되었다.", "로마 제국"], ["기원전 221", "세계", "진시황이 중국을 통일했다.", "춘추전국과 진·한"], ["기원전 202", "세계", "한나라가 세워졌다.", "춘추전국과 진·한"], ["기원전 108", "한국", "한나라의 침공으로 고조선이 무너졌다.", "고조선"], ["기원전 57", "한국", "신라가 세워졌다고 전한다(전통 기록).", "신라와 삼국 통일"], ["기원전 37", "한국", "고구려가 세워졌다고 전한다(전통 기록).", "고구려"], ["기원전 27", "세계", "로마가 황제가 다스리는 제국이 되었다.", "로마 제국"], ["기원전 18", "한국", "백제가 세워졌다고 전한다(전통 기록).", "백제"], ["42", "한국", "김수로가 금관가야를 세웠다는 이야기가 전한다.", "가야"], ["313", "세계", "로마가 밀라노 칙령으로 기독교를 공인했다.", "로마 제국"], ["330", "세계", "콘스탄티누스 황제가 콘스탄티노폴리스를 새 수도로 삼았다.", "비잔티움 제국"], ["371", "한국", "백제 근초고왕이 고구려 평양성을 공격했다.", "백제"], ["372", "한국", "고구려가 불교를 받아들이고 태학을 세웠다.", "고구려"], ["391", "한국 iption": "신라의 신분 제도다. 태어난 집안에 따라 올라갈 수 있는 관직이 정해졌다."}, {"category": "제도·정치", "name": "양반", "description": "고려와 조선의 지배 신분이다. 문신(문반)과 무신(무반)으로 나뉘었다."}, {"category": "제도·정치", "name": "의정부와 6조", "description": "조선의 중앙 관청이다. 의정부가 나라 일을 의논하고 6조가 일을 나눠 맡아 실행했다."}, {"category": "제도·정치", "name": "군현제", "description": "중앙에서 지방으로 관리를 보내 다스리는 제도다. 진시황이 중국에 시행했다."}, {"category": "제도·정치", "name": "봉건제", "description": "중세 서유럽에서 왕, 영주, 기사가 땅과 충성을 주고받으며 이루던 질서다."}, {"category": "제도·정치", "name": "절대왕정", "description": "왕이 강한 권력을 쥐고 다스리는 체제다. 17세기 프랑스의 루이 14세가 대표적이다."}, {"category": "제도·정치", "name": "공화정", "description": "왕 없이 시민이 뽑은 대표가 다스리는 체제다. 로마 공화정이 그 예다."}, {"category": "제도·정치", "name": "민주정", "description": "시민이 직접 정치에 참여하는 체제다. 고대 아테네가 대표적이다."}, {"category": "제도·정치", "name": "입헌군주제", "description": "왕이 있되 헌법으로 권력이 제한되는 체제다. 영국이 대표적이다."}, {"category": "제도·정치", "name": "삼권 분립", "description": "법을 만드는 일, 집행하는 일, 재판하는 일을 서로 다른 기관이 맡게 하는 원칙이다."}, {"category": "제도·정치", "name": "계엄령", "description": "전쟁이나 비상시에 군대가 행정과 재판을 맡는 조치다. 1980년 5·18의 배경이 되었다."}, {"category": "제도·정치", "name": "직선제", "description": "국민이 투표로 대통령을 직접 뽑는 제도다. 1987년 개헌으로 도입되었다."}, {"category": "제도·정치", "name": "헌법", "description": "나라의 기본 질서와 국민의 권리를 정한 가장 높은 법이다."}, {"category": "제도·정치", "name": "술탄", "description": "이슬람 나라의 군주를 부르는 말이다. 오스만 제국의 황제 칭호다."}, {"category": "제도·정치", "name": "칼리프", "description": "무함마드의 뒤를 이은 이슬람 공동체의 최고 지도자다. 오스만 술탄이 이 지위를 내세웠고, 1924년 폐지되었다."}, {"category": "경제·사회", "name": "조세·공납·역", "description": "조선 백성이 진 세 가지 부담이다. 땅에 매기는 세금, 지역 특산물, 나라 일에 나가는 노동을 말한다."}, {"category": "경제·사회", "name": "대동법", "description": "특산물 대신 쌀로 세금을 내게 한 제도다. 1608년 경기도에서 시작되었다."}, {"category": "경제·사회", "name": "균역법", "description": "군대를 면제받는 대신 내는 베를 2필에서 1필로 줄인 제도다. 1750년 영조가 시행했다."}, {"category": "경제·사회", "name": "환곡", "description": "봄에 곡식을 빌려주고 가을에 거두던 제도다. 나중에 높은 이자를 받는 수단으로 변질되었다."}, {"category": "경제·사회", "name": "삼정의 문란", "description": "땅 세금, 군역, 환곡이 모두 부정으로 얼룩진 19세기 조선의 상태다."}, {"category": "경제·사회", "name": "신분제", "description": "태어난 신분에 따라 하는 일과 권리가 정해지는 사회 질서다."}, {"category": "경제·사회", "name": "호족", "description": "신라 말에서 고려 초에 지방에서 땅과 군대를 가지고 힘을 키운 세력이다."}, {"category": "경제·사회", "name": "노비", "description": "주인에게 속해 일하던 신분이다. 고려와 조선에도 많았다."}, {"category": "경제·사회", "name": "인클로저", "description": "영국에서 지주들이 공유지에 울타리를 치고 양을 키운 일이다. 이 때문에 농민이 도시로 밀려났다."}, {"category": "경제·사회", "name": "공장제", "description": "기계를 갖춘 공장에 노동자를 모아 물건을 대량으로 만드는 방식이다. 산업혁명의 특징이다."}, {"category": "경제·사회", "name": "식민지", "description": "다른 나라에 정치와 경제를 지배당하는 지역이다."}, {"category": "경제·사회", "name": "노예무역", "description": "아프리카 사람을 노예로 사고팔아 아메리카로 보낸 무역이다. 대항해 시대 이후 커졌다."}, {"category": "경제·사회", "name": "자본주의", "description": "개인과 기업이 돈을 투자해 이익을 내는 경제 체제다."}, {"category": "경제·사회", "name": "사회주의", "description": "땅과 공장을 사회가 함께 가지고 평등한 분배를 목표로 하는 사상과 체제다."}, {"category": "경제·사회", "name": "공산주의", "description": "사회주의를 더 밀고 나가 재산을 모두 공동으로 소유하는 사회를 목표로 하는 사상이다."}, {"category": "경제·사회", "name": "산업화", "description": "농업 중심 사회가 공업 중심 사회로 바뀌는 과정이다."}, {"category": "사상·종교", "name": "성리학", "description": "공자의 가르침(유교)을 송나라에서 새로 체계화한 학문이다. 조선의 나라 이념이었다."}, {"category": "사상·종교", "name": "불교", "description": "석가모니의 가르침이다. 삼국 시대에 들어와 신라와 고려 문화의 중심이 되었다."}, {"category": "사상·종교", "name": "선종", "description": "말보다 마음을 닦는 수행을 강조하는 불교의 한 갈래다. 신라 말에 지방 호족과 가까웠다."}, {"category": "사상·종교", "name": "도교", "description": "자연에 따르는 삶을 강조한 중국의 사상과 종교다."}, {"category": "사상·종교", "name": "제자백가", "description": "춘추전국 시대에 나온 여러 학파다. 공자의 유가, 법가, 도가 등이 있다."}, {"category": "사상·종교", "name": "기독교", "description": "예수의 가르침에서 시작한 종교다. 가톨릭, 개신교, 동방 정교회로 나뉜다."}, {"category": "사상·종교", "name": "천주교", "description": "한국에서 부르는 가톨릭의 이름이다. 18세기 후반 조선에 들어와 박해를 받았다."}, {"category": "사상·종교", "name": "이슬람", "description": "7세기 무함마드가 시작한 종교다. 신자를 무슬림이라 부른다."}, {"category": "사상·종교", "name": "동학", "description": "1860년 최제우가 만든 종교이자 사상이다. 핵심 가르침은 \"사람이 곧 하늘\"이다."}, {"category": "사상·종교", "name": "실학", "description": "조선 후기에 현실의 문제를 고치려 한 학문이다. 정약용, 박지원이 대표적이다."}, {"category": "사상·종교", "name": "서원과 향약", "description": "서원은 선비가 공부하고 제사 지내던 사설 교육 기관, 향약은 마을 사람들이 함께 지키던 규약이다."}, {"category": "사상·종교", "name": "인문주의", "description": "신보다 인간과 그 가능성을 중심에 두는 생각이다. 르네상스의 바탕이다."}, {"category": "사상·종교", "name": "계몽주의", "description": "18세기 유럽에서 이성으로 낡은 권위와 제도를 고치자고 한 사상이다."}, {"category": "사상·종교", "name": "민족주의", "description": "같은 민족이 하나의 나라를 이루어야 한다는 생각이다. 19세기 유럽의 통일 운동을 이끌었다."}, {"category": "사상·종교", "name": "위정척사와 개화", "description": "위정척사는 성리학을 지키고 서양을 배척한다는 생각, 개화는 서양 문물을 받아들이자는 생각이다."}, {"category": "사상·종교", "name": "면벌부", "description": "돈을 내면 죄를 용서해 준다며 가톨릭 교회가 판 증서다. 종교개혁의 불씨가 되었다."}, {"category": "사상·종교", "name": "그리스 정교", "description": "비잔티움 제국에서 발전한 기독교의 한 갈래다. 1054년 로마 가톨릭과 갈라졌다."}, {"category": "전쟁·외교", "name": "조공과 책봉", "description": "중국 중심 동아시아의 외교 질서다. 주변 나라가 예물을 바치고 중국이 그 나라 왕의 지위를 인정했다."}, {"category": "전쟁·외교", "name": "사대교린", "description": "조선 외교의 원칙이다. 큰 나라(명)를 섬기고 이웃 나라(일본, 여진)와는 사이좋게 지냈다."}, {"category": "전쟁·외교", "name": "동맹", "description": "서로 돕기로 약속한 나라 사이의 약속이다. 나당 동맹, 삼국 동맹이 그 예다."}, {"category": "전쟁·외교", "name": "불평등 조약", "description": "한 나라에만 유리한 조건을 강요한 조약이다. 강화도 조약, 난징 조약이 그 예다."}, {"category": "전쟁·외교", "name": "치외법권", "description": "외국인이 머무는 나라의 법이 아니라 자기 나라 법으로 재판받는 권리다."}, {"category": "전쟁·외교", "name": "을사늑약", "description": "1905년 일본이 강제로 맺게 해 대한제국의 외교권을 빼앗은 조약이다."}, {"category": "전쟁·외교", "name": "의병", "description": "나라가 위급할 때 백성이 스스로 모여 조직한 군대다. 임진왜란 때와 국권 피탈 전후에 크게 일어났다."}, {"category": "전쟁·외교", "name": "식민 통치", "description": "한 나라가 다른 나라를 지배하며 정치와 경제를 장악하는 일이다. 1910–1945년 일제 강점기가 그 예다."}, {"category": "전쟁·외교", "name": "제국주의", "description": "힘센 나라가 다른 나라나 지역을 차지해 영향권으로 삼는 정책이다."}, {"category": "전쟁·외교", "name": "민족자결주의", "description": "한 민족의 운명은 그 민족이 스스로 정해야 한다는 주장이다. 3·1 운동에 영향을 주었다."}, {"category": "전쟁·외교", "name": "대리전", "description": "강대국이 직접 맞서지 않고 다른 나라 땅에서 대신 싸우게 하는 전쟁이다. 6·25 전쟁, 베트남 전쟁이 그 예다."}, {"category": "전쟁·외교", "name": "휴전과 종전", "description": "휴전은 전투를 잠시 멈       { id: 'w47', era: '세계사 · 중국', q: '1842년 ____ 조약으로 청은 홍콩을 영국에 넘기고 항구 5곳을 열었다.', a: '난징' },
      { id: 'w48', era: '세계사 · 중국', q: '1911년 쑨원의 삼민주의를 따른 혁명 세력이 ____을 일으켰다.', a: '신해혁명' },

      { id: 'w51', era: '세계사 · 일본', q: '1185년 미나모토노 요리토모가 ____ 막부를 열었다.', a: '가마쿠라' },
      { id: 'w52', era: '세계사 · 일본', q: '1603년 ____가 에도 막부를 열었다.', a: '도쿠가와 이에야스' },
      { id: 'w53', era: '세계사 · 일본', q: '에도 막부는 다이묘가 1년씩 에도에 와서 머물게 하는 ____로 영주들을 통제했다.', a: '참근교대' },
      { id: 'w54', era: '세계사 · 일본', q: '1868년 메이지 천황 중심의 새 정부가 들어선 개혁을 ____이라 한다.', a: '메이지 유신' }
    ];
    function $(id) { return document.getElementById(id); }

    function qsa(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }

    var bottomTabs = qsa('.bottom-tab');

    var toast = $('toast');
    var toastTimer;

    var eventByTitle = {}, eventById = {};
    D.events.forEach(function (e) { eventByTitle[e.title] = e; eventById[e.id] = e; });
    var eraByName = {};
    D.eras.forEach(function (e) {
      eraByName[e.name] = e;

      if (!eraByName[short]) eraByName[short] = e;
    });
    var termByName = {};
    D.terms.forEach(function (t) { termByName[t.name] = t; });
    var termCategories = [];
    D.terms.forEach(function (t) { if (termCategories.indexOf(t.category) === -1) termCategories.push(t.category); });
    /* 마지막으로 고른 탭을 기억한다. 저장이 안 되면 첫 탭 */
    var TAB_KEY = 'history-tabs-v1';
    var savedTabs = {};
    try { savedTabs = JSON.parse(window.localStorage.getItem(TAB_KEY)) || {}; } catch (err) { savedTabs = {}; }
    function saveTab(key, value) {
      savedTabs[key] = value;
      try { window.localStorage.setItem(TAB_KEY, JSON.stringify(savedTabs)); } catch (err) {}
    }
    function pick(list, saved) { return list.indexOf(saved) !== -1 ? saved : list[0]; }
    var eraRegions = [];
    D.eras.forEach(function (e) { if (eraRegions.indexOf(e.region) === -1) eraRegions.push(e.region); });
    var activeTermCategory = pick(termCategories, savedTabs.term);
    var activeRegion = pick(eraRegions, savedTabs.region);
    /* 내용이 적은 시대는 탭 하나에 카드 여럿으로 묶는다(예: { '한국사 · 조선 전기': '조선' }). 지금은 묶은 시대가 없다 */
    var ERA_TAB = {};
    function tabKey(name) { return eraByName[name].region + ' · ' + (ERA_TAB[name] || name.split(' · ')[1]); }
    function tabsOf(r) {
      var a = [];
      D.eras.forEach(function (e) { if (e.region === r && a.indexOf(tabKey(e.name)) === -1) a.push(tabKey(e.name)); });
      return a;
    }
    function savedEra(r) {

    function resolveRef(name) {
      if (eventByTitle[name]) return { kind: 'event', value: name };

    function createLink(label, kind, value) {

    function appendRefGroup(parent, label, names) {

      words.split(', ').forEach(function (w) {

    /* ---------- study: render ---------- */
    function foldCard(title, badge, desc) {
      var card = el('section', 'fold-card');
      var head = el('div', 'fold-head');
      var t = el('div', 'fold-title');
      t.appendChild(el('h3', '', title));
      if (badge) t.appendChild(el('span', 'card-badge', badge));
      head.appendChild(t);
      if (desc) head.appendChild(el('p', '', desc));
      card.appendChild(head);
      return card;
    }
    function foldRow(cls, name, meta, year) {
      var d = el('details', cls);

      var nm = el('span', 'row-name');
      nm.appendChild(el('strong', '', name));
      if (meta) nm.appendChild(el('span', 'row-meta', meta));
      sm.appendChild(nm);
      if (year) sm.appendChild(el('span', 'row-year', year));
      d.appendChild(sm);
      return d;
    }

    /* ---------- 빈칸 문제 ----------
       빈칸이나 문장을 누르면 답이 보이고, 다시 누르면 빈칸으로 돌아간다 */
    function quizItem(q) {
      var item = el('div', 'quiz-item');
      var parts = q.q.split('____');
      var p = el('p', 'quiz-q');
      var blank = el('button', 'quiz-blank');
      blank.type = 'button';
      blank.setAttribute('aria-label', '답 보기');
      blank.setAttribute('aria-pressed', 'false');
      p.appendChild(document.createTextNode(parts[0]));
      p.appendChild(blank);
      p.appendChild(document.createTextNode(parts[1]));
      p.addEventListener('click', function () {
        var shown = blank.getAttribute('aria-pressed') !== 'true';
        blank.setAttribute('aria-pressed', shown ? 'true' : 'false');
        blank.textContent = shown ? q.a : '';
      });
      item.appendChild(p);
      return item;
    }
    function quizBody(list) {
      var body = el('div', 'fold-body');
      list.forEach(function (q) { body.appendChild(quizItem(q)); });
      return body;
    }

    function renderEras() {
      var holder = $('era-overviews');
      var picker = $('era-picker');
      D.eras.forEach(function (era, i) {
        var short = era.name.split(' · ')[1];
        var group = foldCard(short, era.years, era.summary);
        group.id = 'era-' + (i + 1);

        group.setAttribute('data-era-card', era.name);
        group.setAttribute('data-era-events', era.name);

        group.setAttribute('data-era-tab', tabKey(era.name));
        group.hidden = tabKey(era.name) !== activeEra;

        var notes = foldRow('fold-row era-notes', '시대 특징', era.points.length + '가지');
        var nb = el('div', 'fold-body study-card-body');

          nb.appendChild(pr);

        var words = el('div', 'related-block era-genres');
        words.appendChild(el('span', 'related-label', '함께 보기'));
        var wl = el('div', 'study-link-list');
        appendWordLinks(wl, era.words);
        words.appendChild(wl);
        nb.appendChild(words);
        notes.appendChild(nb);

        holder.appendChild(group);

        var key = tabKey(era.name);

        var t = el('button', 'term-filter', key.split(' · ')[1]);

      D.events.forEach(function (ev) {

    var timelineFilter = '전체';

    function applyTimelineFilter() {

    function renderDictionary() {
      var filters = $('dictionary-filters');
      var list = $('dictionary-list');
      termCategories.forEach(function (cat) {
        var btn = el('button', 'term-filter', cat);
        btn.type = 'button';

        var panel = el('section');

        catTerms.forEach(function (t) {

          row.setAttribute('data-category', cat);
          row.setAttribute('data-dictionary-card', t.name);
          var body = el('div', 'fold-body');
          body.appendChild(el('p', 'term-definition', t.description));

          D.events.forEach(function (ev) {
            var copy = [ev.title, ev.sum].concat(ev.bg, ev.dev, ev.res).join(' ');
            if (related.length < 3 && key.length > 1 && copy.indexOf(key) !== -1) related.push({ label: ev.title, kind: 'event', value: ev.title });
          });
          if (related.length < 3) {
            D.eras.forEach(function (e) {
              if (related.length < 3 && (e.words + ' ' + e.points.join(' ')).indexOf(key) !== -1) related.push({ label: e.name, kind: 'era', value: e.name });
            });
          }
          if (related.length) {
            var rb = el('div', 'related-block');

            rb.appendChild(rl);
            body.appendChild(rb);
          }
          row.appendChild(body);
          termList.appendChild(row);
        });
        panel.appendChild(termList);
        list.appendChild(panel);
      });

    /* ---------- study: region ---------- */
    function setRegion(r) {
      activeRegion = r;
      saveTab('region', r);
      if (!studyView.hidden && SCREENS.indexOf(currentScreen) !== -1 && REGION_OF[currentScreen] && REGION_OF[currentScreen] !== r) markScreen(SCREEN_OF[r]);
      qsa('#era-picker .term-filter').forEach(function (b) { b.hidden = b.getAttribute('data-region') !== r; });
      setEra(savedEra(r));
    }
    /* 시대 탭: 고른 탭의 시대 카드만 보인다(ERA_TAB으로 묶으면 여러 장). 탭 줄이 위에 붙어 있으면 카드 맨 위로 올린다.
       시대 이름이나 탭 이름(지역 · 탭)을 받는다 */
    function setEra(name) {
      var key = eraByName[name] ? tabKey(name) : name;
      var region = String(key).split(' · ')[0];
      if (tabsOf(region).indexOf(key) === -1) return;
      activeEra = key;
      saveTab('era:' + region, key);
      var tab = null;
      qsa('#era-picker .term-filter').forEach(function (b) {
        var sel = b.getAttribute('data-era-jump') === key;
        b.setAttribute('aria-pressed', sel ? 'true' : 'false');
        if (sel) tab = b;
      });
      var card = null;
      qsa('[data-era-card]').forEach(function (g) {
        g.hidden = g.getAttribute('data-era-tab') !== key;
        if (!g.hidden && !card) card = g;
      });
      if (tab) tab.scrollIntoView({ block: 'nearest', inline: 'nearest' });
      if (card && card.getBoundingClientRect().top < 60) card.scrollIntoView({ block: 'start' });
    }

    /* ---------- study: navigation ---------- */
    /* 한국사·세계사 탭은 같은 시대 화면을 지역만 바꿔 보여 준다 */
    var SCREENS = ['visits', 'korea', 'world', 'timeline', 'dictionary'];
    var REGION_OF = { korea: '한국사', world: '세계사' };
    var SCREEN_OF = { '한국사': 'korea', '세계사': 'world' };
    var currentScreen = 'visits';
    function markScreen(name) {
      currentScreen = name;
      saveTab('screen', name);
      bottomTabs.forEach(function (tab) {
        var sel = tab.getAttribute('data-screen') === name;
        tab.setAttribute('aria-selected', sel ? 'true' : 'false');
        tab.tabIndex = sel ? 0 : -1;
      });
    }
    function showScreen(name) {
      if (name === 'eras') name = SCREEN_OF[activeRegion] || 'korea';
      if (SCREENS.indexOf(name) === -1) name = 'visits';
      markScreen(name);
      var panel = REGION_OF[name] ? 'eras' : name;
      visitView.hidden = name !== 'visits';
      studyView.hidden = name === 'visits';
      studyPanels.forEach(function (p) { p.hidden = p.getAttribute('data-study-panel') !== panel; });
      if (REGION_OF[name] && activeRegion !== REGION_OF[name]) setRegion(REGION_OF[name]);
      window.scrollTo(0, 0);
    }
    function activateStudySection(section) {
      showScreen(section);
    }
    function selectTermCategory(cat) {
      activeTermCategory = cat;
      saveTab('term', cat);
      qsa('#dictionary-filters .term-filter').forEach(function (b) {
        b.setAttribute('aria-pressed', b.getAttribute('data-category') === cat ? 'true' : 'false');
      });
      qsa('[data-dictionary-category]').forEach(function (p) { p.hidden = p.getAttribute('data-dictionary-category') !== cat; });
    }
    function reveal(target) {
      if (!target) return;
      if ('open' in target) target.open = true;
      window.requestAnimationFrame(function () {
        target.focus({ preventScroll: true });
        target.scrollIntoView({ block: 'start' });
      });
    }
    function closeSearch() {
      $('study-search').value = '';
      $('study-search-results').hidden = true;
      $('study-search').setAttribute('aria-expanded', 'false');
    }
    function goTo(kind, value) {
      closeSearch();
      if (kind === 'event') {
        var ev = eventByTitle[value];
        if (!ev) return;
        activateStudySection('eras');
        var card = $(ev.id);
        qsa('.composer-card[open], .era-notes[open]').forEach(function (c) { if (c !== card) c.open = false; });
        if (eraByName[ev.era]) setRegion(eraByName[ev.era].region);
        setEra(ev.era);
        reveal(card);
        return;
      }
      if (kind === 'era') {
        activateStudySection('eras');
        if (eraByName[value]) setRegion(eraByName[value].region);
        setEra(value);
        reveal(qsa('[data-era-card]').filter(function (c) { return c.getAttribute('data-era-card') === value; })[0]);
        return;
      }
      if (kind === 'timeline') {
        activateStudySection('timeline');
        window.requestAnimationFrame(function () { studyView.scrollIntoView({ block: 'start' }); });
        return;
      }
      if (kind === 'term') {
